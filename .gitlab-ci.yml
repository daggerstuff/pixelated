# GitLab CI/CD Pipeline for Pixelated Empathy
# Clean, simple, and working pipeline

stages:
  - validate
  - test
  - terraform
  - build
  - security

variables:
  NODE_VERSION: '24.16.0'
  PNPM_VERSION: '11.3.0'
  IMAGE_NAME: $CI_REGISTRY_IMAGE
  # Terraform configuration - must be set as GitLab CI/CD project variables
  # Required for terraform jobs:
  # - TERRAFORM_VERSION (default: 1.9.0)
  # - TF_HTTP_PASSWORD (GitLab token for state backend, marked as secret)
  TERRAFORM_VERSION: '${TERRAFORM_VERSION:-1.9.0}'

# Build and image scanning are intentionally throttled to reduce CI minutes.
# They run on merge requests, schedule pipelines, release tags, and manual web runs.

# Validation jobs
validate:dependencies:
  stage: validate
  image: node:${NODE_VERSION}-slim
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3 make g++ git xz-utils >
      /dev/null
    - npm install -g pnpm@$PNPM_VERSION
  script:
    - echo "Validating dependencies..."
    - NODE_OPTIONS="--no-deprecation" pnpm install --no-frozen-lockfile
    - pnpm audit --audit-level moderate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  timeout: 15m
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

validate:lint:
  stage: validate
  image: node:${NODE_VERSION}-slim
  allow_failure: true
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3 make g++ git xz-utils >
      /dev/null
    - npm install -g pnpm@$PNPM_VERSION
  script:
    - echo "Running lint validation..."
    - NODE_OPTIONS="--no-deprecation" pnpm install --no-frozen-lockfile
    - pnpm lint:ci
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  timeout: 10m
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

validate:typecheck:
  stage: validate
  image: node:${NODE_VERSION}-slim
  allow_failure: true
  variables:
    # Increase Node.js heap size to prevent OOM during typecheck
    # Astro check can be memory-intensive with large codebases
    # Using 8GB to match dev environment requirements
    NODE_OPTIONS: '--max-old-space-size=8192'
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3 make g++ git xz-utils >
      /dev/null
    - npm install -g pnpm@$PNPM_VERSION
  script:
    - echo "Running typecheck validation..."
    - 'echo "Node.js heap size: ${NODE_OPTIONS}"'
    - NODE_OPTIONS="--no-deprecation" pnpm install --no-frozen-lockfile
    # Split typecheck into separate commands to reduce peak memory usage
    # and ensure NODE_OPTIONS is properly applied
    - NODE_OPTIONS="--max-old-space-size=8192" pnpm run check
    - NODE_OPTIONS="--max-old-space-size=8192" pnpm exec tsc --noEmit
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  timeout: 20m
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# Test jobs
test:integration:
  stage: test
  image: node:${NODE_VERSION}-slim
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3 make g++ git xz-utils >
      /dev/null
    - npm install -g pnpm@$PNPM_VERSION
  script:
    - echo "Running integration tests..."
    - NODE_OPTIONS="--no-deprecation" pnpm install --no-frozen-lockfile
    - pnpm test:integration
  artifacts:
    reports:
      junit: test-results/junit.xml
    expire_in: 1 week
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  timeout: 20m
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  allow_failure: true

# Terraform validation and plan
terraform:validate:
  stage: terraform
  image: hashicorp/terraform:${TERRAFORM_VERSION}
  before_script:
    - cd terraform
    - |
      if [ ! -f backend.config ]; then
        echo "ERROR: backend.config file not found"
        echo "Copy backend.config.example to backend.config and configure it"
        exit 1
      fi
    # Initialize terraform (without backend for validation)
    - terraform init -backend=false
  script:
    - terraform fmt -check -recursive
    - terraform validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - terraform/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - terraform/**/*
  allow_failure: true
  timeout: 10m
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

terraform:plan:
  stage: terraform
  image: hashicorp/terraform:${TERRAFORM_VERSION}
  variables:
    TF_ENVIRONMENT: '${TF_ENVIRONMENT:-staging}'
  before_script:
    - cd terraform
    - |
      if [ ! -f backend.config ]; then
        echo "ERROR: backend.config file not found"
        echo "Copy backend.config.example to backend.config and configure it"
        exit 1
      fi
    # Initialize backend
    # Note: If you see "Backend configuration changed" error, use -reconfigure flag
    - terraform init -backend-config=backend.config
  script:
    - |
      terraform plan \
        -var-file=environments/${TF_ENVIRONMENT}.tfvars \
        -out=tfplan-${TF_ENVIRONMENT} \
        -detailed-exitcode

      PLAN_EXIT_CODE=$?

      # Exit code 0 = no changes, 1 = error, 2 = changes present
      if [ $PLAN_EXIT_CODE -eq 1 ]; then
        echo "ERROR: Terraform plan failed"
        exit 1
      elif [ $PLAN_EXIT_CODE -eq 2 ]; then
        echo "Terraform plan shows changes - review output above"
      else
        echo "No changes detected"
      fi
  artifacts:
    paths:
      - terraform/tfplan-${TF_ENVIRONMENT}
    expire_in: 1 week
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $TF_HTTP_PASSWORD
      changes:
        - terraform/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $TF_HTTP_PASSWORD
      changes:
        - terraform/**/*
  environment:
    name: ${TF_ENVIRONMENT}
  timeout: 15m
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  # Note: TF_HTTP_PASSWORD must be set as a GitLab CI/CD variable (Settings > CI/CD > Variables)
  # Mark it as protected and masked

  # Build job - GitLab Container Registry
build:
  stage: build
  image: docker:latest
  # Heavy job: only run on controlled events to preserve CI minutes
  services:
    - docker:dind
  needs:
    - job: validate:dependencies
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    # Validate Docker registry variables are set
    - |
      if [ -z "$CI_REGISTRY_USER" ] || [ -z "$CI_REGISTRY_PASSWORD" ] || [ -z "$CI_REGISTRY" ]; then
        echo "ERROR: Docker registry variables are not set."
        echo "GitLab CI/CD should provide these automatically, but if missing:"
        echo "  - CI_REGISTRY_USER"
        echo "  - CI_REGISTRY_PASSWORD"
        echo "  - CI_REGISTRY"
        echo "Check: Settings > CI/CD > Variables"
        exit 1
      fi
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building application..."
    - docker build --cache-from ${IMAGE_NAME}:latest -t
      ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} .
    - docker tag ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ${IMAGE_NAME}:latest
    - docker push ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    - docker push ${IMAGE_NAME}:latest
    - echo "Build completed"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never
  timeout: 30m
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  # Security scanning
security:scan:
  stage: security
  image: docker:latest
  # Expensive image scan follows the same throttled schedule as build
  services:
    - docker:dind
  needs:
    - job: build
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    # Install Trivy (latest version)
    - apk add --no-cache curl
    - curl -sfL
      https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh
      | sh -s -- -b /usr/local/bin
    # Validate Docker registry variables are set
    - |
      if [ -z "$CI_REGISTRY_USER" ] || [ -z "$CI_REGISTRY_PASSWORD" ] || [ -z "$CI_REGISTRY" ]; then
        echo "ERROR: Docker registry variables are not set."
        echo "GitLab CI/CD should provide these automatically, but if missing:"
        echo "  - CI_REGISTRY_USER"
        echo "  - CI_REGISTRY_PASSWORD"
        echo "  - CI_REGISTRY"
        echo "Check: Settings > CI/CD > Variables"
        exit 1
      fi
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Running security scan..."
    - docker pull ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    # Exit code 1 on CRITICAL, 0 on HIGH (warnings only)
    # Consider changing to --exit-code 1 if you want HIGH severity to fail the pipeline
    - trivy image --severity CRITICAL --exit-code 1 --format table
      ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    - trivy image --severity HIGH --exit-code 0 --format table
      ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} || true
    - echo "Security scan completed"
  artifacts:
    reports:
      container_scanning: gl-container-scanning-report.json
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never
  timeout: 20m
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# Coverage report (consolidated TS + Python)
coverage:report:
  stage: test
  image: node:${NODE_VERSION}-slim
  needs:
    - job: test:integration
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3 make g++ git xz-utils curl >
      /dev/null
    - npm install -g pnpm@$PNPM_VERSION
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    - echo "Generating consolidated coverage report..."
    - NODE_OPTIONS="--no-deprecation" pnpm install --no-frozen-lockfile
    - chmod +x scripts/consolidate-coverage.sh
    - COVERAGE_TIMEOUT=600 ./scripts/consolidate-coverage.sh
  artifacts:
    paths:
      - coverage/
    expire_in: 1 month
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  timeout: 20m

# Note: Kubernetes deployment is handled through the Azure AKS deployment system.
# This GitLab pipeline remains focused on validation, testing, build, and security jobs.
