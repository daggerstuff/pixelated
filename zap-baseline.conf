#  - 10027: informational response-content-type notes for static assets
#  - 10098: cross-domain config file (ads.txt) — intentionally absent
#  - 90011: fingerprinting via X-Powered-By only appears in the preview
#    server, not the production build served by the cluster
10010	IGNORE
10015	IGNORE
10027	IGNORE
10098	IGNORE
90011	IGNORE
