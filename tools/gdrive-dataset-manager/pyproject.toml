[project]
name = "gdrive-dataset-manager"
version = "0.1.0"
description = "Indexes Google Drive files (docs, PDFs, spreadsheets, transcribed media) into pgvector for semantic search"
requires-python = ">=3.13,<3.14"
dependencies = [
  "google-api-python-client>=2.150.0",
  "google-auth-oauthlib>=1.2.1",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3.6",
  "sentence-transformers>=5.7.0",
  "faster-whisper>=1.2.0",
  "pymupdf>=1.24",
  "openpyxl>=3.1.5",
  "typer>=0.12",
  "python-dotenv>=1.2.1",
]

[project.scripts]
gdrive-sync = "gdrive_index.cli:app"
gdrive-search = "gdrive_index.cli:app"
gdrive-status = "gdrive_index.cli:app"
gdrive-auth = "gdrive_index.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-mock>=3.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gdrive_index"]
