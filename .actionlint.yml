# actionlint configuration for the Pixelated Empathy repo.
# Docs: https://github.com/rhysd/actionlint/blob/main/docs/config.md
#
# We disable actionlint's built-in shellcheck invocation because we run
# shellcheck separately in .github/workflows/shellcheck.yml with its own
# severity threshold and a narrower file set. Avoid running it twice.
disabled-rules:
  # Disable actionlint's built-in shellcheck invocation. We run
  # shellcheck separately in .github/workflows/shellcheck.yml with
  # its own severity threshold and a narrower file set, so we don't
  # want actionlint to also lint the embedded shell snippets.
  - shellcheck-built-in

# Allow self-hosted runner labels referenced in any workflow. If we ever
# add a self-hosted runner, list its label here so actionlint stops
# warning about an unknown label. (No self-hosted runners configured
# today; section kept as documentation for future setup.)
self-hosted-runner:
  labels: []
  matrix: {}

# config-variables are not used today; empty sections are fine.
config-variables: null