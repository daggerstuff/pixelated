name: Deploy to ECS Fargate (Staging)

permissions:
  contents: read
  id-token: write

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches: [staging]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Optional image tag to deploy for rollback or redeploy.'
        required: false
        type: string

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: pixelated-empathy-api
  ECS_CLUSTER: pixelated-empathy-staging
  ECS_SERVICE: pixelated-empathy-staging-api
  ECS_TASK_DEFINITION: .aws/ecs-task-definition.json
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure IAM has ListDeployments and stop active deployment
        continue-on-error: true
        run: |
          # Self-heal: add ListDeployments if missing from the inline policy
          POLICY_NAME="pixelated-empathy-github-actions-policy"
          ROLE_NAME="pixelated-empathy-github-actions"
          # Get the current policy and inject ListDeployments if not present
          CURRENT=$(aws iam get-role-policy --role-name "$ROLE_NAME" --policy-name "$POLICY_NAME" --query 'PolicyDocument' --output json 2>/dev/null || echo "")
          if [ -n "$CURRENT" ] && ! echo "$CURRENT" | grep -q "ListDeployments"; then
            echo "Adding ListDeployments to IAM policy..."
            UPDATED=$(echo "$CURRENT" | sed 's/"codedeploy:GetDeploymentConfig"/"codedeploy:GetDeploymentConfig","codedeploy:ListDeployments"/')
            aws iam put-role-policy --role-name "$ROLE_NAME" --policy-name "$POLICY_NAME" --policy-document "$UPDATED"
            echo "Waiting 10s for IAM propagation..."
            sleep 10
          fi

          # Now find and stop any active deployment
          for DEP_ID in $(aws deploy list-deployments \
            --application-name pixelated-empathy-ecs \
            --deployment-group-name pixelated-empathy-ecs-dg \
            --include-only-statuses Created Queued InProgress \
            --query 'deployments' --output text 2>/dev/null); do
            echo "Stopping active deployment: $DEP_ID"
            aws deploy stop-deployment --deployment-id "$DEP_ID" --auto-rollback-enabled
            echo "Waiting 15s for rollback..."
            sleep 15
          done
          echo "Done."

      - name: Determine image tag
        id: vars
        run: |
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            IMAGE_TAG="${{ inputs.image_tag }}"
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"
          else
            IMAGE_TAG="${GITHUB_SHA}"
          fi
          echo "IMAGE_TAG=${IMAGE_TAG:0:7}" >> $GITHUB_ENV
          echo "image_tag=${IMAGE_TAG:0:7}" >> $GITHUB_OUTPUT

      - name: Resolve image URI for redeploy
        if: inputs.image_tag != ''
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.vars.outputs.image_tag }}"
          echo "Using existing image: $IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Set up QEMU (multi-arch build support)
        if: inputs.image_tag == ''
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: inputs.image_tag == ''
        uses: docker/setup-buildx-action@v3

      - name: Build and push ARM64 image
        if: inputs.image_tag == ''
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.vars.outputs.image_tag }}"
          echo "Building ARM64 image: $IMAGE_URI"
          docker buildx build \
            --platform linux/arm64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -f docker/Dockerfile.production \
            -t "$IMAGE_URI" \
            --push \
            .
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Render new task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: pixelated-empathy-api
          image: ${{ env.IMAGE_URI }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          codedeploy-appspec: .aws/appspec.json
          codedeploy-application: pixelated-empathy-ecs
          codedeploy-deployment-group: pixelated-empathy-ecs-dg
