name: Deploy to ECS Fargate (Staging)

permissions:
  contents: read
  id-token: write

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches: [staging]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Optional image tag to deploy for rollback or redeploy.'
        required: false
        type: string

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: pixelated-empathy-api
  ECS_CLUSTER: pixelated-empathy-staging
  ECS_SERVICE: pixelated-empathy-staging-api
  ECS_TASK_DEFINITION: .aws/ecs-task-definition.json

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine image tag
        id: vars
        run: |
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            IMAGE_TAG="${{ inputs.image_tag }}"
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"
          else
            IMAGE_TAG="${GITHUB_SHA}"
          fi
          echo "IMAGE_TAG=${IMAGE_TAG:0:7}" >> $GITHUB_ENV
          echo "image_tag=${IMAGE_TAG:0:7}" >> $GITHUB_OUTPUT

      - name: Set up QEMU (multi-arch build support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ARM64 image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.vars.outputs.image_tag }}"
          echo "Building ARM64 image: $IMAGE_URI"
          docker buildx build \
            --platform linux/arm64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -f docker/Dockerfile.production \
            -t "$IMAGE_URI" \
            --push \
            .
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Render new task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: pixelated-empathy-api
          image: ${{ env.IMAGE_URI }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          codedeploy-appspec: .aws/appspec.json
          codedeploy-application: pixelated-empathy-ecs
          codedeploy-deployment-group: pixelated-empathy-ecs-dg
