name: Deploy to ECS Fargate (Staging)

permissions:
  contents: read
  id-token: write

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches: [staging]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Optional image tag to deploy for rollback or redeploy.'
        required: false
        type: string

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: pixelated-empathy-api
  ECS_CLUSTER: pixelated-empathy-staging
  ECS_SERVICE: pixelated-empathy-staging-api
  ECS_TASK_DEFINITION: .aws/ecs-task-definition.json
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure IAM has ListDeployments and stop active deployment
        continue-on-error: false
        run: |
          # Self-heal: add ListDeployments if missing from the inline policy
          POLICY_NAME="pixelated-empathy-github-actions-policy"
          ROLE_NAME="pixelated-empathy-github-actions"
          # Get the current policy and inject ListDeployments if not present
          CURRENT=$(aws iam get-role-policy --role-name "$ROLE_NAME" --policy-name "$POLICY_NAME" --query 'PolicyDocument' --output json || echo "")
          if [ -n "$CURRENT" ] && ! echo "$CURRENT" | grep -q "ListDeployments"; then
            echo "Adding ListDeployments to IAM policy..."
            UPDATED=$(echo "$CURRENT" | sed 's/"codedeploy:GetDeploymentConfig"/"codedeploy:GetDeploymentConfig","codedeploy:ListDeployments"/')
            aws iam put-role-policy --role-name "$ROLE_NAME" --policy-name "$POLICY_NAME" --policy-document "$UPDATED"
            echo "Waiting 10s for IAM propagation..."
            sleep 10
          fi

          # Diagnostic: show all deployment statuses
          echo "=== Current deployments ==="
          aws deploy list-deployments \
            --application-name pixelated-empathy-ecs \
            --deployment-group-name pixelated-empathy-ecs-dg \
            --query 'deployments' --output text || true

          # Now find and stop any active deployment (exclude terminal states)
          ACTIVE=$(aws deploy list-deployments \
            --application-name pixelated-empathy-ecs \
            --deployment-group-name pixelated-empathy-ecs-dg \
            --query 'deployments' --output text || true)

          if [ -n "$ACTIVE" ]; then
            for DEP_ID in $ACTIVE; do
              STATUS=$(aws deploy get-deployment --deployment-id "$DEP_ID" --query 'deploymentInfo.status' --output text)
              echo "Deployment $DEP_ID status: $STATUS"
              if [ "$STATUS" != "Succeeded" ] && [ "$STATUS" != "Failed" ] && [ "$STATUS" != "Stopped" ]; then
                echo "Stopping deployment $DEP_ID (status: $STATUS)..."
                aws deploy stop-deployment --deployment-id "$DEP_ID" --auto-rollback-enabled || true
              fi
            done
            echo "Waiting 30s for rollbacks to settle..."
            sleep 30
          fi
          # Second sweep: any new rollback deployments that became active
          ACTIVE2=$(aws deploy list-deployments \
            --application-name pixelated-empathy-ecs \
            --deployment-group-name pixelated-empathy-ecs-dg \
            --query 'deployments' --output text || true)
          if [ -n "$ACTIVE2" ]; then
            for DEP_ID in $ACTIVE2; do
              STATUS=$(aws deploy get-deployment --deployment-id "$DEP_ID" --query 'deploymentInfo.status' --output text)
              echo "Post-stop deployment $DEP_ID status: $STATUS"
              if [ "$STATUS" != "Succeeded" ] && [ "$STATUS" != "Failed" ] && [ "$STATUS" != "Stopped" ]; then
                echo "Stopping post-rollback deployment $DEP_ID..."
                aws deploy stop-deployment --deployment-id "$DEP_ID" --auto-rollback-enabled || true
              fi
            done
            echo "Waiting 30s for second round to settle..."
            sleep 30
          fi
          echo "Done."

      - name: Fix ALB target group health check path
        continue-on-error: true
        run: |
          for TG in pixelated-empathy-staging-tg pixelated-empathy-staging-green; do
            echo "Updating health check for $TG..."
            aws elbv2 modify-target-group \
              --target-group-name "$TG" \
              --health-check-path "/health" 2>/dev/null && \
              echo "  Updated $TG to /health" || \
              echo "  Skipped $TG (not found or already correct)"
          done

      - name: Determine image tag
        id: vars
        run: |
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            IMAGE_TAG="${{ inputs.image_tag }}"
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"
          else
            IMAGE_TAG="${GITHUB_SHA}"
          fi
          echo "IMAGE_TAG=${IMAGE_TAG:0:7}" >> $GITHUB_ENV
          echo "image_tag=${IMAGE_TAG:0:7}" >> $GITHUB_OUTPUT

      - name: Resolve image URI for redeploy
        if: inputs.image_tag != ''
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.vars.outputs.image_tag }}"
          echo "Using existing image: $IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Set up QEMU (multi-arch build support)
        if: inputs.image_tag == ''
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: inputs.image_tag == ''
        uses: docker/setup-buildx-action@v3

      - name: Build and push ARM64 image
        if: inputs.image_tag == ''
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.vars.outputs.image_tag }}"
          echo "Building ARM64 image: $IMAGE_URI"
          docker buildx build \
            --platform linux/arm64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -f docker/Dockerfile.production \
            -t "$IMAGE_URI" \
            --push \
            .
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Render new task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: pixelated-empathy-api
          image: ${{ env.IMAGE_URI }}

      - name: Deploy via CodeDeploy
        run: |
          # Register the new task definition and get the ARN
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://${{ steps.render-task-def.outputs.task-definition }} \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered task def: $TASK_DEF_ARN"

          # Build appspec with replaced task definition ARN, write to temp file
          python3 -c "
          import json, sys
          with open('.aws/appspec.json') as f:
              appspec = json.load(f)
          appspec['Resources'][0]['TargetService']['Properties']['TaskDefinition'] = '$TASK_DEF_ARN'
          with open('/tmp/appspec.json', 'w') as f:
              json.dump(appspec, f)
          print('Appspec written to /tmp/appspec.json')
          "

          # Build revision JSON using Python to avoid shell quoting issues
          python3 -c "
          import json
          with open('/tmp/appspec.json') as f:
              appspec = json.load(f)
          revision = {
              'revisionType': 'AppSpecContent',
              'appSpecContent': {'content': json.dumps(appspec)}
          }
          with open('/tmp/revision.json', 'w') as f:
              json.dump(revision, f)
          print('Revision written to /tmp/revision.json')
          "

          # Trigger CodeDeploy deployment with auto-rollback on failure
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name pixelated-empathy-ecs \
            --deployment-group-name pixelated-empathy-ecs-dg \
            --revision file:///tmp/revision.json \
            --auto-rollback-configuration '{"enabled":true,"events":["DEPLOYMENT_FAILURE"]}' \
            --query 'deploymentId' --output text)
          echo "Deployment triggered: $DEPLOYMENT_ID"

          # Poll deployment status for up to 20 minutes
          echo "Waiting for CodeDeploy deployment $DEPLOYMENT_ID..."
          for i in $(seq 1 120); do
            STATUS=$(aws deploy get-deployment --deployment-id "$DEPLOYMENT_ID" \
              --query 'deploymentInfo.status' --output text)
            OVERVIEW=$(aws deploy get-deployment --deployment-id "$DEPLOYMENT_ID" \
              --query 'deploymentInfo.deploymentOverview' --output text)
            echo "[$i] Status: $STATUS | Overview: $OVERVIEW"

            case "$STATUS" in
              Succeeded)
                echo "Deployment succeeded!"
                exit 0
                ;;
              Failed|Stopped)
                echo "Deployment failed with status: $STATUS"
                aws deploy get-deployment --deployment-id "$DEPLOYMENT_ID" \
                  --query 'deploymentInfo.errorInformation.message' --output text
                exit 1
                ;;
              Ready)
                echo "Deployment in Ready state — continuing..."
                ;;
            esac
            sleep 10
          done
          echo "Deployment timed out after 20 minutes"
          exit 1
