name: autofix.ci # needed to securely identify the workflow

on:
  pull_request:
  push:
    branches: ['main']
permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ----------------------------------------------------------------------
      # TypeScript / JavaScript / Astro (pnpm + oxlint / oxfmt / prettier)
      # ----------------------------------------------------------------------
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24.16.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fix lint errors (mirrors `pnpm lint:fix`)
      - run: pnpm exec oxlint --fix-dangerously -c .oxlintrc.json .
      # Format TS/JS/JSON/... via oxfmt (mirrors `pnpm format`)
      - run: pnpm exec oxfmt --write .
      # Format Astro templates via prettier (mirrors `pnpm format`)
      - run: pnpm exec prettier --write "**/*.astro"

      # ----------------------------------------------------------------------
      # Python (uv + ruff)
      # ----------------------------------------------------------------------
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3
        with:
          version: '0.4.20'
      # Fix lint errors, then format code
      - run: uv tool install "ruff>=0.15.17"
      - run: ruff check --fix-only .
      - run: ruff format .

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a
