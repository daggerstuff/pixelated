name: DB Migrate

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'db/migrations/**'
      - 'src/lib/db/**'
      - 'scripts/db-migrate.ts'
      - '.github/workflows/db-migrate.yml'
  schedule:
    # Daily safety net at 4:00 UTC — applies anything a push missed.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply pending migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Target database: the existing DATABASE_URL secret (the shared
      # LiteLLM/Prisma Postgres that hosts users/consent_records and already
      # carries a legacy schema_migrations table with version/applied_at
      # columns). The runner reconciles that legacy table to the app-shaped
      # name/executed_at form on first run so new tables like consent_records
      # never lag the deploy pipeline.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify DATABASE_URL secret is configured
        if: env.DATABASE_URL == ''
        run: |
          echo "::error::DATABASE_URL secret is not set."
          echo "Add it under repository Settings -> Secrets and variables -> Actions."
          echo "It must point at the Postgres database that hosts the app tables"
          echo "(users, sessions, consent_records) for migrations to apply against."
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply pending migrations
        run: pnpm db:migrate

      - name: Show migration status
        if: always()
        run: pnpm db:status
