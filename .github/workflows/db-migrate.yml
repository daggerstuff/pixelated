name: DB Migrate

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'db/migrations/**'
      - 'apps/web/src/lib/db/**'
      - 'scripts/db-migrate.ts'
      - '.github/workflows/db-migrate.yml'
  schedule:
    # Daily safety net at 4:00 UTC — applies anything a push missed.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply pending migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Target database: the Pixelated app's dedicated Postgres (the `pixelated`
      # database in the Neon project, configured as APP_DATABASE_URL). It is a
      # fresh, app-shaped database so migrations 001-013 (which FK to
      # users(id)) apply cleanly. This is intentionally separate from the
      # consent workflow's DATABASE_URL, which points at the shared
      # LiteLLM/Prisma database that cannot host these migrations.
      DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
      # 30-second connection timeout allows cold-start wake up of serverless Neon Postgres
      DB_CONNECTION_TIMEOUT: '30000'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify APP_DATABASE_URL secret is configured
        if: env.DATABASE_URL == ''
        run: |
          echo "::error::APP_DATABASE_URL secret is not set."
          echo "Add it under repository Settings -> Secrets and variables -> Actions."
          echo "It must point at the Pixelated app's dedicated Postgres database"
          echo "(the fresh `pixelated` DB) for migrations 001-013 to apply against."
          exit 1

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '24.16.0'

      - name: Apply pending migrations
        run: pnpm db:migrate

      - name: Show migration status
        if: always()
        run: pnpm db:status
