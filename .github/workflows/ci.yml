name: CI

permissions:
  contents: read

on:
  push:
    branches: [staging]
    paths:
      - 'apps/web/src/**'
      - 'ai/**'
      - 'infra/docker/**'
      - 'infra/k8s/**'
      - 'terraform/**'
      - 'scripts/**'
      - 'config/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'pyproject.toml'
      - '.editorconfig'
      - '.dockerignore'
      - '.vscode/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [staging]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VITEST_COVERAGE_ENABLED: false
      PNPM_CACHE_VERSION: v2
      REDIS_URL: ${{ secrets['REDIS_URL'] }}
      UPSTASH_REDIS_REST_URL: ${{ secrets['UPSTASH_REDIS_REST_URL'] }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets['UPSTASH_REDIS_REST_TOKEN'] }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Initialize submodules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/devops/init-submodules.sh

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '24.16.0'
          # pnpm-version omitted — auto-detects from package.json packageManager field
          cache-key-prefix: '${{ env.PNPM_CACHE_VERSION }}'

      - name: Format check
        env:
          PR_BASE_SHA:
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.base.sha || '' }}
        run: |
          bash scripts/ci/get-changed-files.sh /tmp/changed_files.txt
          if [ -s /tmp/changed_files.txt ]; then
            pnpm format:check:changed /tmp/changed_files.txt
          else
            echo "No files changed in this commit; skipping formatting check."
          fi

      - name: Check for unresolved imports
        run: pnpm lint:ci:imports

      - name: Lint code (type-aware)
        run: pnpm lint:ci

      - name: Type check
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: pnpm lint:ci:type-aware

      - name: Lint markdown
        run: pnpm lint:markdown:ci

      - name: Check for unused exports
        run: pnpm lint:ci:unused-exports

      - name: Check astro hints against baseline
        run: node scripts/ci/check-astro-hints.mjs

      - name: Run unit tests
        run: |
          # Blocking suite — fails CI on test failures. The full unbucketed
          # corpus hangs without Redis/Mongo/Auth0 (run 30737434511, exit 124)
          # so only the core bucket runs here as a fast smoke.
          VITEST_BUCKET=core timeout 15m pnpm test:blocking
          VITEST_BUCKET=security timeout 10m pnpm test:blocking || echo "::warning::Security test bucket failed (non-blocking)"

      - name: Build Docker image
        id: build-image
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          docker build --pull --no-cache -f infra/docker/Dockerfile.production -t "pixelatedempathy/api:$IMAGE_TAG" .

      - name: Security scan
        id: trivy_scan
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          NODE_OPTIONS:
            ${{ vars.TRACE_TRIVY_DEPRECATION == 'true' && '--trace-deprecation'
            || '--no-deprecation' }}
        with:
          image-ref:
            pixelatedempathy/api:${{ steps.build-image.outputs.image_tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'
          ignore-unfixed: true
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true

      - name: Upload Trivy scan results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Trivy Scan Results
          path: trivy-results.sarif
          retention-days: 30

      - name: Summarize Trivy scan results
        if: always() && hashFiles('trivy-results.sarif') != ''
        id: trivy_summary
        run: |
          echo "Trivy step outcome: ${{ steps.trivy_scan.outcome }}"
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq not installed; skip precise finding count."
            exit 0
          fi
          findings="$(jq -r '.runs[0].results | length // 0' trivy-results.sarif)"
          echo "critical_or_high_findings=$findings" >> "$GITHUB_OUTPUT"
          if [[ "$findings" -gt 0 ]]; then
            echo "::warning::Trivy found ${findings} CRITICAL/HIGH vulnerabilities in image scan."
          else
            echo "No CRITICAL/HIGH vulnerabilities found."
          fi

      - name: Security gate (active)
        if: always() && hashFiles('trivy-results.sarif') != ''
        run: |
          findings="${{ steps.trivy_summary.outputs.critical_or_high_findings || '0' }}"
          if [[ "$findings" -gt 0 ]]; then
            echo "::error::Trivy gate: ${findings} CRITICAL/HIGH vulnerabilities detected. Failing build. Inspect at: https://github.com/${{ github.repository }}/security/code-scanning"
            exit 1
          else
            echo "✅ Trivy gate: no CRITICAL/HIGH vulnerabilities detected."
          fi
