name: Lighthouse CI

permissions:
  contents: read
  pull-requests: write
  statuses: write

on:
  pull_request:
    branches: [staging]
    paths:
      - 'apps/web/src/**'
      - 'apps/web/public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.lighthouserc.json'
      - '.github/workflows/lighthouse.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PNPM_CONFIG_TRUST_LOCKFILE: 'true'
  NODE_VERSION: 24.16.0
  LHCI_PORT: 4323

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Initialize submodules
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/devops/init-submodules.sh

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-key-prefix: 'lhci'

      - name: Build Astro site
        run: pnpm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.15.x

      - name: Start preview server
        run: |
          nohup env HOST=127.0.0.1 PORT="${LHCI_PORT}" WEBSITES_PORT="${LHCI_PORT}" \
            JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            pnpm run start > /tmp/pixelated-preview.log 2>&1 &
          echo "PREVIEW_PID=$!" >> "$GITHUB_ENV"

          echo "Waiting for preview server on port ${LHCI_PORT}..."
          for attempt in $(seq 1 60); do
            if curl -sS --connect-timeout 2 --max-time 5 \
                "http://127.0.0.1:${LHCI_PORT}/" > /dev/null 2>&1; then
              echo "Preview server ready at http://127.0.0.1:${LHCI_PORT}"
              exit 0
            fi
            sleep 1
          done

          echo "Preview server failed to start within 60s"
          tail -n 80 /tmp/pixelated-preview.log || true
          exit 1

      - name: Run Lighthouse CI
        run: lhci autorun
        env:
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop preview server
        if: always()
        run: |
          if [[ -n "${PREVIEW_PID:-}" ]] && kill -0 "${PREVIEW_PID}" > /dev/null 2>&1; then
            kill "${PREVIEW_PID}" 2>/dev/null || true
            wait "${PREVIEW_PID}" 2>/dev/null || true
          fi

      - name: Upload LHCI results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lhci-report-${{ github.run_id }}
          path: .lighthouseci
          # .lighthouseci is a hidden directory — without this the upload
          # silently matches nothing and the PR comment's artifact link is dead.
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn

      - name: Post Lighthouse report to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const lhciDir = path.join(process.cwd(), '.lighthouseci');
            const CATEGORIES = [
              { key: 'performance', label: 'Performance' },
              { key: 'accessibility', label: 'Accessibility' },
              { key: 'best-practices', label: 'Best Practices' },
            ];

            // Thresholds come from .lighthouserc.json (single source of truth);
            // fall back to the previously hardcoded values if it can't be read.
            // (Note: the old comment claimed Performance >= 90, but the config
            // enforces minScore 0.7 — deriving it here fixes that drift.)
            let thresholds = { performance: 90, accessibility: 90, 'best-practices': 85 };
            try {
              const rc = JSON.parse(fs.readFileSync(path.join(process.cwd(), '.lighthouserc.json'), 'utf8'));
              const assertions = (((rc || {}).ci || {}).assert || {}).assertions || {};
              for (const { key } of CATEGORIES) {
                const rule = assertions[`categories:${key}`];
                const minScore = Array.isArray(rule) && rule[1] && rule[1].minScore;
                if (typeof minScore === 'number') thresholds[key] = Math.round(minScore * 100);
              }
            } catch (e) {
              console.log('Could not read .lighthouserc.json thresholds, using defaults.');
            }

            function median(xs) {
              const s = [...xs].sort((a, b) => a - b);
              const m = Math.floor(s.length / 2);
              return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
            }

            // Median category score per route across the collected runs, with a
            // pass/fail mark against the configured thresholds. Returns ''
            // when no usable run JSON is present (comment falls back to the
            // report-file list, as before).
            function buildScoreTable(jsonPaths) {
              const byRoute = new Map();
              for (const p of jsonPaths) {
                let lhr;
                try {
                  lhr = JSON.parse(fs.readFileSync(p, 'utf8'));
                } catch {
                  continue;
                }
                const categories = (lhr && lhr.categories) || {};
                let route;
                try {
                  const u = new URL(lhr.finalUrl || lhr.requestedUrl || '');
                  route = u.pathname + u.search;
                } catch {
                  route = path.basename(p, '.report.json');
                }
                if (!byRoute.has(route)) byRoute.set(route, {});
                const entry = byRoute.get(route);
                for (const { key } of CATEGORIES) {
                  const score = categories[key] && categories[key].score;
                  if (typeof score === 'number') {
                    if (!entry[key]) entry[key] = [];
                    entry[key].push(score);
                  }
                }
              }
              if (byRoute.size === 0) return '';
              const header = `| Route | ${CATEGORIES.map(c => c.label).join(' | ')} |`;
              const divider = `| --- | ${CATEGORIES.map(() => '---').join(' | ')} |`;
              let failures = 0;
              const rows = [];
              for (const [route, entry] of byRoute) {
                const cells = CATEGORIES.map(({ key }) => {
                  const vals = entry[key] || [];
                  if (!vals.length) return 'n/a';
                  const pct = Math.round(median(vals) * 100);
                  const pass = pct >= (thresholds[key] ?? 0);
                  if (!pass) failures++;
                  return `${pct} ${pass ? '✅' : '❌'}`;
                });
                rows.push(`| \`${route}\` | ${cells.join(' | ')} |`);
              }
              const verdict = failures === 0
                ? `**Verdict:** ✅ all routes within budget`
                : `**Verdict:** ❌ ${failures} check(s) below threshold`;
              return `${verdict} (median of collected runs)\n\n${header}\n${divider}\n${rows.join('\n')}\n`;
            }

            let reportLinks = [];
            let scoreTable = '';
            try {
              const files = fs.readdirSync(lhciDir);
              const htmlFiles = files.filter(f => f.endsWith('.html'));
              const jsonFiles = files.filter(f => f.endsWith('.report.json'));

              for (const file of htmlFiles) {
                const name = path.basename(file, '.html');
                reportLinks.push(`- ${name}`);
              }
              scoreTable = buildScoreTable(jsonFiles.map(f => path.join(lhciDir, f)));
            } catch (e) {
              reportLinks.push('- Report files not found (see artifacts)');
            }

            let body = `## Lighthouse CI Results\n\n` +
              `**Routes audited:** \`/\`, \`/dashboard?perf=1\`, \`/training-session\`\n\n` +
              `**Thresholds:** ${CATEGORIES.map(c => `${c.label} ≥${thresholds[c.key]}`).join(' | ')}\n\n` +
              (scoreTable ? `### Scores\n${scoreTable}\n` : '') +
              `### Reports\n${reportLinks.join('\n') || '- See workflow artifacts for details'}\n\n` +
              `>Reports are also available as [workflow artifacts](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

            // Update the existing report comment instead of posting a new one
            // on every run — one comment per PR, always showing the latest run.
            body = body.replace('## Lighthouse CI Results\n\n', '## Lighthouse CI Results\n\n<!-- lhci-report -->\n\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes('<!-- lhci-report -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
