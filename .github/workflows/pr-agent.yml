name: Qodo Merge (PR-Agent)

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-agent:
    name: AI PR Code Review
    # Self-gating: without Workers AI credentials there is nothing to
    # call — skip silently instead of failing every run and posting a
    # failure comment on every PR. Gate is a step output (evaluated per run).
    if: github.event_name == 'pull_request' || (github.event.issue.pull_request && startsWith(github.event.comment.body, '/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check Workers AI credentials
        id: gateway
        env:
          CLOUDFLARE_AI_API_KEY: ${{ secrets.CLOUDFLARE_AI_API_KEY }}
        run: |
          if [ -n "$CLOUDFLARE_AI_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_AI_API_KEY is not set — skipping PR-Agent"
          fi

      - name: Run PR Agent
        if: steps.gateway.outputs.configured == 'true'
        uses: Codium-ai/pr-agent@ef5a40031b21658e4657db44d6618e22db34ed8b # main (pinned)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cloudflare Workers AI via LiteLLM's cloudflare/ provider prefix —
          # the same account + key contract as the repo's own
          # workers-ai-provider clients (agents/*/agent/lib/workers-ai.ts).
          # NOTE: no OPENAI_* vars here on purpose. The repo's nt_live_*
          # keys only work against the Neon gateway; sending them to the
          # Cloudflare gateway base URL got every call rejected with
          # 401/2009 and a failure comment on every PR.
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_AI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Repo-primary Workers AI chat model (agents/*/agent/lib/workers-ai.ts
          # MODEL). Dotted lowercase form — uppercase variants of these keys
          # are silently ignored by the action.
          config.model: 'cloudflare/@cf/meta/llama-3.2-3b-instruct'
          config.custom_model_max_tokens: '32000'
          CONFIG.AUTO_REVIEW: 'true'
          CONFIG.AUTO_DESCRIBE: 'false'
          CONFIG.AUTO_IMPROVE: 'false'
          PR_REVIEWER.REQUIRE_ALL_CHECKS_PASSED: 'false'
          PR_REVIEWER.EXTRA_INSTRUCTIONS: 'Focus on defects, HIPAA/PHI privacy compliance, data leakage, concurrency issues, and test regressions. Keep findings clear and actionable.'
