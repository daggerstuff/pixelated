name: Qodo Merge (PR-Agent)

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-agent:
    name: AI PR Code Review
    if: github.event_name == 'pull_request' || (github.event.issue.pull_request && startsWith(github.event.comment.body, '/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Run PR Agent
        uses: Codium-ai/pr-agent@a8c604794ddb5766dc3fa674cbb64aac6f9f509f # main (pinned)
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY || secrets.OPENAI_API_KEY || secrets.LLM_API_KEY }}
          OPENAI__KEY: ${{ secrets.OPENAI_KEY || secrets.OPENAI_API_KEY || secrets.LLM_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || vars.OPENAI_BASE_URL }}
          OPENAI__API_BASE: ${{ secrets.OPENAI_BASE_URL || vars.OPENAI_BASE_URL }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY || secrets.GOOGLE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG.AUTO_REVIEW: "true"
          CONFIG.AUTO_DESCRIBE: "false"
          CONFIG.AUTO_IMPROVE: "false"
          PR_REVIEWER.REQUIRE_ALL_CHECKS_PASSED: "false"
          PR_REVIEWER.EXTRA_INSTRUCTIONS: "Focus on defects, HIPAA/PHI privacy compliance, data leakage, concurrency issues, and test regressions. Keep findings clear and actionable."
