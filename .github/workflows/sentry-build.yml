name: Build & Sentry Release

permissions:
  contents: read
  packages: write  # Required: GHCR push via docker/login-action with GITHUB_TOKEN

on:
  push:
    branches: [main, master, staging]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # pnpm 11.5+ verifies lockfile supply-chain policy on every install; CI uses
  # trust-lockfile because minimumReleaseAgeExclude does not apply during verification.
  PNPM_CONFIG_TRUST_LOCKFILE: 'true'

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      NODE_OPTIONS: '--max-old-space-size=8192'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize submodules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/devops/init-submodules.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0

      - name: Get pnpm store path
        id: pnpm-store
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 build-essential
          npm install -g node-gyp

      - name: Install dependencies
        run: |
          PNPM_CONFIG_TRUST_LOCKFILE=true pnpm install --no-frozen-lockfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Build (with Sentry envs if provided)
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_PUBLIC_DSN }}
          PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_PUBLIC_DSN }}
          SENTRY_PUBLIC_DSN: ${{ secrets.SENTRY_PUBLIC_DSN }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_PUBLIC_DSN }}
          SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          echo "Building with SENTRY_RELEASE=${SENTRY_RELEASE}"
          pnpm build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags:
            ghcr.io/${{ github.repository_owner }}/pixelated:${{ github.sha }}
          provenance: false
