name: Build & Sentry Release

permissions:
  contents: read
  packages: write # Required: GHCR push via docker/login-action with GITHUB_TOKEN

on:
  # A production build + Sentry release should track what actually shipped,
  # not every push. It fires when a staging deploy completes (the deploy
  # workflow builds and rolls out the same commit), so SENTRY_RELEASE
  # (github.sha) always matches a deployed version.
  workflow_run:
    workflows: [Deploy to AWS EKS]
    types: [completed]
    branches: [staging]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # pnpm 11.5+ verifies lockfile supply-chain policy on every install; CI uses
  # trust-lockfile because minimumReleaseAgeExclude does not apply during verification.
  PNPM_CONFIG_TRUST_LOCKFILE: 'true'

jobs:
  build:
    if:
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      NODE_OPTIONS: '--max-old-space-size=8192'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize submodules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/devops/init-submodules.sh

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '24.16.0'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Build (with Sentry envs if provided)
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_PUBLIC_DSN }}
          PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_PUBLIC_DSN }}
          SENTRY_PUBLIC_DSN: ${{ secrets.SENTRY_PUBLIC_DSN }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_PUBLIC_DSN }}
          SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          echo "Building with SENTRY_RELEASE=${SENTRY_RELEASE}"
          pnpm build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./infra/Dockerfile
          push: true
          # Reuse the deploy workflow's GHA cache read-only: two workflows
          # exporting ~10GB of layers each exhausts the GHA cache quota and
          # fails with "failed to reserve cache".
          cache-from: type=gha
          cache-to: ''
          tags:
            ghcr.io/${{ github.repository_owner }}/pixelated:${{ github.sha }}
          provenance: false
