name: Bias Detection Engine CI/CD

permissions:
  contents: read
  id-token: write
  checks: read
  pull-requests: read
  security-events: write

on:
  workflow_dispatch:
  push:
    branches: [main, master, staging]
    paths:
      - apps/web/src/lib/ai/bias-detection/**
      - apps/web/src/components/admin/bias-detection/**
      - apps/web/src/pages/api/bias-detection/**
      - tests/**/*bias-detection*
      - .github/workflows/bias-detection-ci.yml
  pull_request:
    branches: [main, master, staging]
    paths:
      - apps/web/src/lib/ai/bias-detection/**
      - apps/web/src/components/admin/bias-detection/**
      - apps/web/src/pages/api/bias-detection/**
      - tests/**/*bias-detection*
      - .github/workflows/bias-detection-ci.yml

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GHA_LOCAL_RUN: 'false'
  TRACE_TRIVY_DEPRECATION: ${{ vars.TRACE_TRIVY_DEPRECATION || 'false' }}
  NODE_VERSION: 24.16.0
  PYTHON_VERSION: 3.13.13
  REDIS_URL: ${{ secrets['REDIS_URL'] }}
  UPSTASH_REDIS_REST_URL: ${{ secrets['UPSTASH_REDIS_REST_URL'] }}
  UPSTASH_REDIS_REST_TOKEN: ${{ secrets['UPSTASH_REDIS_REST_TOKEN'] }}

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize submodules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/devops/init-submodules.sh

      - name: Prepare Helm dependencies for Trivy scan
        if: ${{ env['GHA_LOCAL_RUN'] != 'true' }}
        run: |
          if ! command -v helm >/dev/null 2>&1; then
            echo "Helm CLI not found; installing."
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          fi
          helm repo add bitnami https://charts.bitnami.com/bitnami --force-update
          helm repo add traefik https://traefik.github.io/charts --force-update
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update
          helm repo add grafana https://grafana.github.io/helm-charts --force-update
          helm dep update ai/inference/deployment/pixel-voice
          helm dep update ai/inference/deployment/helm/pixelated-empathy

      - name: Run Trivy vulnerability scanner
        if: ${{ env['GHA_LOCAL_RUN'] != 'true' }}
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          NODE_OPTIONS:
            ${{ env.TRACE_TRIVY_DEPRECATION == 'true' && '--trace-deprecation'
            || '--no-deprecation' }}
        with:
          cache: 'false'
          scan-type: fs
          scan-ref: .
          trivy-config: .github/security/trivy/trivy.yaml
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          skip-files: ai/training/sliced/stage2_therapeutic_expertise/clinical_diagnosis_mental_health.json,ai/training/sliced/stage2_therapeutic_expertise/cultural_nuances.json,ai/training/v1/stage2_expertise/reasoning/clinical_diagnosis_mental_health.json,ai/training/v1/stage2_expertise/reasoning/cultural_nuances.json
          limit-severities-for-sarif: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Initialize CodeQL
        if: ${{ env['GHA_LOCAL_RUN'] != 'true' }}
        uses: github/codeql-action/init@v4
        with:
          languages: javascript,typescript
          trap-caching: false

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          clean-node-modules: 'true'

      - name: Build for CodeQL
        run: pnpm build

      - name: Perform CodeQL Analysis
        if: ${{ env['GHA_LOCAL_RUN'] != 'true' }}
        uses: github/codeql-action/analyze@v4

  # Code quality and linting
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize submodules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/devops/init-submodules.sh

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          clean-node-modules: 'true'

      - name: Lint code
        continue-on-error: true
        run: pnpm lint:ci

      - name: Lint markdown
        continue-on-error: true
        run: pnpm lint:markdown:ci

      - name: Run oxlint type-aware
        continue-on-error: true
        run: pnpm lint:ci:type-aware

      - name: Check formatting
        continue-on-error: true
        env:
          PR_BASE_SHA: ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.base.sha || '' }}
        run: |
          bash scripts/ci/get-changed-files.sh /tmp/changed_files.txt
          if [ -s /tmp/changed_files.txt ]; then
            pnpm format:check:changed /tmp/changed_files.txt
          else
            echo "No files changed in this commit; skipping formatting check."
          fi

  typescript-tests:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [security-scan, code-quality]
    if: ${{ needs.security-scan.result == 'success' && needs.code-quality.result
      == 'success' }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: test_db
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli -a redis-ci-password ping | grep -q PONG"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize submodules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/devops/init-submodules.sh

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          clean-node-modules: 'true'

      - name: Setup test environment
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env.test
          else
            touch .env.test
          fi
          echo "DATABASE_URL=postgresql://${POSTGRES_USER}@localhost:5432/test_db" >> .env.test
          echo "REDIS_URL=redis://:redis-ci-password@localhost:6379" >> .env.test
        env:
          POSTGRES_USER: postgres

      - name: Run unit tests
        run: |
          export NODE_OPTIONS="${NODE_OPTIONS//--experimental-wasm-exnref/}"
          VITEST_TARGET_TESTS="apps/web/src/lib/ai/bias-detection/__tests__/*.test.ts;apps/web/src/components/admin/bias-detection/**/*.test.ts;apps/web/src/components/admin/bias-detection/**/*.test.tsx" \
          VITEST_COVERAGE_ENABLED=false \
          npx vitest run -c config/vitest.config.ts
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres@localhost:5432/test_db
          PGUSER: postgres
          PGDATABASE: test_db
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: ''
          REDIS_URL: redis://:redis-ci-password@localhost:6379
          UPSTASH_REDIS_REST_URL: ''
          UPSTASH_REDIS_REST_TOKEN: ''
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Run integration tests
        run: |
          export NODE_OPTIONS="${NODE_OPTIONS//--experimental-wasm-exnref/}"
          VITEST_COVERAGE_ENABLED=false \
          npx vitest run tests/integration/bias-detection-api.integration.test.ts -c config/vitest.config.ts
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres@localhost:5432/test_db
          PGUSER: postgres
          PGDATABASE: test_db
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: ''
          REDIS_URL: redis://:redis-ci-password@localhost:6379
          UPSTASH_REDIS_REST_URL: ''
          UPSTASH_REDIS_REST_TOKEN: ''
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload coverage reports
        if: hashFiles('coverage/lcov.info') != ''
        uses: codecov/codecov-action@v7.0.0
        with:
          files: ./coverage/lcov.info
          flags: typescript
          name: typescript-coverage

      - name: Upload coverage to Qlty
        if: hashFiles('coverage/lcov.info') != ''
        continue-on-error: true
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage/lcov.info

  python-tests:
    name: Python ML Tests
    runs-on: ubuntu-latest
    needs: [security-scan]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize submodules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/devops/init-submodules.sh

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Ensure `uv` shim is available
        run: |
          if ! command -v uv >/dev/null 2>&1; then
            echo "uv not found - installing via pip"
            python -m pip install --upgrade pip
            python -m pip install uv
          else
            echo "uv already installed"
          fi

      - name: Prepare uv venv
        id: prepare-uv
        uses: ./.github/actions/prepare-uv-venv
        with:
          service-dir: apps/web/src/lib/ai/bias-detection/python-service

      - name: Sync CI constraints from pinned requirements
        run: |
          cd apps/web/src/lib/ai/bias-detection/python-service
          REQUIREMENTS_FILE="../requirements.txt"
          if [ ! -f "${REQUIREMENTS_FILE}" ]; then
            echo "Error: ${REQUIREMENTS_FILE} not found"
            ls -la ../
            exit 1
          fi
          python - <<'PY'
          import re
          from pathlib import Path

          req_text = Path("../requirements.txt").read_text().splitlines()
          wanted = {}
          for line in req_text:
              m = re.match(r"^([A-Za-z0-9_.-]+)==([^\s#]+)", line.strip())
              if not m:
                  continue
              name = m.group(1).lower().replace("_", "-")
              if name in {"numpy", "pandas"}:
                  wanted[name] = line.strip()

          missing = sorted({"numpy", "pandas"} - wanted.keys())
          if missing:
              raise SystemExit(
                  "Missing pinned versions in requirements.txt: " + ", ".join(missing)
              )

          Path("constraints-ci.txt").write_text(
              "# Auto-synced CI constraints from requirements.txt\n"
              "# Generated during CI; keep requirements.txt as the source of truth.\n"
              f"{wanted['numpy']}\n{wanted['pandas']}\n"
          )
          print("Wrote constraints-ci.txt:", wanted["numpy"], wanted["pandas"])
          PY

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-${{
            hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-

      - name: Install Python dependencies
        run: |
          if [ ! -d "apps/web/src/lib/ai/bias-detection/python-service" ]; then
            echo "Error: Python service directory not found"
            ls -la apps/web/src/lib/ai/bias-detection/
            exit 1
          fi

          # Prepare uv venv using the composite action, then use its output
          # NOTE: composite actions run as steps, so this shell block only performs installs after the action has run.
          cd apps/web/src/lib/ai/bias-detection/python-service

          # Use the use-system output if set
          USE_SYSTEM="${{ steps.prepare-uv.outputs.use-system }}"

          uv pip install ${USE_SYSTEM} --upgrade pip setuptools wheel
          # Constrain numpy/pandas to compatible binaries to avoid ABI mismatch
          uv pip install ${USE_SYSTEM} --only-binary=:all: -c constraints-ci.txt numpy pandas
          uv pip install ${USE_SYSTEM} -r ../requirements.txt -c constraints-ci.txt
          uv pip install ${USE_SYSTEM} pytest pytest-cov pytest-asyncio httpx

      - name: Run Python linting
        continue-on-error: true
        run: |
          cd apps/web/src/lib/ai/bias-detection/python-service
          uv pip install flake8 black isort
          # Check formatting with black
          uv run black --check --diff --exclude '.venv' .
          # Check import sorting
          uv run isort --check-only --diff --skip .venv .
          # Run flake8 for code quality
          uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv

      - name: Run Python tests
        run: |
          cd apps/web/src/lib/ai/bias-detection/python-service
          uv run python -m pytest tests/test_bias_detection_service.py -v --cov=bias_detection_service --cov-report=xml --cov-fail-under=25
        env:
          DEBUG: 'false'
          ENVIRONMENT: development
          ENV: ci
          ENCRYPTION_PASSWORD: test-encryption-password
          ENCRYPTION_SALT: test-encryption-salt
          FLASK_SECRET_KEY: test-flask-secret
          JWT_SECRET_KEY: test-jwt-secret
          REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: postgresql://postgres@localhost:5432/bias_detection

      - name: Upload Python coverage
        uses: codecov/codecov-action@v7.0.0
        with:
          files: ./apps/web/src/lib/ai/bias-detection/python-service/coverage.xml
          flags: python
          name: python-coverage

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [typescript-tests, python-tests]
    permissions:
      actions: write

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: test_db
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize submodules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/devops/init-submodules.sh

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          clean-node-modules: 'true'

      - name: Setup Python for ML service
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Ensure `uv` shim is available
        run: |
          if ! command -v uv >/dev/null 2>&1; then
            echo "uv not found - installing via pip"
            python -m pip install --upgrade pip
            python -m pip install uv
          else
            echo "uv already installed"
          fi

      - name: Prepare uv venv
        id: prepare-uv
        uses: ./.github/actions/prepare-uv-venv
        with:
          service-dir: apps/web/src/lib/ai/bias-detection/python-service

      - name: Sync CI constraints from pinned requirements
        run: |
          cd apps/web/src/lib/ai/bias-detection/python-service
          REQUIREMENTS_FILE="../requirements.txt"
          if [ ! -f "${REQUIREMENTS_FILE}" ]; then
            echo "Error: ${REQUIREMENTS_FILE} not found"
            ls -la ../
            exit 1
          fi
          python - <<'PY'
          import re
          from pathlib import Path

          req_text = Path("../requirements.txt").read_text().splitlines()
          wanted = {}
          for line in req_text:
              m = re.match(r"^([A-Za-z0-9_.-]+)==([^\s#]+)", line.strip())
              if not m:
                  continue
              name = m.group(1).lower().replace("_", "-")
              if name in {"numpy", "pandas"}:
                  wanted[name] = line.strip()

          missing = sorted({"numpy", "pandas"} - wanted.keys())
          if missing:
              raise SystemExit(
                  "Missing pinned versions in requirements.txt: " + ", ".join(missing)
              )

          Path("constraints-ci.txt").write_text(
              "# Auto-synced CI constraints from requirements.txt\n"
              "# Generated during CI; keep requirements.txt as the source of truth.\n"
              f"{wanted['numpy']}\n{wanted['pandas']}\n"
          )
          print("Wrote constraints-ci.txt:", wanted["numpy"], wanted["pandas"])
          PY

      - name: Install Python ML dependencies
        run: |
          cd apps/web/src/lib/ai/bias-detection/python-service

          USE_SYSTEM="${{ steps.prepare-uv.outputs.use-system }}"

          uv pip install ${USE_SYSTEM} --upgrade pip setuptools wheel
          # Constrain numpy/pandas to compatible binaries to avoid ABI mismatch
          uv pip install ${USE_SYSTEM} --only-binary=:all: -c constraints-ci.txt numpy pandas
          uv pip install ${USE_SYSTEM} -r ../requirements.txt -c constraints-ci.txt

      - name: Setup test database
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env.test
          else
            touch .env.test
          fi
          echo "DATABASE_URL=postgresql://${POSTGRES_USER}@localhost:5432/test_db" >> .env.test
        env:
          POSTGRES_USER: postgres

      - name: Seed E2E test user
        run: pnpm tsx scripts/seed-e2e-user.ts
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/test_db

      - name: Ensure Playwright report directory exists
        run: mkdir -p playwright-report-browser-compat

      - name: Install Playwright browsers
        if: ${{ env['GHA_LOCAL_RUN'] != 'true' }}
        run: pnpm exec playwright install --with-deps

      - name: Start Python ML service
        run: |
          cd apps/web/src/lib/ai/bias-detection/python-service
          uv run python bias_detection_service.py &
          PYTHON_PID=$!
          echo "Started Python service with PID: $PYTHON_PID"
          echo "Waiting for Python service to be ready..."
          MAX_RETRIES=60
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -sSf http://localhost:5000/health > /dev/null 2>&1; then
              echo "Python service is ready!"
              exit 0
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Attempt $RETRY_COUNT/$MAX_RETRIES - service not ready yet..."
            sleep 1
          done
          # Check if the service is still running
          if kill -0 $PYTHON_PID 2>/dev/null; then
            echo "Python service is running but health check failed"
          else
            echo "Python service failed to start"
          fi
          exit 1
        env:
          FLASK_ENV: testing
          ENV: ci
          PORT: '5000'
          FLASK_SECRET_KEY: test-flask-secret
          ENCRYPTION_PASSWORD: test-encryption-password
          ENCRYPTION_SALT: test-encryption-salt
          JWT_SECRET_KEY: test-jwt-secret

      - name: Build application
        run: pnpm build

      - name: Start application
        run: |
          pnpm start &
          echo "Waiting for application to be ready..."
          MAX_RETRIES=60
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -sSf http://localhost:4321/health > /dev/null 2>&1; then
              echo "Application is ready!"
              exit 0
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Attempt $RETRY_COUNT/$MAX_RETRIES - application not ready yet..."
            sleep 1
          done
          echo "Application failed to become ready after ${MAX_RETRIES} seconds"
          exit 1
        env:
          NODE_ENV: test
          E2E_TEST_AUTH: '1'
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DATABASE_URL: postgresql://postgres@localhost:5432/test_db
          PGUSER: postgres
          PGDATABASE: test_db
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: ''

      - name: Run Playwright tests
        # Full dashboard + smoke specs. The dashboard spec authenticates via
        # the E2E test-auth bypass (E2E_TEST_AUTH=1 on "Start application"):
        # signin accepts the seeded test@example.com/password123 and issues an
        # admin session cookie, and middleware grants an admin locals session
        # for that cookie — no Auth0 tenant required.
        run: >-
          pnpm e2e tests/e2e/bias-detection-dashboard.spec.ts
          tests/e2e/smoke/bias-detection-smoke.spec.ts --project=chromium
        env:
          NODE_ENV: test
          # The app is already started by the "Start application" step; tell
          # Playwright to reuse it instead of trying to start a second instance
          # on port 4321.
          DISABLE_PLAYWRIGHT_WEBSERVER: '1'
          E2E_TEST_AUTH: '1'
          DATABASE_URL: postgresql://postgres@localhost:5432/test_db
          PGUSER: postgres
          PGDATABASE: test_db

      - name: Upload E2E test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: e2e-test-results
          path: |
            test-results/
            playwright-report/
