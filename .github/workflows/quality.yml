name: Quality

permissions:
  contents: read

on:
  push:
    branches: [staging]
    paths:
      - 'apps/web/src/**'
      - 'agents/**'
      - 'packages/**'
      - 'scripts/ci/**'
      - 'scripts/**/*.py'
      - 'tools/**'
      - 'tests/**'
      - '.dependency-cruiser.cjs'
      - '.jscpd.json'
      - '.oxlintrc.complexity.json'
      - '.eslintrc.naming.mjs'
      - 'eslint.config.js'
      - 'astro.config.*'
      - 'config/**'
      - 'pyproject.toml'
      - 'package.json'
      - '.github/workflows/quality.yml'
  pull_request:
    branches: [staging]
  workflow_dispatch:

# Cancel superseded runs so feedback on the newest commit is not queued
# behind stale ones.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static code-quality gates. Each audit compares the current state against a
  # pinned baseline and fails only on regressions, so existing debt does not
  # block work but cannot grow. Baselines live in scripts/ci/*-baseline.json.
  code-quality:
    name: Code quality audits
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '24.16.0'
          cache-key-prefix: 'quality-v1'

      - name: Module boundaries (dependency-cruiser)
        run: pnpm lint:boundaries

      - name: Duplicate code (jscpd)
        run: pnpm lint:duplication

      - name: Cyclomatic complexity (oxlint)
        run: pnpm lint:complexity

      - name: Large files
        run: pnpm lint:file-size

      - name: Technical debt markers
        run: pnpm lint:tech-debt

      - name: Naming conventions
        run: pnpm lint:naming

      - name: Mock-path resolution (vi.mock specifiers must resolve)
        run: pnpm lint:mock-paths

      - name: AGENTS.md validation (sections, paths, commands)
        run: node scripts/ci/agents-md-audit.mjs

  # Strict typing for the Python `pe` service. Scoped deliberately: the wider
  # Python tree is not yet strict-clean (see pyproject.toml [tool.mypy]).
  python-strict-types:
    name: Python strict types (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: mypy --strict (pe service, scripts/, tools/)
        run: bash scripts/ci/python-typecheck.sh

      - name: Python correctness ratchet (F821/F401/E722/B904)
        run: node scripts/ci/python-ruff-audit.mjs

  # N+1 query detection. The detector lives in production code
  # (apps/web/src/lib/db/query-counting.ts) and is exercised here so a
  # regression in the instrumentation or a new N+1 becomes a test failure.
  n-plus-one:
    name: N+1 query detection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '24.16.0'
          cache-key-prefix: 'quality-v1'

      - name: Run N+1 detection tests
        run: pnpm test:nplusone

  # Test performance. Runs a bounded hermetic slice of the Vitest suite with the
  # JSON reporter and gates total/slowest per-test durations against a pinned
  # baseline, so a slow test is visible and cannot regress unnoticed.
  test-performance:
    name: Test performance tracking
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '24.16.0'
          cache-key-prefix: 'quality-v1'

      - name: Measure test durations and enforce budget
        run: pnpm test:perf

      - name: Publish report to step summary
        if: always()
        run: cat .test-perf/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test-performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-performance-report
          path: .test-perf/
          retention-days: 14

  # Test reliability. Three gates over the same hermetic slice used by the
  # N+1 and test-performance jobs, so the numbers are comparable across jobs:
  #   - flaky detection: repeat runs diffed for outcome changes (with a pinned
  #     tolerance list in scripts/ci/flaky-baseline.json)
  #   - isolation: ordered vs shuffled execution; tests must pass in both
  #   - coverage ratchet: per-metric budget pinned in
  #     scripts/ci/coverage-baseline.json (the global thresholds in
  #     config/vitest.config.ts target full, non-hermetic runs)
  test-reliability:
    name: Test reliability (flaky / isolation / coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '24.16.0'
          cache-key-prefix: 'quality-v1'

      - name: Flaky test detection (3 repeat runs)
        run: pnpm test:flaky

      - name: Test isolation (ordered vs shuffled)
        run: pnpm test:isolation

      - name: Coverage ratchet (hermetic slice)
        run: pnpm test:coverage:gate

      - name: Publish reports to step summary
        if: always()
        run: |
          for f in .test-reliability/*.md; do
            if [ -f "$f" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload test-reliability reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reliability-report
          path: .test-reliability/
          retention-days: 14

  # Build performance. Times `pnpm build` (the same command CI and developers
  # run) and gates wall-clock duration against a pinned budget
  # (scripts/ci/build-perf-baseline.json), so build-time regressions — a new
  # heavy dependency, bundle growth, a plugin misconfiguration — fail CI
  # instead of silently stretching every subsequent run.
  build-performance:
    name: Build performance tracking
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '24.16.0'
          cache-key-prefix: 'quality-v1'

      - name: Time the production build and enforce budget
        run: pnpm build:perf

      - name: Publish report to step summary
        if: always()
        run: cat .build-perf/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build-performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-performance-report
          path: .build-perf/
          retention-days: 14

  # Dependency health. Four ratcheted audits that fail only on NEW problems,
  # so existing debt does not block work but cannot grow:
  #   - heavy dependencies (install weight, scripts/ci/heavy-deps-baseline.json)
  #   - version drift (duplicate resolved versions, version-drift-baseline.json)
  #   - dead feature flags (flag-baseline.json)
  #   - unused dependencies (knip ratchet, unused-deps-baseline.json)
  dependency-health:
    name: Dependency health audits
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '24.16.0'
          cache-key-prefix: 'quality-v1'

      - name: Heavy dependencies (install weight)
        run: pnpm lint:heavy-deps

      - name: Version drift (duplicate versions)
        run: pnpm lint:version-drift

      - name: Dead feature flags
        run: pnpm lint:flags

      - name: Unused dependencies (knip ratchet)
        run: pnpm lint:unused-deps

      - name: Publish heavy-deps report to step summary
        if: always() && hashFiles('.deps-audit/heavy-deps.md') != ''
        run: cat .deps-audit/heavy-deps.md >> "$GITHUB_STEP_SUMMARY"
