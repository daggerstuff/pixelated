name: "Advisory Tests \u2014 Core + Lib"
permissions:
  contents: read
'on':
  push:
    branches:
      - main
      - master
      - staging
    paths:
      - apps/web/src/**
      - tests/**
      - package.json
      - pnpm-lock.yaml
      - scripts/testing/**
      - .github/workflows/advisory-core-lib.yml
  pull_request:
    branches:
      - main
      - master
      - staging
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  advisory-test-core-lib:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        bucket:
          - core
          - lib-ai
          - lib-ehr
          - lib-services
          - lib-security-hooks
    env:
      VITEST_SUITE: advisory
      VITEST_BUCKET: ${{ matrix.bucket }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Init submodules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/devops/init-submodules.sh
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 24.16.0
      - name: Run advisory (${{ matrix.bucket }})
        id: test-run
        # Blocking: advisory buckets now fail CI. They were silently
        # continue-on-error for months, which let real test debt accumulate
        # invisible to every gate.
        #
        # EXCEPTION — lib-security-hooks: this bucket has 79 PRE-EXISTING
        # failures (journal-research hook tests + useMultimodalPixel, all
        # "Cannot read properties of null (reading 'infer')" inside act()).
        # They fail in the bucket but pass in the full-suite mix, so they are
        # a scheduling/pollution puzzle, not simple rot. Until that debt is
        # fixed this one bucket stays non-blocking; remove this flag the
        # moment it is green.
        continue-on-error: ${{ matrix.bucket == 'lib-security-hooks' }}
        run: 'set -o pipefail

          timeout 20m pnpm test:advisory 2>&1 | tee "advisory-test-${{
          matrix.bucket }}.log"'
      - name: Upload log (${{ matrix.bucket }})
        if:
          always() && hashFiles(format('advisory-test-{0}.log', matrix.bucket))
          != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: advisory-test-log-${{ matrix.bucket }}
          path: advisory-test-${{ matrix.bucket }}.log
          retention-days: 14
