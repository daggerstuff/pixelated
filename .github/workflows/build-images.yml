name: Build and Publish Images

# Production is deployed off AWS: Vercel is the production origin for
# pixelatedempathy.com and the app/agent images below are what the current
# deployment consumes. Publishing follows a successful CI run on staging, so
# shipping stays the default instead of a manual step; manual dispatch is
# always allowed.
on:
    workflow_dispatch:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [staging]

# Publishes must not overlap: a newer run waits for the current one.
concurrency:
    group: publish-images
    cancel-in-progress: false

permissions:
    contents: read

env:
    REGISTRY: docker.io
    IMAGE_NAME: pixelatedempathy/api

jobs:
    build-and-push:
        # Auto-publishes only follow a successful CI run; manual dispatch is always allowed.
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
             github.event.workflow_run.head_branch == 'staging')
        runs-on: ubuntu-latest
        outputs:
            image_tag: ${{ steps.vars.outputs.image_tag }}
            app_digest: ${{ steps.build-app.outputs.digest }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Determine image tag
              id: vars
              run: |
                  if [[ "${{ github.ref_name }}" == "main" ]]; then
                    IMAGE_TAG="production"
                  else
                    IMAGE_TAG="${{ github.ref_name }}"
                  fi
                  echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
                  echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
                  echo "Built image tag: $IMAGE_TAG"

            - name: Build and push app
              id: build-app
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./infra/Dockerfile
                  push: true
                  tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{
                      steps.vars.outputs.image_tag }},${{ env.REGISTRY }}/${{
                      env.IMAGE_NAME }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  platforms: linux/amd64

            - name: Image digest
              run: 'echo "app: ${{ steps.build-app.outputs.digest }}"'

    # Every agent in the fleet is published, not just the three the retired
    # EKS manifests used: agents/deploy/docker-compose.yaml pulls all eight
    # from these tags, so the fleet host never needs a checkout to deploy.
    build-agent-images:
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
             github.event.workflow_run.head_branch == 'staging')
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                agent:
                    - supervisor
                    - advisor
                    - content
                    - eve
                    - intake
                    - pipeline
                    - qa
                    - session
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Determine image tag
              id: vars
              run: |
                  if [[ "${{ github.ref_name }}" == "main" ]]; then
                    IMAGE_TAG="production"
                  else
                    IMAGE_TAG="${{ github.ref_name }}"
                  fi
                  echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
                  echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
                  echo "Built image tag: $IMAGE_TAG"

            - name: Build and push ${{ matrix.agent }} agent
              id: build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./agents/Dockerfile
                  build-args: |
                      AGENT_DIR=agents/${{ matrix.agent }}-agent
                  push: true
                  tags: >-
                      ${{ env.REGISTRY }}/pixelatedempathy/${{
                      matrix.agent }}-agent:${{
                      steps.vars.outputs.image_tag }},${{
                      env.REGISTRY }}/pixelatedempathy/${{
                      matrix.agent }}-agent:latest
                  cache-from: type=gha,scope=${{ matrix.agent }}-agent
                  cache-to: type=gha,mode=max,scope=${{ matrix.agent }}-agent
                  platforms: linux/amd64

            - name: Image digest
              run: 'echo "${{ matrix.agent }}: ${{ steps.build.outputs.digest }}"'
