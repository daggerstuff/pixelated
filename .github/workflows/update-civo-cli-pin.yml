name: Update Civo CLI Fallback Version

on:
  schedule:
    # Weekly: Monday 3:00 AM UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # WORKFLOW_PAT rationale + setup; see .github/workflows/_shared-conventions.md#workflow_pat_secret_for_editing_workflow_files.

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    # GH_TOKEN declared at job-level per shared convention; rationale in .github/workflows/_shared-conventions.md.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get latest Civo CLI version
        id: latest
        run: |
          # GH_TOKEN is exported at the check-and-update job level above.
          LATEST=$(curl -sSfL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/civo/cli/releases/latest | jq -r '.tag_name // empty')

          if [[ -z "$LATEST" || "$LATEST" != v* ]]; then
            echo "❌ Could not resolve a valid version from GitHub API. Got: '$LATEST'"
            exit 1
          fi

          echo "Latest release: $LATEST"
          echo "version=$LATEST" >> $GITHUB_OUTPUT

      - name: Get current pinned version
        id: current
        run: |
          # Grep the CIVO_VERSION="vX.Y.Z" assignment directly (mirrors the
          # update-kubectl-pin workflow's pattern). A generic
          # 'falling back to vX.Y.Z' grep matches BOTH the CIVO_VERSION
          # fallback line AND the KUBE_STABLE fallback line in
          # deploy-civo.yml, producing multi-line output that $GITHUB_OUTPUT
          # rejects with 'Invalid format'.
          CURRENT=$(grep -oP 'CIVO_VERSION="\Kv[\d]+\.[\d]+\.[\d]+' .github/workflows/deploy-civo.yml)
          echo "Current pin: $CURRENT"
          echo "version=$CURRENT" >> $GITHUB_OUTPUT

      - name: Update pin if newer
        id: update
        if: steps.latest.outputs.version != steps.current.outputs.version
        run: |
          OLD="${{ steps.current.outputs.version }}"
          NEW="${{ steps.latest.outputs.version }}"
          echo "Updating pin from $OLD to $NEW"

          # Update both occurrences: the echo message and the variable assignment
          sed -i "s/falling back to ${OLD}/falling back to ${NEW}/g" .github/workflows/deploy-civo.yml
          sed -i "s/CIVO_VERSION=\"${OLD}\"/CIVO_VERSION=\"${NEW}\"/g" .github/workflows/deploy-civo.yml

          echo "changed=true" >> $GITHUB_OUTPUT
          echo "old=$OLD" >> $GITHUB_OUTPUT
          echo "new=$NEW" >> $GITHUB_OUTPUT

      - name: "Pre-flight: verify WORKFLOW_PAT secret exists"
        id: preflight
        if: steps.update.outputs.changed == 'true'
        run: |
          # Soft-fail: if WORKFLOW_PAT isn't configured yet, emit a warning
          # and skip the Create Pull Request step below. The workflow will
          # still register as success so CI dashboards don't show a red run
          # for an unconfigured-repo state. Once a repo admin configures
          # the secret (see .github/workflows/_shared-conventions.md), the
          # next run will publish the PR normally.
          if [[ -z "${{ secrets.WORKFLOW_PAT }}" ]]; then
            echo "::warning::WORKFLOW_PAT secret is not set on this repository."
            echo "::warning::Skipping Create Pull Request step. See the"
            echo "::warning::permissions: block at the top of this file for"
            echo "::warning::setup instructions (PAT with 'workflow' scope)."
            echo "has_pat=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_pat=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.update.outputs.changed == 'true' && steps.preflight.outputs.has_pat == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          # Use WORKFLOW_PAT (not GITHUB_TOKEN) so the push is authorized
          # to modify files under .github/workflows/. See permissions: block
          # above for setup instructions.
          token: ${{ secrets.WORKFLOW_PAT }}
          commit-message:
            'chore: bump Civo CLI fallback version from ${{ steps.update.outputs.old }} to ${{ steps.update.outputs.new }}'
          title:
            'chore: update Civo CLI pinned fallback version to ${{ steps.update.outputs.new }}'
          body: |
            The Civo CLI has released a new version: **${{ steps.update.outputs.new }}**

            This PR updates the pinned fallback version in `deploy-civo.yml` from `${{ steps.update.outputs.old }}` to `${{ steps.update.outputs.new }}`.

            The fallback is used when the GitHub API is rate-limited or unreachable during CI deployments.

            Triggered by `update-civo-cli-pin` workflow.
          branch: update-civo-cli-pin
          base: staging
          delete-branch: true
          labels: |
            dependencies
            automated
