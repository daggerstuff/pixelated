name: Monitoring

permissions:
  contents: read

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 24.16.0

jobs:
  health-check:
    name: Health Check & Alert Routing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Severity-routed alerts (scripts/ci/health-alerts.mjs): CRITICAL/HIGH
      # post to Slack (paging @here on CRITICAL) and fail the run; WARN goes
      # to the step output. The routing table and per-surface ownership live
      # in the script.
      - name: Probe production and route alerts
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BASE_URL: ${{ vars.BASE_URL }}
        run: node scripts/ci/health-alerts.mjs
