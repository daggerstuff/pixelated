name: Advisory Tests

permissions:
  contents: read

on:
  push:
    branches: [main, master, staging]
    paths:
      - 'src/**'
      - 'ai/**'
      - 'tests/**'
      - 'agents/**'
      - 'vitest.config.ts'
      - 'scripts/testing/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/advisory-tests.yml'
  pull_request:
    branches: [main, master, staging]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# sharded advisory run: 6 buckets split by directory so each runner finishes
# well under the original 45-min single-job timeout (run 28896985143 hit it on
# staging). The frontend bucket was split into components/hooks/utils to reduce
# per-process memory pressure (OOM at ~7.3 GB / 8.2 GB heap limit).
# Bucket selection handled by VITEST_BUCKET env var → local-test-runner.mjs.
jobs:
  advisory-test-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        bucket:
          [
            core,
            lib,
            frontend-components,
            frontend-hooks,
            frontend-utils,
            agents,
          ]

    env:
      VITEST_SUITE: advisory
      VITEST_BUCKET: ${{ matrix.bucket }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Initialize submodules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/devops/init-submodules.sh

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '24.16.0'

      - name: Run advisory suite (${{ matrix.bucket }} bucket)
        continue-on-error: true
        run: |
          set -o pipefail
          timeout 20m pnpm test:advisory 2>&1 | tee "advisory-test-${{ matrix.bucket }}.log"

      - name: Upload advisory test log (${{ matrix.bucket }})
        if:
          always() && hashFiles(format('advisory-test-{0}.log', matrix.bucket))
          != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: advisory-test-log-${{ matrix.bucket }}
          path: advisory-test-${{ matrix.bucket }}.log
          retention-days: 14
