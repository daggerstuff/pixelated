name: Advisory Tests

permissions:
  contents: read

on:
  push:
    branches: [main, master, staging]
    paths:
      - 'src/**'
      - 'ai/**'
      - 'tests/**'
      - 'agents/**'
      - 'vitest.config.ts'
      - 'scripts/testing/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/advisory-tests.yml'
  pull_request:
    branches: [main, master, staging]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# sharded advisory run: 6 buckets split by directory so each runner finishes
# well under the original 45-min single-job timeout (run 28896985143 hit it on
# staging). The frontend bucket was split into components/hooks/utils to reduce
# per-process memory pressure (OOM at ~7.3 GB / 8.2 GB heap limit).
# Bucket selection handled by VITEST_BUCKET env var → local-test-runner.mjs.
jobs:
  advisory-test-suite:
    runs-on: ubuntu-latest
    # bumped from 30 to 45 because the frontend-components bucket (52 files,
    # sequential in CI, heavy jsdom/Astro per-file overhead, real-timer tests)
    # consistently hits the 30-minute wall.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        bucket:
          [
            core,
            lib,
            frontend-components,
            frontend-hooks,
            frontend-utils,
            agents,
          ]

    env:
      VITEST_SUITE: advisory
      VITEST_BUCKET: ${{ matrix.bucket }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Initialize submodules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/devops/init-submodules.sh

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Get pnpm store path
        id: pnpm-store
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 build-essential
          npm install -g node-gyp

      - name: Install dependencies
        run: |
          PNPM_CONFIG_TRUST_LOCKFILE=true pnpm install --no-frozen-lockfile

      - name: Run advisory suite (${{ matrix.bucket }} bucket)
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm test:advisory 2>&1 | tee "advisory-test-${{ matrix.bucket }}.log"

      - name: Upload advisory test log (${{ matrix.bucket }})
        if:
          always() && hashFiles(format('advisory-test-{0}.log', matrix.bucket))
          != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: advisory-test-log-${{ matrix.bucket }}
          path: advisory-test-${{ matrix.bucket }}.log
          retention-days: 14
