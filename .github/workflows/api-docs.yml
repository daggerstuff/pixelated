# API docs from code. Regenerates the pe service's OpenAPI schema and opens a
# PR when the checked-in copy drifts from what the code actually serves — so
# the documented API surface cannot silently lag behind the implementation.
name: API docs

on:
  push:
    branches: [staging]
    paths:
      - 'apps/web/src/pe/**'
      - 'api-docs/**'
      - 'scripts/ci/generate_pe_openapi.py'
      - '.github/workflows/api-docs.yml'
  schedule:
    - cron: '15 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  openapi-drift:
    name: Regenerate pe OpenAPI spec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false
      - name: Init submodules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # pe's app imports ai.research.quadit at load time.
        run: bash scripts/devops/init-submodules.sh
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Regenerate api-docs/pe-openapi.json
        working-directory: apps/web
        env:
          PYTHONPATH: '.:..'
        run: uv run python ../../scripts/ci/generate_pe_openapi.py
      # The generated JSON must match Prettier style or CI's format check
      # fails on the drift PR.
      - name: Prettier-format the generated spec
        run: pnpm exec prettier --write api-docs/pe-openapi.json
      - name: Open PR on drift
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/api-docs-openapi-drift
          delete-branch: true
          title: 'docs(api): refresh pe OpenAPI schema'
          body: |
            The pe service's served OpenAPI schema drifted from the
            checked-in copy at `api-docs/pe-openapi.json`. This PR was
            generated by the api-docs workflow — review the diff as the
            authoritative API change record.
          commit-message: 'docs(api): regenerate pe OpenAPI schema from code'
          labels: 'documentation, api'
