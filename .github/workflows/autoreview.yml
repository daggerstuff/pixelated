name: AutoReview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: AutoReview PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2B_ENABLED: ${{ secrets.E2B_API_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup uv (for E2B validation)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @pixelated/autoreview...

      - name: Run AutoReview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PRIMARY: anthropic
          LLM_SECONDARY: openai
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pnpm --filter @pixelated/autoreview review

      - name: Validate in E2B sandbox
        if: env.E2B_ENABLED == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          AUTOREVIEW_VALIDATE_PYTHON: uv run python
          AUTOREVIEW_VALIDATE_TIMEOUT_SEC: '300'
        run: pnpm --filter @pixelated/autoreview validate