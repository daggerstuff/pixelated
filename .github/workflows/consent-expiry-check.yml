name: Consent Expiry Check

on:
  schedule:
    # Run daily at 6:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  expiry-check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run consent expiry check
        id: expiry-check
        run: pnpm tsx scripts/consent/run-expiry-check.ts

      - name: Create issue if expired consents found
        if: steps.expiry-check.outputs.expired-count != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const expired = '${{ steps.expiry-check.outputs.expired-count }}'
            const critical = '${{ steps.expiry-check.outputs.expiring-critical }}'
            const soon = '${{ steps.expiry-check.outputs.expiring-soon }}'

            const title = `[Consent Expiry] ${expired} expired, ${critical} critical, ${soon} expiring soon`
            const body = [
              '## Consent Expiry Check Results',
              '',
              '| Category | Count |',
              '|----------|-------|',
              `| Expired | ${expired} |`,
              `| Expiring Critical (≤7 days) | ${critical} |`,
              `| Expiring Soon (≤30 days) | ${soon} |`,
              '',
              'Re-consent prompts have been triggered for affected clients.',
              'Run `GET /api/v1/admin/consent/expiry-check` for full details.',
            ].join('\n')

            // Reuse the open issue (if any) instead of opening a new one every
            // daily run, but keep its counts fresh: update title/body whenever
            // the numbers have changed so the tracker never shows stale data.
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            const existing = openIssues.find(
              (issue) =>
                !issue.pull_request &&
                issue.title.startsWith('[Consent Expiry]'),
            )
            if (existing) {
              if (existing.title === title) {
                console.log(
                  `Open issue #${existing.number} already up to date; skipping.`,
                )
                return
              }
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
                labels: ['safety-critical', 'consent', 'automated'],
              })
              console.log(
                `Open issue #${existing.number} updated with fresh expiry counts.`,
              )
              return
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['safety-critical', 'consent', 'automated'],
            })
