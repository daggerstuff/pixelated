name: Smoke Tests (E2E)

permissions:
  contents: read

on:
  push:
    branches: [main, master, staging]
    paths:
      - 'apps/web/src/**'
      - 'tests/e2e/smoke/**'
      - 'tests/e2e/data/**'
      - 'config/playwright.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/smoke-tests.yml'
  pull_request:
    branches: [main, master, staging]
    paths:
      - 'apps/web/src/**'
      - 'tests/e2e/smoke/**'
      - 'tests/e2e/data/**'
      - 'config/playwright.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/smoke-tests.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PNPM_CONFIG_TRUST_LOCKFILE: 'true'
  GHA_LOCAL_RUN: 'false'
  NODE_VERSION: 24.16.0
  NODE_ENV: test
  DISABLE_AUTH: 'true'

# Cancel superseded runs so feedback on the newest commit is not queued
# behind stale ones (E2E runs are long).
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Run Smoke Tests
    runs-on: ubuntu-24.04
    # Bounded on purpose: PIX-4727 showed this suite can hang at the driver
    # level; a short timeout converts a hang into a fast, visible failure
    # instead of a 60-minute burn. Doubles as the verification experiment
    # for whether the hang recurs after 99811a9b7.
    timeout-minutes: 15
    permissions:
      actions: write

    steps:
      - uses: actions/checkout@v7

      - name: Initialize submodules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/devops/init-submodules.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 build-essential
          npm install -g node-gyp

      - name: Install dependencies
        run: PNPM_CONFIG_TRUST_LOCKFILE=true pnpm install --no-frozen-lockfile

      - name: Install Playwright browser
        if: ${{ env['GHA_LOCAL_RUN'] != 'true' }}
        run: pnpm exec playwright install --with-deps chromium

      # Build out-of-band (not via Playwright's auto webServer): the webServer
      # pipes astro build through build-with-pipe-handling.mjs, whose EPIPE
      # handlers silently exit and leave the job hanging until timeout.
      - name: Build project
        run: pnpm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Run smoke suite
        run: |
          set -euo pipefail

          PREVIEW_PORT=4324
          PREVIEW_URL="http://127.0.0.1:${PREVIEW_PORT}"
          PREVIEW_LOG=/tmp/pixelated-preview.log
          rm -f "${PREVIEW_LOG}"

          cleanup() {
            local exit_code=$?
            if [[ -n "${PREVIEW_PID:-}" ]] && kill -0 "${PREVIEW_PID}" > /dev/null 2>&1; then
              kill "${PREVIEW_PID}" > /dev/null 2>&1 || true
              wait "${PREVIEW_PID}" > /dev/null 2>&1 || true
            fi
            if [[ ${exit_code} -ne 0 ]]; then
              echo "Last preview logs:"
              tail -n 80 "${PREVIEW_LOG}" || true
            fi
            exit "${exit_code}"
          }
          trap cleanup EXIT

          echo "Starting preview server on ${PREVIEW_URL}..."
          nohup env HOST=127.0.0.1 PORT="${PREVIEW_PORT}" WEBSITES_PORT="${PREVIEW_PORT}" pnpm run preview > "${PREVIEW_LOG}" 2>&1 &
          PREVIEW_PID=$!
          echo "Preview server started (PID: ${PREVIEW_PID})"

          echo "Waiting for preview server to be ready..."
          for attempt in $(seq 1 60); do
            if ! kill -0 "${PREVIEW_PID}" > /dev/null 2>&1; then
              echo "Preview process (PID: ${PREVIEW_PID}) is not running."
              exit 1
            fi
            if curl -sS --connect-timeout 2 --max-time 5 "${PREVIEW_URL}" > /dev/null 2>&1; then
              echo "Server is ready at ${PREVIEW_URL}!"
              break
            fi
            echo "Attempt ${attempt}/60 - server not ready yet..."
            if [[ ${attempt} -eq 60 ]]; then
              echo "Server failed to become ready after 60 seconds."
              echo "Preview server PID: ${PREVIEW_PID}"
              exit 1
            fi
            sleep 1
          done

          export NODE_ENV=test
          export DISABLE_AUTH=true
          export DISABLE_PLAYWRIGHT_WEBSERVER=true
          export DISABLE_WEB_FONTS=true
          export SKIP_MSW=true
          export JWT_SECRET="${{ secrets.JWT_SECRET }}"
          export BASE_URL="${PREVIEW_URL}"

          # retries=0 per PIX-4729 option 1: flakiness here is signal, not
          # noise to mask. Chromium only keeps the job lightweight.
          pnpm e2e:smoke --project=chromium --retries=0
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smoke-test-results-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30
          if-no-files-found: warn
          compression-level: 6
