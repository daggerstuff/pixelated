name: actionlint

permissions:
  contents: read

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/**'
      - '.actionlint.yml'
      - 'package.json'
  pull_request:
    branches: [staging]
    paths:
      - '.github/workflows/**'
      - '.actionlint.yml'
      - 'package.json'
  workflow_dispatch:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Pin to a specific tag for supply-chain reproducibility. Update
      # this tag (and the ACTIONLINT_VERSION var in
      # scripts/ci/run-actionlint.sh) when bumping actionlint.
      # Source: https://github.com/rhysd/actionlint/releases
      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.7
        # The official action picks up .actionlint.yml automatically,
        # so shellcheck-built-in stays disabled in CI without extra
        # CLI flags. Run with -color off in CI for plain-text logs.