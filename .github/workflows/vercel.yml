name: Vercel (Frontend Test Center)

# Vercel is the frontend test center, NOT the production deployment.
# Production lives on EKS via Deploy to AWS EKS. Do not add more Vercel
# triggers here — every additional push-path multiplies build cost.
on:
  workflow_dispatch:
  pull_request:
    branches: [staging]
    paths:
      # Only rebuild Vercel when frontend assets actually change.
      - apps/web/src/**
      - apps/web/public/**
      - astro.config.*
      - apps/web/tailwind.config.*
      - packages/ui/**
      - packages/components/**
      - vercel.json
      - .vercelignore
  push:
    branches: [staging]
    paths:
      # Production Vercel deploy from staging only, and only on real changes.
      # Staging is the main branch — this is throttled to frontend changes only
      # to avoid burning build credits on every infra/backend/config push.
      - apps/web/src/**
      - apps/web/public/**
      - astro.config.*
      - apps/web/tailwind.config.*
      - packages/ui/**
      - packages/components/**
      - vercel.json
      - .vercelignore

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  preview:
    name: Preview (Vercel)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '24.16.0'

      - name: Build frontend
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Deploy Preview
        run: |
          npx vercel deploy \
            --token ${{ secrets.VERCEL_TOKEN }} \
            --yes \
            --prod=false \
            ${{ env.VERCEL_PROJECT_ID && format('--scope={0}', env.VERCEL_PROJECT_ID) || '' }}
        continue-on-error: true

  production:
    name: Production (Vercel)
    # Do NOT add `needs: preview` here: preview only runs on pull_request,
    # so the dependency skips this job on every push/dispatch (it ran 0
    # successful deploys before this fix).
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '24.16.0'

      - name: Build frontend
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Deploy Production
        run: |
          npx vercel deploy \
            --token ${{ secrets.VERCEL_TOKEN }} \
            --yes \
            --prod=true \
            ${{ env.VERCEL_PROJECT_ID && format('--scope={0}', env.VERCEL_PROJECT_ID) || '' }}
        continue-on-error: true
