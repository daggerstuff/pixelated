name: ShellCheck

permissions:
  contents: read

on:
  push:
    branches: [staging]
    paths:
      - 'scripts/backup/**'
      - 'scripts/deploy/install-backup-home-vivi-service.sh'
      - '.shellcheckrc'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    branches: [staging]
    paths:
      - 'scripts/backup/**'
      - 'scripts/deploy/install-backup-home-vivi-service.sh'
      - '.shellcheckrc'
      - '.github/workflows/shellcheck.yml'
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck on backup & deploy scripts
        run: |
          echo "::group::ShellCheck results"
          shellcheck --severity=warning \
            scripts/backup/*.sh \
            scripts/deploy/install-backup-home-vivi-service.sh
          echo "::endgroup::"
          echo "✅ All backup scripts passed shellcheck (severity ≥ warning)"
