name: Docs Build & Deploy

on:
  push:
    branches: [main, staging]
    paths:
      - 'apps/web/src/pages/docs/**'
      - 'apps/web/src/content-store/docs/**'
      - 'apps/web/src/content-store/docs/api-reference/**'
      - 'packages/sdk-typescript/README.md'
      - 'packages/sdk-python/README.md'
  pull_request:
    paths:
      - 'apps/web/src/pages/docs/**'
      - 'apps/web/src/content-store/docs/**'
  schedule:
    - cron: '0 4 * * *' # Daily at 4 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '24.16.0'

      - name: Build site
        id: build
        run: pnpm build
        continue-on-error: true

      - name: Validate OpenAPI spec
        run: |
          npx @stoplight/spectral-cli lint apps/web/src/content-store/docs/api-reference/openapi.yaml \
            --ruleset .spectral.yaml \
            --format json \
            > spectral-results.json 2>/dev/null || true
          node -e "const r=require('./spectral-results.json');const e=r.filter(x=>x.severity===0);if(e.length>0){console.error(e.length+' errors found');process.exit(1)}"

      - name: Check for broken internal links
        id: linkcheck
        continue-on-error: true
        run: |
          pnpm build 2>&1 | tee build.log
          grep -i "error.*404" build.log && exit 1 || true

      - name: Upload build artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: docs-build
          path: dist/
          retention-days: 7
