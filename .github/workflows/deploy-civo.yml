name: Deploy to Civo K3s

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: pixelatedempathy/api
  SESSION_AGENT_IMAGE_NAME: pixelatedempathy/session-agent
  QA_AGENT_IMAGE_NAME: pixelatedempathy/qa-agent
  PIPELINE_AGENT_IMAGE_NAME: pixelatedempathy/pipeline-agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image tag
        id: vars
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            IMAGE_TAG="production"
          else
            IMAGE_TAG="${{ github.ref_name }}"
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Built image tag: $IMAGE_TAG (branch: ${{ github.ref_name }})"

      - name: Build and push
        id: build-app
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Build and push session agent
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./agents/Dockerfile
          build-args: |
            AGENT_DIR=agents/session-agent
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.SESSION_AGENT_IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }},${{ env.REGISTRY }}/${{ env.SESSION_AGENT_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=session-agent
          cache-to: type=gha,mode=max,scope=session-agent
          platforms: linux/amd64

      - name: Build and push QA agent
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./agents/Dockerfile
          build-args: |
            AGENT_DIR=agents/qa-agent
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.QA_AGENT_IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }},${{ env.REGISTRY }}/${{ env.QA_AGENT_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=qa-agent
          cache-to: type=gha,mode=max,scope=qa-agent
          platforms: linux/amd64

      - name: Build and push pipeline agent
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./agents/Dockerfile
          build-args: |
            AGENT_DIR=agents/pipeline-agent
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.PIPELINE_AGENT_IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }},${{ env.REGISTRY }}/${{ env.PIPELINE_AGENT_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=pipeline-agent
          cache-to: type=gha,mode=max,scope=pipeline-agent
          platforms: linux/amd64

      - name: Image digest
        run: echo ${{ steps.build-app.outputs.digest }}

  deploy-civo:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    environment:
      name: civo
      url: https://pixelatedempathy.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Civo CLI
        run: |
          CIVO_VERSION=$(curl -sL https://api.github.com/repos/civo/cli/releases/latest | jq -r '.tag_name // "v1.1.14"')
          curl -sL "https://github.com/civo/cli/releases/download/${CIVO_VERSION}/civo-${CIVO_VERSION#v}-linux-amd64.tar.gz" -o /tmp/civo.tar.gz
          tar xzf /tmp/civo.tar.gz -C /usr/local/bin/ civo
          civo --version

      - name: Configure Civo
        env:
          CIVO_API_KEY: ${{ secrets.CIVO_API_KEY }}
        run: civo apikey save --load-from-env -y

      - name: Wait for cluster to be ready
        run: |
          echo "Waiting for pixelated-cluster to be ready..."
          for i in {1..30}; do
            STATUS=$(civo kubernetes show pixelated-cluster -o json | jq -r '.conditions[] | select(.type=="ControlPlaneConnectivity") | .status // empty')
            if [ "$STATUS" == "True" ]; then
              echo "✅ Cluster is ready"
              break
            fi
            echo "Attempt $i/30: Cluster not ready yet, waiting..."
            sleep 20
          done

      - name: Update kubeconfig
        run: |
          mkdir -p ~/.kube
          civo kubernetes config pixelated-cluster > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Install kubectl and kustomize
        run: |
          curl -sLO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

          KUSTOMIZE_VERSION=5.6.0
          KUSTOMIZE_BASE_URL="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}"
          KUSTOMIZE_ARCHIVE="kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          # NOTE: Keep this checksum pinned in-repo to avoid trusting a remote .sha256 file.
          # Update this value when bumping KUSTOMIZE_VERSION.
          EXPECTED_KUSTOMIZE_SHA256="54e4031ddc4e7fc59e408da29e7c646e8e57b8088c51b84b3df0864f47b5148f"

          curl -sSfL "${KUSTOMIZE_BASE_URL}/${KUSTOMIZE_ARCHIVE}" -o "${KUSTOMIZE_ARCHIVE}"

          echo "${EXPECTED_KUSTOMIZE_SHA256}  ${KUSTOMIZE_ARCHIVE}" | sha256sum -c -

          tar xzf "${KUSTOMIZE_ARCHIVE}"
          sudo mv kustomize /usr/local/bin/
          rm "${KUSTOMIZE_ARCHIVE}"

      - name: Deploy to Civo
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_API_KEY: ${{ secrets.CLOUDFLARE_AI_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          LINEAR_AGENT_ACCESS_TOKEN: ${{ secrets.LINEAR_AGENT_ACCESS_TOKEN }}
          LINEAR_WEBHOOK_SECRET: ${{ secrets.LINEAR_WEBHOOK_SECRET }}
        run: |
          kubectl apply -f k8s/civo/namespace.yaml
          kubectl create secret generic cloudflare-workers-ai \
            --from-literal=account-id="${CLOUDFLARE_ACCOUNT_ID:-}" \
            --from-literal=api-key="${CLOUDFLARE_AI_API_KEY:-}" \
            -n pixelated-empathy \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic slack-agent \
            --from-literal=bot-token="${SLACK_BOT_TOKEN:-}" \
            --from-literal=signing-secret="${SLACK_SIGNING_SECRET:-}" \
            -n pixelated-empathy \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic linear-agent \
            --from-literal=access-token="${LINEAR_AGENT_ACCESS_TOKEN:-}" \
            --from-literal=webhook-secret="${LINEAR_WEBHOOK_SECRET:-}" \
            -n pixelated-empathy \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -k k8s/civo
          kubectl apply -f agents/session-agent/k8s/deployment.yaml
          kubectl apply -f agents/qa-agent/k8s/deployment.yaml
          kubectl apply -f agents/pipeline-agent/k8s/deployment.yaml
          kubectl set image deployment/pixelated-empathy pixelated-empathy=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }} -n pixelated-empathy
          kubectl set image deployment/session-agent agent=${{ env.REGISTRY }}/${{ env.SESSION_AGENT_IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }} -n pixelated-empathy
          kubectl set image deployment/qa-agent agent=${{ env.REGISTRY }}/${{ env.QA_AGENT_IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }} -n pixelated-empathy
          kubectl set image deployment/pipeline-agent agent=${{ env.REGISTRY }}/${{ env.PIPELINE_AGENT_IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }} -n pixelated-empathy

          echo "Waiting for rollout..."
          kubectl rollout status deployment/pixelated-empathy -n pixelated-empathy --timeout=5m
          kubectl rollout status deployment/session-agent -n pixelated-empathy --timeout=5m
          kubectl rollout status deployment/qa-agent -n pixelated-empathy --timeout=5m
          kubectl rollout status deployment/pipeline-agent -n pixelated-empathy --timeout=5m

      - name: Verify deployment
        run: |
          echo "=== Pod status ==="
          kubectl get pods -n pixelated-empathy

          echo "=== Service status ==="
          kubectl get svc -n pixelated-empathy

          echo "=== Ingress status ==="
          kubectl get ingress -n pixelated-empathy
