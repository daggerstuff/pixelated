name: Deploy to Civo K3s

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: docker.io
  IMAGE_NAME: pixelatedempathy/api
  SESSION_AGENT_IMAGE_NAME: pixelatedempathy/session-agent
  QA_AGENT_IMAGE_NAME: pixelatedempathy/qa-agent
  PIPELINE_AGENT_IMAGE_NAME: pixelatedempathy/pipeline-agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      app_digest: ${{ steps.build-app.outputs.digest }}
      session_digest: ${{ steps.build-session.outputs.digest }}
      qa_digest: ${{ steps.build-qa.outputs.digest }}
      pipeline_digest: ${{ steps.build-pipeline.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image tag
        id: vars
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            IMAGE_TAG="production"
          else
            IMAGE_TAG="${{ github.ref_name }}"
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Built image tag: $IMAGE_TAG (branch: ${{ github.ref_name }})"

      - name: Build and push
        id: build-app
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{
            steps.vars.outputs.image_tag }},${{ env.REGISTRY }}/${{
            env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Build and push session agent
        id: build-session
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./agents/Dockerfile
          build-args: |
            AGENT_DIR=agents/session-agent
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.SESSION_AGENT_IMAGE_NAME }}:${{
            steps.vars.outputs.image_tag }},${{ env.REGISTRY }}/${{
            env.SESSION_AGENT_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=session-agent
          cache-to: type=gha,mode=max,scope=session-agent
          platforms: linux/amd64

      - name: Build and push QA agent
        id: build-qa
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./agents/Dockerfile
          build-args: |
            AGENT_DIR=agents/qa-agent
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.QA_AGENT_IMAGE_NAME }}:${{
            steps.vars.outputs.image_tag }},${{ env.REGISTRY }}/${{
            env.QA_AGENT_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=qa-agent
          cache-to: type=gha,mode=max,scope=qa-agent
          platforms: linux/amd64

      - name: Build and push pipeline agent
        id: build-pipeline
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./agents/Dockerfile
          build-args: |
            AGENT_DIR=agents/pipeline-agent
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.PIPELINE_AGENT_IMAGE_NAME }}:${{
            steps.vars.outputs.image_tag }},${{ env.REGISTRY }}/${{
            env.PIPELINE_AGENT_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=pipeline-agent
          cache-to: type=gha,mode=max,scope=pipeline-agent
          platforms: linux/amd64

      - name: Image digest
        run: |
          echo "app:      ${{ steps.build-app.outputs.digest }}"
          echo "session:  ${{ steps.build-session.outputs.digest }}"
          echo "qa:       ${{ steps.build-qa.outputs.digest }}"
          echo "pipeline: ${{ steps.build-pipeline.outputs.digest }}"

  deploy-civo:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    environment:
      name: civo
      url: https://pixelatedempathy.com
    # GH_TOKEN declared at job-level per shared convention; rationale in .github/workflows/_shared-conventions.md.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Civo CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Resolve the latest release tag via gh CLI.
          # `|| true` keeps the step alive if `gh` returns non-zero; the empty/v-prefix
          # check below then routes us to the pinned fallback (v1.5.4).
          CIVO_VERSION="$(gh release view --repo civo/cli --json tagName -q .tagName 2>/dev/null || true)"
          if [ -z "$CIVO_VERSION" ] || [[ "$CIVO_VERSION" != v* ]]; then
            echo "::warning::gh release view did not return a v-prefixed tag; falling back to v1.5.4"
            CIVO_VERSION="v1.5.4"
          fi
          echo "Civo CLI version: $CIVO_VERSION"

          # Download the linux/amd64 archive. Prefer gh release download; fall back to a
          # direct API+curl+jq lookup so we don't lose the public-URL resilience path.
          ARCHIVE="/tmp/civo-${CIVO_VERSION#v}-linux-amd64.tar.gz"
          if ! gh release download "$CIVO_VERSION" --repo civo/cli \
               --pattern 'civo-*-linux-amd64.tar.gz' \
               --dir /tmp 2>/dev/null; then
            echo "::warning::gh release download failed for ${CIVO_VERSION}; trying direct API lookup"
            ASSET_URL=$(curl -sSfL -H "Authorization: Bearer $GITHUB_TOKEN" \
              https://api.github.com/repos/civo/cli/releases/tags/"$CIVO_VERSION" \
              | jq -r '.assets[] | select(.name | endswith("linux-amd64.tar.gz")) | .browser_download_url' \
              | head -n1)
            if [ -z "$ASSET_URL" ]; then
              echo "❌ Direct API lookup also failed for ${CIVO_VERSION}"
              exit 1
            fi
            curl -sSfL "$ASSET_URL" -o "$ARCHIVE"
          fi

          # Validate the file is actually gzip before extraction
          if ! file "$ARCHIVE" | grep -q 'gzip compressed'; then
            echo "❌ Downloaded file is not gzip. Contents:"
            head -c 500 "$ARCHIVE"
            exit 1
          fi

          tar xzf "$ARCHIVE" -C /usr/local/bin/ civo
          civo --version

      - name: Configure Civo
        env:
          CIVO_API_KEY: ${{ secrets.CIVO_API_KEY }}
        run: civo apikey save --load-from-env -y

      - name: Wait for cluster to be ready
        run: |
          echo "Waiting for pixelated-cluster to be ready..."
          for i in {1..30}; do
            STATUS=$(civo kubernetes show pixelated-cluster -o json | jq -r '.conditions[] | select(.type=="ControlPlaneConnectivity") | .status // empty')
            if [ "$STATUS" == "True" ]; then
              echo "✅ Cluster is ready"
              break
            fi
            echo "Attempt $i/30: Cluster not ready yet, waiting..."
            sleep 20
          done

      - name: Update kubeconfig
        run: |
          mkdir -p ~/.kube
          civo kubernetes config pixelated-cluster > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Install kubectl and kustomize
        run: |
          # kubectl + kustomize are public-CDN downloads (no auth needed).
          # GH_TOKEN is inherited from the job-level env block but unused here.
          # Resolve stable kubectl version with fallback
          KUBE_STABLE=$(curl -sSfL https://dl.k8s.io/release/stable.txt 2>/dev/null) || {
            echo "⚠️  Could not resolve stable kubectl version from CDN; falling back to v1.36.3"
            KUBE_STABLE="v1.36.3"
          }
          echo "Kubectl version: $KUBE_STABLE"

          curl -sSfL "https://dl.k8s.io/release/${KUBE_STABLE}/bin/linux/amd64/kubectl" -o /tmp/kubectl

          # Validate the file is an ELF binary (not an HTML error page)
          if ! file /tmp/kubectl | grep -q 'ELF.*x86-64'; then
            echo "❌ Downloaded kubectl is not an ELF binary. Contents:"
            head -c 500 /tmp/kubectl
            exit 1
          fi

          chmod +x /tmp/kubectl
          sudo mv /tmp/kubectl /usr/local/bin/kubectl

          KUSTOMIZE_VERSION=5.6.0
          KUSTOMIZE_BASE_URL="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}"
          KUSTOMIZE_ARCHIVE="kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          # NOTE: Keep this checksum pinned in-repo to avoid trusting a remote .sha256 file.
          # Update this value when bumping KUSTOMIZE_VERSION.
          EXPECTED_KUSTOMIZE_SHA256="54e4031ddc4e7fc59e408da29e7c646e8e57b8088c51b84b3df0864f47b5148f"

          curl -sSfL "${KUSTOMIZE_BASE_URL}/${KUSTOMIZE_ARCHIVE}" -o "${KUSTOMIZE_ARCHIVE}"

          echo "${EXPECTED_KUSTOMIZE_SHA256}  ${KUSTOMIZE_ARCHIVE}" | sha256sum -c -

          # Validate the file is gzip before extraction
          if ! file "${KUSTOMIZE_ARCHIVE}" | grep -q 'gzip compressed'; then
            echo "❌ Downloaded kustomize archive is not gzip. Contents:"
            head -c 500 "${KUSTOMIZE_ARCHIVE}"
            exit 1
          fi

          tar xzf "${KUSTOMIZE_ARCHIVE}"
          sudo mv kustomize /usr/local/bin/
          rm "${KUSTOMIZE_ARCHIVE}"

      - name: Deploy to Civo
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_API_KEY: ${{ secrets.CLOUDFLARE_AI_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          LINEAR_AGENT_ACCESS_TOKEN: ${{ secrets.LINEAR_AGENT_ACCESS_TOKEN }}
          LINEAR_WEBHOOK_SECRET: ${{ secrets.LINEAR_WEBHOOK_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          EVE_AUTH_USERNAME: ${{ secrets.EVE_AUTH_USERNAME }}
          EVE_AUTH_PASSWORD: ${{ secrets.EVE_AUTH_PASSWORD }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          # Install Traefik CRDs first
          helm repo add traefik https://helm.traefik.io/traefik 2>/dev/null || true
          helm template traefik/traefik --name-template traefik --set crds.enabled=true 2>/dev/null | kubectl apply -f - --validate=false || \
          helm show crds traefik/traefik | kubectl apply -f - --validate=false

           kubectl apply -f infra/k8s/civo/namespace.yaml

           # Create dockerhub-registry-credentials imagePullSecret
           # Required by deployment imagePullSecrets to pull from Docker Hub
           kubectl create secret docker-registry dockerhub-registry-credentials \
             --docker-username="${{ secrets.DOCKERHUB_USERNAME }}" \
             --docker-password="${{ secrets.DOCKERHUB_TOKEN }}" \
             -n pixelated-empathy \
             --dry-run=client -o yaml | kubectl apply -f -

           kubectl create secret generic cloudflare-workers-ai \
            --from-literal=account-id="${CLOUDFLARE_ACCOUNT_ID:-}" \
            --from-literal=api-key="${CLOUDFLARE_AI_API_KEY:-}" \
            -n pixelated-empathy \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic slack-agent \
            --from-literal=bot-token="${SLACK_BOT_TOKEN:-}" \
            --from-literal=signing-secret="${SLACK_SIGNING_SECRET:-}" \
            -n pixelated-empathy \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic linear-agent \
            --from-literal=access-token="${LINEAR_AGENT_ACCESS_TOKEN:-}" \
            --from-literal=webhook-secret="${LINEAR_WEBHOOK_SECRET:-}" \
            -n pixelated-empathy \
            --dry-run=client -o yaml | kubectl apply -f -
          # Umami analytics secrets (self-hosted Umami replaced Rybbit).
          # UMAMI_DATABASE_URL: postgres connection string for the umami DB.
          # UMAMI_APP_SECRET: random 32+ byte string (session/data signing).
          kubectl create secret generic umami-secrets \
            --from-literal=DATABASE_URL="${{ secrets.UMAMI_DATABASE_URL }}" \
            --from-literal=APP_SECRET="${{ secrets.UMAMI_APP_SECRET }}" \
            -n pixelated-empathy \
            --dry-run=client -o yaml | kubectl apply -f -
          # App runtime secrets consumed via envFrom (deployment-blue/green).
          # JWT_SECRET is strictly required by apps/web/src/lib/auth/config.ts —
          # without it the new pod crashloops and the blue rollout stalls at
          # its progress deadline.
          kubectl create secret generic pixelated-empathy-secrets \
            --from-literal=JWT_SECRET="${JWT_SECRET}" \
            -n pixelated-empathy \
            --dry-run=client -o yaml | kubectl apply -f -
          # Agent fleet secrets. EVE auth falls back to placeholderAuth (401)
          # when unset, but the k8s env bindings fail hard on a missing
          # Secret object, so provision the objects with empty values rather
          # than letting pod creation fail (CreateContainerConfigError).
          kubectl create secret generic eve-auth \
            --from-literal=username="${EVE_AUTH_USERNAME:-}" \
            --from-literal=password="${EVE_AUTH_PASSWORD:-}" \
            -n pixelated-empathy \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic mongodb \
            --from-literal=uri="${MONGODB_URI:-}" \
            -n pixelated-empathy \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -k infra/k8s/civo
           kubectl apply -f agents/session-agent/k8s/deployment.yaml
           kubectl apply -f agents/qa-agent/k8s/deployment.yaml
           kubectl apply -f agents/pipeline-agent/k8s/deployment.yaml
           # Delete orphaned deployment (not in kustomization, stale spec)
           kubectl delete deployment/pixelated-empathy -n pixelated-empathy --ignore-not-found

           # Target blue (active slot — Service routes to slot: blue)
           kubectl set image deployment/pixelated-empathy-blue pixelated-empathy=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.app_digest }} -n pixelated-empathy
           kubectl set image deployment/session-agent agent=${{ env.REGISTRY }}/${{ env.SESSION_AGENT_IMAGE_NAME }}@${{ needs.build-and-push.outputs.session_digest }} -n pixelated-empathy
           kubectl set image deployment/qa-agent agent=${{ env.REGISTRY }}/${{ env.QA_AGENT_IMAGE_NAME }}@${{ needs.build-and-push.outputs.qa_digest }} -n pixelated-empathy
           kubectl set image deployment/pipeline-agent agent=${{ env.REGISTRY }}/${{ env.PIPELINE_AGENT_IMAGE_NAME }}@${{ needs.build-and-push.outputs.pipeline_digest }} -n pixelated-empathy

           echo "Waiting for rollout..."
           # Dump pod diagnostics in parallel with rollout wait so a stalled
           # rollout still produces logs/events in the run output. The wait
           # below fails hard on timeout; this loop only reports.
           (
             for i in $(seq 1 20); do
               sleep 30
               echo "=== Diagnostics t+${i}m ==="
               kubectl get pods -n pixelated-empathy -o wide || true
               echo "--- Namespace events (recent) ---"
               kubectl get events -n pixelated-empathy --sort-by=.lastTimestamp 2>/dev/null | tail -30 || true
               echo "--- Non-running pods (describe) ---"
               kubectl describe pods -n pixelated-empathy 2>/dev/null | awk '/^Name:/{name=$2} /Events:/{show=1} show && name!=last{print "### "name; last=name} show' | head -60 || true
               echo "--- Umami logs ---"
               kubectl logs -n pixelated-empathy -l app.kubernetes.io/name=umami --all-containers --tail=30 --prefix --ignore-errors || true
               echo "--- Agent pod logs (session/qa/pipeline) ---"
               for d in session-agent qa-agent pipeline-agent; do
                 echo "### $d"
                 kubectl logs -n pixelated-empathy -l app=$d --all-containers --tail=25 --prefix --ignore-errors || true
               done
               echo "--- Blue pod logs ---"
               kubectl logs -n pixelated-empathy -l app=pixelated-empathy,slot=blue --all-containers --tail=40 --prefix --ignore-errors || true
             done
           ) &
           DIAG_PID=$!
           trap 'kill $DIAG_PID 2>/dev/null || true' EXIT

           kubectl rollout status deployment/pixelated-empathy-blue -n pixelated-empathy --timeout=10m
           kill $DIAG_PID 2>/dev/null || true
           kubectl rollout status deployment/session-agent -n pixelated-empathy --timeout=10m
           kubectl rollout status deployment/qa-agent -n pixelated-empathy --timeout=10m
           kubectl rollout status deployment/pipeline-agent -n pixelated-empathy --timeout=10m

           echo "Waiting for old pods to fully terminate before smoke test..."
           # kubectl rollout status exits when new pods are Ready, but Terminating old
           # pods may still be in the LB rotation. Terminating pods remain phase=Running
           # in k8s, so we must grep the STATUS column directly.
           for i in $(seq 1 18); do
             TERMINATING=$(kubectl get pods -n pixelated-empathy --no-headers 2>/dev/null | grep -c Terminating || true)
             if [[ "${TERMINATING}" == "0" ]]; then
               echo "All pods healthy, no Terminating pods remaining."
               break
             fi
             echo "  ${TERMINATING} pod(s) still Terminating, waiting... (${i}/18)"
             sleep 5
           done

           echo "Verifying new image is running on at least one pod..."
           EXPECTED_DIGEST="${{ needs.build-and-push.outputs.app_digest }}"
           RUNNING_IMAGE=$(kubectl get pods -n pixelated-empathy -l app=pixelated-empathy,slot=blue -o jsonpath='{.items[*].spec.containers[0].image}' | tr ' ' '\n' | head -n 1)
           if [[ "${RUNNING_IMAGE}" != *"${EXPECTED_DIGEST}"* ]]; then
             echo "⚠️ Image mismatch: expected digest '${EXPECTED_DIGEST}' but running '${RUNNING_IMAGE}'"
             echo "This can happen when concurrent deployments overwrite the same tag."
             kubectl get pods -n pixelated-empathy -o wide
             # Soft-fail: don't exit 1 here because concurrent deployments to the same
             # tag (e.g., staging) can legitimately cause a digest mismatch even though
             # the rollout itself succeeded.
           else
             echo "✅ New image digest '${EXPECTED_DIGEST}' confirmed running."
           fi

      - name: Verify deployment
        run: |
          echo "=== Pod status ==="
          kubectl get pods -n pixelated-empathy

          echo "=== Service status ==="
          kubectl get svc -n pixelated-empathy

          echo "=== Ingress status ==="
          kubectl get ingress -n pixelated-empathy

          echo "=== Umami ingress detail (host-rule routing check) ==="
          kubectl get ingress umami-ingress -n pixelated-empathy -o yaml || true

          echo "=== Traefik entrypoints (dashboard API) ==="
          TRAEFIK_POD=$(kubectl get pods -A -l app.kubernetes.io/name=traefik -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          TRAEFIK_NS=$(kubectl get pods -A -l app.kubernetes.io/name=traefik -o jsonpath='{.items[0].metadata.namespace}' 2>/dev/null)
          if [ -n "$TRAEFIK_POD" ]; then
            kubectl exec -n "$TRAEFIK_NS" "$TRAEFIK_POD" -- wget -qO- http://localhost:9000/api/http/routers 2>/dev/null \
              | python3 -c "import json,sys; [print(r.get('entryPoints'), r.get('rule'), '->', r.get('service'), r.get('status')) for r in json.load(sys.stdin)]" || true
          else
            echo "(traefik pod not found via label app.kubernetes.io/name=traefik)"
          fi

          echo "=== Umami routing smoke test (analytics subdomain) ==="
          curl -s -o /dev/null -w "analytics /api/heartbeat: %{http_code}\n" https://analytics.pixelatedempathy.com/api/heartbeat || true
          curl -s -o /dev/null -w "analytics /script.js: %{http_code}\n" https://analytics.pixelatedempathy.com/script.js || true

          echo "=== Live site smoke test ==="
          SITE_URL="https://pixelatedempathy.com"
          bash scripts/deploy/verify-deployment.sh "${SITE_URL}/api/health" "${SITE_URL}"
