# Release notes are generated from merged PR titles + conventional commits by
# GitHub's native generator (same engine as the "Generate release notes"
# button). Trigger: push a `v*` tag. CI on staging gates what ships; this
# workflow only packages the notes and attaches the release.
name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create release with generated notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # GH_TOKEN at job level (see _shared-conventions.md); the default
    # GITHUB_TOKEN is not read by the gh CLI.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Generate release notes and publish
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release for $TAG already exists; nothing to do."
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
