name: 'CodeQL'

permissions:
  contents: read
  security-events: write
  actions: write

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master, staging]
  schedule:
    # Run every Monday at 2:00 AM UTC
    - cron: '0 2 * * 1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 24.16.0
  PYTHON_VERSION: 3.13.13

jobs:
  analyze:
    name: Analyze
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    # Skip CodeQL on Dependabot PRs to avoid transient GitHub action download rate-limit failures.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group:
        codeql-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name
        }}-${{ matrix.language }}
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript', 'python']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Initialize submodules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/devops/init-submodules.sh

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql/codeql-config.yml
          queries: +security-and-quality,security-extended
          # Enable ML-powered alerts for JavaScript/TypeScript
          # Increase RAM allocation for analysis
          ram: 16384
          trap-caching: false

      - name: Setup Node.js
        if: matrix.language == 'javascript'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        if: matrix.language == 'javascript'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Get pnpm store directory
        if: matrix.language == 'javascript'
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        if: matrix.language == 'javascript'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Clean pnpm workspace artifacts
        if: matrix.language == 'javascript'
        run: rm -rf node_modules

      - name: Install native build dependencies
        if: matrix.language == 'javascript'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 build-essential
          npm install -g node-gyp

      - name: Install JavaScript dependencies
        if: matrix.language == 'javascript'
        run: |
          PNPM_CONFIG_TRUST_LOCKFILE=true pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Autobuild JavaScript/TypeScript
        if: matrix.language == 'javascript'
        uses: github/codeql-action/autobuild@v4

      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # uv shim installation is handled inside ./.github/actions/prepare-uv-venv

      - name: Prepare uv venv
        if: matrix.language == 'python'
        id: prepare-uv
        uses: ./.github/actions/prepare-uv-venv
        with:
          service-dir: src/lib/ai/bias-detection/python-service

      - name: Install Python dependencies
        if: matrix.language == 'python'
        env:
          # Point uv at the venv that prepare-uv-venv created so it doesn't
          # fall back to the system interpreter when USE_SYSTEM is empty.
          VIRTUAL_ENV:
            ${{ github.workspace
            }}/src/lib/ai/bias-detection/python-service/.venv
        run: |
          # Install Python dependencies for CodeQL analysis
          # Check if bias-detection service exists
          if [ -d "src/lib/ai/bias-detection/python-service" ]; then
            cd src/lib/ai/bias-detection/python-service
            USE_SYSTEM="${{ steps.prepare-uv.outputs.use-system }}"
            uv pip install ${USE_SYSTEM} --upgrade 'pip>=25.3' setuptools wheel
            uv pip install ${USE_SYSTEM} -r requirements.txt || true
            cd - > /dev/null
          fi

          # Install other Python dependencies if they exist.
          # Exclude: python-service (handled above), its parent bias-detection dir
          # (no standalone venv; overlaps with python-service deps), and
          # ai/data scratch dirs. Use --system for any remaining dirs without a
          # local .venv so uv doesn't error out.
          find . -name "requirements.txt" \
            -not -path "*/node_modules/*" \
            -not -path "*/.venv/*" \
            -not -path "*/site-packages/*" \
            -not -path "*/src/lib/ai/bias-detection/*" \
            -not -path "*/ai/data/*" \
            | head -5 | while read req; do
            dir=$(dirname "$req")
            echo "Installing dependencies from $dir"
            cd "$dir"
            if [ -d ".venv" ]; then
              DIR_USE_SYSTEM=""
              DIR_VIRTUAL_ENV="${PWD}/.venv"
            else
              DIR_USE_SYSTEM="--system"
              DIR_VIRTUAL_ENV=""
            fi
            VIRTUAL_ENV="${DIR_VIRTUAL_ENV}" uv pip install ${DIR_USE_SYSTEM} -r requirements.txt || true
            cd - > /dev/null
          done || true

      - name: Autobuild Python
        if: matrix.language == 'python'
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
          # Upload SARIF file to GitHub Security tab
          upload: true
          # Configure output format
          output: sarif-latest

      - name: Collect CodeQL SARIF results
        id: codeql-sarif
        if: always()
        shell: bash
        run: |
          mapfile -t SARIF_FILES < <(find "${RUNNER_TEMP}/codeql_databases" -type f -name "*.sarif")
          if [ "${#SARIF_FILES[@]}" -eq 0 ]; then
            echo "found=false" >> "${GITHUB_OUTPUT}"
            echo "No CodeQL SARIF files were found under ${RUNNER_TEMP}/codeql_databases."
          else
            echo "found=true" >> "${GITHUB_OUTPUT}"
            {
              echo "paths<<EOF"
              printf "%s\n" "${SARIF_FILES[@]}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload SARIF results as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && steps.codeql-sarif.outputs.found == 'true'
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: ${{ steps.codeql-sarif.outputs.paths }}
          retention-days: 30

      - name: Upload CodeQL database (for advanced analysis)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: codeql-database-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql_databases
          retention-days: 7
