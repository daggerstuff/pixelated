name: Usability Overflow Diagnostic (temporary)

permissions:
  contents: read

on:
  push:
    branches: [diagnostic/usability-overflow]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PNPM_CONFIG_TRUST_LOCKFILE: 'true'
  GHA_LOCAL_RUN: 'false'
  NODE_VERSION: 24.16.0
  NODE_ENV: test
  DISABLE_AUTH: 'true'

jobs:
  diagnostic:
    name: Dump overflowing elements at mobile widths
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      actions: write

    steps:
      - uses: actions/checkout@v7

      - name: Initialize submodules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/devops/init-submodules.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 build-essential
          npm install -g node-gyp

      - name: Install dependencies
        run: PNPM_CONFIG_TRUST_LOCKFILE=true pnpm install --no-frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build project
        run: pnpm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Run overflow diagnostic
        run: |
          set -euo pipefail

          PREVIEW_PORT=4323
          PREVIEW_URL="http://127.0.0.1:${PREVIEW_PORT}"
          PREVIEW_LOG=/tmp/pixelated-preview.log
          rm -f "${PREVIEW_LOG}"

          cleanup() {
            local exit_code=$?
            if [[ -n "${PREVIEW_PID:-}" ]] && kill -0 "${PREVIEW_PID}" > /dev/null 2>&1; then
              kill "${PREVIEW_PID}" > /dev/null 2>&1 || true
              wait "${PREVIEW_PID}" > /dev/null 2>&1 || true
            fi
            if [[ ${exit_code} -ne 0 ]]; then
              echo "Last preview logs:"
              tail -n 80 "${PREVIEW_LOG}" || true
            fi
            exit "${exit_code}"
          }
          trap cleanup EXIT

          echo "Starting preview server on ${PREVIEW_URL}..."
          nohup env HOST=127.0.0.1 PORT="${PREVIEW_PORT}" WEBSITES_PORT="${PREVIEW_PORT}" pnpm run preview > "${PREVIEW_LOG}" 2>&1 &
          PREVIEW_PID=$!

          for attempt in $(seq 1 60); do
            if ! kill -0 "${PREVIEW_PID}" > /dev/null 2>&1; then
              echo "Preview process is not running."
              exit 1
            fi
            if curl -sS --connect-timeout 2 --max-time 5 "${PREVIEW_URL}" > /dev/null 2>&1; then
              echo "Server is ready at ${PREVIEW_URL}!"
              break
            fi
            if [[ ${attempt} -eq 60 ]]; then
              echo "Server failed to become ready after 60 seconds."
              exit 1
            fi
            sleep 1
          done

          export NODE_ENV=test
          export DISABLE_AUTH=true
          export DISABLE_PLAYWRIGHT_WEBSERVER=true
          export BASE_URL="${PREVIEW_URL}"

          node tests/usability-overflow-diagnostic.mjs
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Upload diagnostic results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: overflow-diagnostic-${{ github.run_id }}
          path: test-results/overflow-diagnostic.json
          retention-days: 7
          if-no-files-found: warn
