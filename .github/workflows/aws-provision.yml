name: Provision AWS EKS

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: aws
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: pixelated-eks-provision
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Install eksctl
        run: |
          ARCHIVE=/tmp/eksctl_Linux_amd64.tar.gz
          curl -fsSLo "$ARCHIVE" "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_Linux_amd64.tar.gz"
          tar -xzf "$ARCHIVE" -C /tmp
          sudo mv /tmp/eksctl /usr/local/bin/eksctl
          eksctl version

      - name: Grant temporary EKS bootstrap permissions
        run: |
          ROLE_NAME="pixelated-empathy-github-actions"
          POLICY_ARN="arn:aws:iam::aws:policy/AdministratorAccess"
          aws iam attach-role-policy --role-name "$ROLE_NAME" --policy-arn "$POLICY_ARN"

      - name: Create EKS cluster
        run: eksctl create cluster -f infra/aws/eksctl/pixelated-eks.yaml --timeout 60m

      - name: Revoke temporary EKS bootstrap permissions
        if: always()
        run: |
          ROLE_NAME="pixelated-empathy-github-actions"
          POLICY_ARN="arn:aws:iam::aws:policy/AdministratorAccess"
          aws iam detach-role-policy --role-name "$ROLE_NAME" --policy-arn "$POLICY_ARN" || true
