name: 'Copilot Setup Steps'
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize submodules
        run: bash scripts/devops/init-submodules.sh

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '24.16.0'

      - name: Lint code
        continue-on-error: true
        run: pnpm lint:ci

      - name: Lint markdown
        continue-on-error: true
        run: pnpm lint:markdown:ci

      - name: Format check (Prettier)
        run: pnpm exec prettier --check . || true

      - name: Run tests
        continue-on-error: true
        run: |
          if pnpm exec vitest --version 2>/dev/null; then
            pnpm exec vitest run --reporter=dot
          elif pnpm exec jest --version 2>/dev/null; then
            pnpm exec jest --ci
          else
            echo "No supported test runner found (vitest/jest)."
          fi

      - name: Run oxlint type-aware
        run: pnpm lint:ci:type-aware || true

      - name: Summary
        run: |
          echo "=== Code Quality Check Summary ==="
          echo "Lint: Oxlint completed (non-blocking)"
          echo "Markdown lint completed (non-blocking)"
          echo "Format: Prettier check completed"
          echo "Tests: Unit tests completed (non-blocking)"
          echo "Type Check: TypeScript validation completed"
          echo "Code quality checks completed. Review log output for any failures."
