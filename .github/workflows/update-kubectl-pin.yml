name: Update Kubectl Fallback Version

on:
  schedule:
    # Weekly: Tuesday 3:00 AM UTC (stagger from Civo CLI on Monday)
    - cron: '0 3 * * 2'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # WORKFLOW_PAT rationale + setup; see .github/workflows/_shared-conventions.md#workflow_pat_secret_for_editing_workflow_files.

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Pass WORKFLOW_PAT so git has PAT credentials configured for the
          # push in create-pull-request. If the secret is unset, checkout
          # falls back to GITHUB_TOKEN (actions/checkout default) and the
          # pre-flight check below skips the PR step — no push is attempted.
          token: ${{ secrets.WORKFLOW_PAT }}
          persist-credentials: true

      - name: Get latest kubectl stable version
        id: latest
        run: |
          LATEST=$(curl -sSfL https://dl.k8s.io/release/stable.txt 2>/dev/null)

          # stable.txt returns something like "v1.33.2"
          if [[ -z "$LATEST" || "$LATEST" != v* ]]; then
            echo "❌ Could not resolve a valid version from dl.k8s.io. Got: '$LATEST'"
            exit 1
          fi

          echo "Latest stable kubectl: $LATEST"
          echo "version=$LATEST" >> $GITHUB_OUTPUT

      - name: Get current pinned version
        id: current
        run: |
          # Grep the KUBE_STABLE= assignment directly (unambiguous — there are two
          # "falling back to" lines in deploy-civo.yml and the Civo CLI one comes first)
          CURRENT=$(grep -oP 'KUBE_STABLE="\Kv[\d]+\.[\d]+\.[\d]+' .github/workflows/deploy-civo.yml)
          echo "Current pin: $CURRENT"
          echo "version=$CURRENT" >> $GITHUB_OUTPUT

      - name: Update pin if newer
        id: update
        if: steps.latest.outputs.version != steps.current.outputs.version
        run: |
          OLD="${{ steps.current.outputs.version }}"
          NEW="${{ steps.latest.outputs.version }}"
          echo "Updating pin from $OLD to $NEW"

          # Update both occurrences: the echo message and the variable assignment
          sed -i "s/falling back to ${OLD}/falling back to ${NEW}/g" .github/workflows/deploy-civo.yml
          sed -i "s/KUBE_STABLE=\"${OLD}\"/KUBE_STABLE=\"${NEW}\"/g" .github/workflows/deploy-civo.yml

          echo "changed=true" >> $GITHUB_OUTPUT
          echo "old=$OLD" >> $GITHUB_OUTPUT
          echo "new=$NEW" >> $GITHUB_OUTPUT

      - name: 'Pre-flight: verify WORKFLOW_PAT secret is valid'
        id: preflight
        if: steps.update.outputs.changed == 'true'
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
        run: |
          # Soft-fail (rationale in .github/workflows/_shared-conventions.md#workflow_pat_secret_for_editing_workflow_files).
          if [[ -z "$WORKFLOW_PAT" ]]; then
            echo "::warning::WORKFLOW_PAT secret is not set on this repository."
            echo "::warning::Skipping Create Pull Request step. See the"
            echo "::warning::permissions: block at the top of this file for"
            echo "::warning::setup instructions (PAT with 'workflow' scope)."
            echo "has_pat=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Validate the token by making an API call — a non-empty but
          # expired/revoked PAT passes the -z check yet causes the push to
          # fail with "could not read Username" (no valid credentials).
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $WORKFLOW_PAT" \
            https://api.github.com/user)

          if [[ "$HTTP_CODE" == "200" ]]; then
            echo "has_pat=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::WORKFLOW_PAT secret is set but invalid (HTTP $HTTP_CODE)."
            echo "::warning::The token may be expired or revoked. Regenerate it"
            echo "::warning::and update the repo secret in Settings > Secrets."
            echo "::warning::See .github/workflows/_shared-conventions.md"
            echo "::warning::#workflow_pat_secret_for_editing_workflow_files"
            echo "has_pat=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if:
          steps.update.outputs.changed == 'true' &&
          steps.preflight.outputs.has_pat == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          # Use WORKFLOW_PAT (not GITHUB_TOKEN) so the push is authorized
          # to modify files under .github/workflows/. See permissions: block
          # above for setup instructions.
          token: ${{ secrets.WORKFLOW_PAT }}
          commit-message:
            'chore: bump kubectl fallback version from ${{
            steps.update.outputs.old }} to ${{ steps.update.outputs.new }}'
          title:
            'chore: update kubectl pinned fallback version to ${{
            steps.update.outputs.new }}'
          body: |
            A new kubectl stable version has been released: **${{ steps.update.outputs.new }}**

            This PR updates the pinned fallback version in `deploy-civo.yml` from `${{ steps.update.outputs.old }}` to `${{ steps.update.outputs.new }}`.

            The fallback is used when `dl.k8s.io` is unreachable during CI deployments.

            Triggered by `update-kubectl-pin` workflow.
          branch: update-kubectl-pin
          base: staging
          delete-branch: true
          labels: |
            dependencies
            automated
