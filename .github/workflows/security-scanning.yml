# ⚠️ DEPRECATED — Consolidated into .github/workflows/security.yml
#
# This file is kept for historical run reference only.
# All jobs have been migrated to the consolidated workflow.
# Do not add new jobs here — add them to security.yml instead.
#
# TODO: Remove this file after 2026-08-31 when all active branches
#       have picked up the consolidated workflow.
name: Security Scanning (DEPRECATED)

permissions:
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GHA_LOCAL_RUN: 'false'

# Disabled — all jobs consolidated into .github/workflows/security.yml
# Kept for historical reference only. Do not re-enable; add new jobs to security.yml.
on:
  workflow_dispatch:

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-24.04
    env:
      # Warn-only mode: vulnerabilities are uploaded to GitHub Security tab
      # (SARIF) but don't block the pipeline. The CI workflow uses the same
      # warn-only approach for its Trivy gate.
      TRIVY_STRICT_GATE: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Initialize submodules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/devops/init-submodules.sh

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13.13'

      - name: Set up uv
        uses: ./.github/actions/setup-uv

      - name: Prepare Helm dependencies for Trivy scan
        if: ${{ env['GHA_LOCAL_RUN'] != 'true' }}
        run: |
          if ! command -v helm >/dev/null 2>&1; then
            echo "Helm CLI not found; installing."
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          fi
          helm repo add bitnami https://charts.bitnami.com/bitnami --force-update
          helm repo add traefik https://traefik.github.io/charts --force-update
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update
          helm repo add grafana https://grafana.github.io/helm-charts --force-update
          helm dep update ai/inference/deployment/pixel-voice
          helm dep update ai/inference/deployment/helm/pixelated-empathy

      - name: Run Trivy vulnerability scanner
        if: ${{ env['GHA_LOCAL_RUN'] != 'true' }}
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          NODE_OPTIONS:
            ${{ vars.TRACE_TRIVY_DEPRECATION == 'true' && '--trace-deprecation'
            || '--no-deprecation' }}
        with:
          cache: 'false'
          scan-type: 'fs'
          scanners: 'vuln,secret,misconfig'
          trivy-config: .github/security/trivy/trivy.yaml
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          skip-files: ai/training/sliced/stage2_therapeutic_expertise/clinical_diagnosis_mental_health.json,ai/training/sliced/stage2_therapeutic_expertise/cultural_nuances.json,ai/training/v1/stage2_expertise/reasoning/clinical_diagnosis_mental_health.json,ai/training/v1/stage2_expertise/reasoning/cultural_nuances.json
          # Keep SARIF aligned with the configured severity gate.
          limit-severities-for-sarif: true
        continue-on-error: true

      - name: Run Checkov infrastructure scan
        if: ${{ env['GHA_LOCAL_RUN'] != 'true' }}
        id: checkov_infra
        uses: bridgecrewio/checkov-action@v12.3121.0
        with:
          directory: .
          framework: terraform,terraform_plan,bicep
          output_format: sarif
          output_file_path: checkov-infra-results.sarif
          skip_check: ''
          skip_path: 'clusters,ai/training/defense_mechanisms,ai/inference/deployment/pixel-voice,infra/docker/traefik,ai/config,ai/monitoring,ai/training/configs,ai/training/ready_packages,ai/training_data_unified'
          log_level: WARNING
          container_user: 0
        continue-on-error: true

      - name: Run Checkov Kubernetes and Helm scan
        if: ${{ env['GHA_LOCAL_RUN'] != 'true' }}
        id: checkov_helm
        uses: bridgecrewio/checkov-action@v12.3121.0
        with:
          directory: ai/inference/deployment/pixel-voice
          framework: kubernetes,helm
          output_format: sarif
          output_file_path: checkov-helm-results.sarif
          skip_check: ''
          log_level: WARNING
          container_user: 0
        continue-on-error: true

      - name: Check for Checkov infrastructure SARIF file
        id: checkov_infra_sarif
        run: |
          if [ -s checkov-infra-results.sarif ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for Checkov Helm/Kubernetes SARIF file
        id: checkov_helm_sarif
        run: |
          if [ -s checkov-helm-results.sarif ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for Trivy SARIF file
        id: trivy_sarif
        run: |
          if [ -s trivy-results.sarif ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create diagnostic artifact when Trivy SARIF missing
        if: ${{ steps.trivy_sarif.outputs.found == 'false' }}
        run: |
          echo "Trivy SARIF not produced (vulnerability DB download may have failed)." > trivy-missing.txt || true

      - name: Upload Trivy diagnostic artifact
        if: ${{ steps.trivy_sarif.outputs.found == 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-diagnostic
          path: trivy-missing.txt

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && steps.trivy_sarif.outputs.found == 'true' }}
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-fs

      - name: Upload Trivy SARIF as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && steps.trivy_sarif.outputs.found == 'true' }}
        with:
          name: trivy-sarif
          path: trivy-results.sarif

      - name: Trivy security gate (active)
        if: always() && steps.trivy_sarif.outputs.found == 'true'
        env:
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
        run: |
          echo "::notice::Trivy scan completed. Outcome: ${TRIVY_OUTCOME}. Findings uploaded to GitHub Security tab (warn-only mode)."
          echo "    https://github.com/${{ github.repository }}/security/code-scanning"

      - name: Upload Checkov Infrastructure scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && steps.checkov_infra_sarif.outputs.found == 'true' }}
        with:
          sarif_file: 'checkov-infra-results.sarif'
          category: checkov-infra

      - name: Upload Helm/Kubernetes Checkov scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && steps.checkov_helm_sarif.outputs.found == 'true' }}
        with:
          sarif_file: 'checkov-helm-results.sarif'
          category: checkov-helm

      - name: Create diagnostic artifact when Checkov SARIF is missing
        if: ${{ steps.checkov_infra_sarif.outputs.found == 'false' ||
          steps.checkov_helm_sarif.outputs.found == 'false' }}
        run: |
          if [ "${{ steps.checkov_infra_sarif.outputs.found }}" != "true" ]; then
            echo "Checkov infrastructure SARIF not produced." > checkov-missing.txt
          fi
          if [ "${{ steps.checkov_helm_sarif.outputs.found }}" != "true" ]; then
            echo "Checkov Helm/Kubernetes SARIF not produced." >> checkov-missing.txt
          fi

      - name: Upload Checkov diagnostic artifact
        if: ${{ steps.checkov_infra_sarif.outputs.found == 'false' ||
          steps.checkov_helm_sarif.outputs.found == 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checkov-diagnostic
          path: checkov-missing.txt

      - name: Upload Checkov SARIF as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && steps.checkov_infra_sarif.outputs.found == 'true' }}
        with:
          name: checkov-infra-sarif
          path: checkov-infra-results.sarif

      - name: Upload Helm/Kubernetes Checkov SARIF as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && steps.checkov_helm_sarif.outputs.found == 'true' }}
        with:
          name: checkov-helm-sarif
          path: checkov-helm-results.sarif

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize submodules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/devops/init-submodules.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          package-manager-cache: false

      - name: Install pnpm
        run: |
          pnpm_version="$(node -p "require('./package.json').packageManager.replace('pnpm@', '')")"
          if [ -z "${pnpm_version}" ]; then
            echo "Failed to read pnpm version from package.json (packageManager field missing)." >&2
            exit 1
          fi

          for attempt in 1 2 3; do
            if npm install -g "pnpm@${pnpm_version}"; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "pnpm install failed after 3 attempts." >&2
              exit 1
            fi
            echo "pnpm install failed on attempt ${attempt}. Retrying in 5s..."
            sleep 5
          done

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 build-essential
          npm install -g node-gyp

      - name: Install dependencies
        run: PNPM_CONFIG_TRUST_LOCKFILE=true pnpm install --no-frozen-lockfile

      - name: Run security audit
        run: |
          if pnpm audit --help 2>/dev/null | rg -q -- "--prod"; then
            pnpm audit --json --prod --audit-level moderate > audit-results.json || true
          else
            pnpm audit --json --audit-level moderate > audit-results.json || true
          fi
          if [ ! -s audit-results.json ]; then
            echo "pnpm audit returned an empty output." >&2
            exit 1
          fi

      - name: Enforce high+ vulnerability threshold
        run: |
          node scripts/utils/check-pnpm-audit.js --fail-on high audit-results.json

      - name: Upload audit results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-audit-results
          path: audit-results.json

      - name: Generate vulnerability PR comment
        if: github.event_name == 'pull_request'
        id: vuln_comment
        run: |
          node scripts/ci/generate-vuln-comment.js audit-results.json > pr-comment.md || true
          echo "Generated PR comment ($(wc -l < pr-comment.md) lines)"

      - name: Post vulnerability summary to PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        continue-on-error: true
        with:
          header: 🔒 Dependency Vulnerability Scan
          path: pr-comment.md

  python-dependency-scan:
    name: Python Dependency Scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize submodules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/devops/init-submodules.sh

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13.13'

      - name: Set up uv
        uses: ./.github/actions/setup-uv

      - name: Install pip-audit
        run: uv pip install --system pip-audit

      - name: Scan Python dependencies (ai submodule)
        id: pip_audit_ai
        continue-on-error: true
        run: |
          cd ai
          uv pip install --system -r requirements-voice.txt 2>/dev/null || true
          pip-audit -r requirements-voice.txt --format json -o ../pip-audit-ai.json || true
          cd ..

      - name: Scan Python dependencies (bias-detection service)
        id: pip_audit_bias
        continue-on-error: true
        run: |
          cd apps/web/src/lib/ai/bias-detection/python-service
          pip-audit -r requirements.txt --format json -o ../../../pip-audit-bias.json || true
          cd -

      - name: Scan Python dependencies (multimodal-bias-detection service)
        id: pip_audit_multimodal
        continue-on-error: true
        run: |
          if [ -d "apps/web/src/lib/ai/multimodal-bias-detection/python-service" ] && \
             [ -f "apps/web/src/lib/ai/multimodal-bias-detection/python-service/pyproject.toml" ]; then
            cd apps/web/src/lib/ai/multimodal-bias-detection/python-service
            pip-audit --format json -o ../../../pip-audit-multimodal.json || true
            cd -
          else
            echo '{"dependencies":[],"vulnerabilities":[]}' > pip-audit-multimodal.json
          fi

      - name: Enforce Python vulnerability threshold
        run: |
          node scripts/ci/check-pip-audit.js \
            --fail-on high \
            pip-audit-ai.json \
            pip-audit-bias.json \
            pip-audit-multimodal.json

      - name: Upload Python audit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-audit-results
          path: |
            pip-audit-ai.json
            pip-audit-bias.json
            pip-audit-multimodal.json

  sbom-generation:
    name: SBOM Generation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize submodules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/devops/init-submodules.sh

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          retention-days: 30

      - name: Generate SBOM summary
        run: |
          echo "## 📋 SBOM Generated" > sbom-summary.md
          echo "" >> sbom-summary.md
          echo "Format: CycloneDX JSON" >> sbom-summary.md
          echo "Components: $(node -e "const s=require('./sbom.cyclonedx.json'); console.log((s.components||[]).length)" 2>/dev/null || echo 'unknown')" >> sbom-summary.md
          echo "" >> sbom-summary.md
          echo "SBOM artifact available in workflow run artifacts." >> sbom-summary.md
          cat sbom-summary.md

      - name: Post SBOM summary to PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        continue-on-error: true
        with:
          header: 📋 SBOM
          path: sbom-summary.md

  container-image-scan:
    name: Container Image Scan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: node:24-bookworm-slim
            dockerfile: Dockerfile
          - image: node:24-bookworm-slim
            dockerfile: infra/docker/Dockerfile.production
          - image: node:24-alpine
            dockerfile: infra/docker/Dockerfile.prod
          - image: python:3.13-slim
            dockerfile: infra/infra/infra/docker/backend.Dockerfile
          - image: mcr.microsoft.com/playwright:v1.60.0-jammy
            dockerfile: infra/docker/Dockerfile.playwright
          - image: debian:bookworm-slim
            dockerfile: infra/docker/traefik/Dockerfile
          - image: nvcr.io/nvidia/pytorch:26.07-py3
            dockerfile: ai/Dockerfile
          - image: nvidia/cuda:12.8.1-runtime-ubuntu24.04
            dockerfile: infra/infra/docker/training-service/Dockerfile
          - image: nvidia/cuda:12.9.2-runtime-ubuntu24.04
            dockerfile: ai/nemo/gpu/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Scan base image with Trivy
        id: trivy_image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          scan-type: image
          scanners: vuln
          format: json
          output: trivy-image-${{ matrix.dockerfile }}.json
          severity: CRITICAL,HIGH
          exit-code: '0'
        continue-on-error: true

      - name: Check scan results
        id: scan_result
        run: |
          if [ -s trivy-image-${{ matrix.dockerfile }}.json ]; then
            vulns=$(jq '[.Results[]? | .Vulnerabilities[]?] | length' trivy-image-${{ matrix.dockerfile }}.json 2>/dev/null || echo "0")
            critical=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-image-${{ matrix.dockerfile }}.json 2>/dev/null || echo "0")
            high=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-image-${{ matrix.dockerfile }}.json 2>/dev/null || echo "0")
            echo "total=$vulns" >> $GITHUB_OUTPUT
            echo "critical=$critical" >> $GITHUB_OUTPUT
            echo "high=$high" >> $GITHUB_OUTPUT
            echo "::warning::${{ matrix.dockerfile }} (${{ matrix.image }}): $critical CRITICAL, $high HIGH vulnerabilities"
            if [ "$critical" -gt 0 ]; then
              echo "::warning::CRITICAL vulnerabilities found in ${{ matrix.image }}. Results uploaded to Security tab."
            fi
          else
            echo "total=0" >> $GITHUB_OUTPUT
            echo "critical=0" >> $GITHUB_OUTPUT
            echo "high=0" >> $GITHUB_OUTPUT
            echo "::notice::No scan results for ${{ matrix.image }} (scan may have been skipped)"
          fi

      - name: Upload image scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-scan-${{ matrix.dockerfile }}
          path: trivy-image-${{ matrix.dockerfile }}.json

  dockerfile-config-scan:
    name: Dockerfile Configuration Scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Scan all Dockerfiles with Trivy config scan
        id: trivy_config
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scanners: misconfig,secret
          format: sarif
          output: dockerfile-config-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'
        continue-on-error: true

      - name: Check for SARIF file
        id: config_sarif
        run: |
          if [ -s dockerfile-config-results.sarif ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Dockerfile config scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.config_sarif.outputs.found == 'true'
        with:
          sarif_file: dockerfile-config-results.sarif
          category: trivy-dockerfile-config

      - name: Upload Dockerfile config SARIF as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && steps.config_sarif.outputs.found == 'true'
        with:
          name: dockerfile-config-sarif
          path: dockerfile-config-results.sarif

      - name: Generate Dockerfile scan summary
        run: |
          echo "## 🔍 Container Image & Dockerfile Scan Summary" > container-scan-summary.md
          echo "" >> container-scan-summary.md
          echo "### Base Image Vulnerabilities" >> container-scan-summary.md
          echo "| Dockerfile | Base Image | CRITICAL | HIGH |" >> container-scan-summary.md
          echo "|-----------|------------|----------|------|" >> container-scan-summary.md
          echo "| (see container-scan-* artifacts for details) |" >> container-scan-summary.md
          echo "" >> container-scan-summary.md
          echo "### Dockerfile Configuration Issues" >> container-scan-summary.md
          echo "See SARIF results in GitHub Security tab (category: trivy-dockerfile-config)" >> container-scan-summary.md
          echo "" >> container-scan-summary.md
          echo "**Scanned Dockerfiles:**" >> container-scan-summary.md
          echo "- Dockerfile (root)" >> container-scan-summary.md
          echo "- infra/docker/Dockerfile.production" >> container-scan-summary.md
          echo "- infra/docker/Dockerfile.prod" >> container-scan-summary.md
          echo "- infra/infra/docker/backend.Dockerfile" >> container-scan-summary.md
          echo "- infra/infra/docker/celery.Dockerfile" >> container-scan-summary.md
          echo "- infra/docker/Dockerfile.playwright" >> container-scan-summary.md
          echo "- infra/docker/traefik/Dockerfile" >> container-scan-summary.md
          echo "- infra/docker/training-service/Dockerfile" >> container-scan-summary.md
          echo "- ai/Dockerfile" >> container-scan-summary.md
          echo "- ai/nemo/gpu/Dockerfile" >> container-scan-summary.md
          echo "- ai-services/Dockerfile" >> container-scan-summary.md
          echo "- agents/Dockerfile" >> container-scan-summary.md
          echo "- apps/business-strategy-cms/Dockerfile" >> container-scan-summary.md
          echo "- apps/business-strategy-cms/Dockerfile.prod" >> container-scan-summary.md
          cat container-scan-summary.md

      - name: Post container scan summary to PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        continue-on-error: true
        with:
          header: 🔍 Container Image Scan
          path: container-scan-summary.md
