name: Monthly Bias Audit

permissions:
  contents: write
  issues: write

on:
  schedule:
    # Run at 00:00 UTC on the 1st of every month
    - cron: '0 0 1 * *'
  workflow_dispatch:
    # Allow manual trigger

env:
  NODE_VERSION: 24.16.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-bias-audit:
    name: Run Bias Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize submodules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/devops/init-submodules.sh

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          clean-node-modules: 'true'

      - name: Ensure reports directory exists
        run: mkdir -p ai/data/reports

      - name: Run bias audit
        id: bias-audit
        run: |
          MONTH=$(date -u +%Y-%m)
          pnpm tsx scripts/bias-audit/run-monthly-audit.ts "$MONTH"
        env:
          NODE_ENV: production

      - name: Upload report artifact
        uses: actions/upload-artifact@v7
        with:
          name: bias-audit-report-${{ steps.bias-audit.outputs.month }}
          path: ${{ steps.bias-audit.outputs.report-path }}
          if-no-files-found: error
          retention-days: 7

      - name: Create alert issue if threshold exceeded
        if: steps.bias-audit.outputs.threshold-exceeded == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const month = '${{ steps.bias-audit.outputs.month }}';
            const alertLevel = '${{ steps.bias-audit.outputs.alert-level }}';
            // The uploaded artifact is kept for seven days, so the findings a
            // maintainer needs are inlined into the issue below: an alert that
            // stays open past the retention window must still be actionable.
            const report = JSON.parse(
              fs.readFileSync('${{ steps.bias-audit.outputs.report-path }}', 'utf8')
            );
            const exceeded = report.varianceResults
              .filter((v) => v.exceeded)
              .sort((a, b) => b.variance - a.variance);
            const rows = exceeded.map(
              (v) => `| ${v.metric} | ${v.max} | ${v.min} | ${v.variance} ${v.unit} | ${v.threshold} ${v.unit} |`
            );
            const table = [
              '| Metric | Max | Min | Spread | Threshold |',
              '| --- | --- | --- | --- | --- |',
              ...rows,
            ].join('\n');
            const recommendations = report.recommendations.map((r) => `- ${r}`).join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[BIAS ALERT ${alertLevel.toUpperCase()}] Bias audit threshold exceeded for ${month}`,
              body: [
                `## Bias Audit Alert — ${month}`,
                ``,
                `**Alert Level**: ${alertLevel}`,
                `**Sessions analysed**: ${report.totalSessions} (${report.totalResponses} responses sampled)`,
                `**Report Artifact**: bias-audit-report-${month} — retained for 7 days in the workflow run artifacts`,
                `**Workflow Run**: ${context.payload.repository.html_url}/actions/runs/${context.runId}`,
                ``,
                report.summary,
                ``,
                `### Metrics Above Threshold`,
                ``,
                table,
                ``,
                `The numbers above are copied from \`ai/data/reports/bias-audit-${month}.json\` when this issue was created, so this issue stays complete after the artifact expires.`,
                ``,
                `### Recommendations`,
                ``,
                recommendations,
                ``,
                `### Action Required`,
                `1. Review the metrics above and identify which segments drive the spread`,
                `2. Investigate potential bias sources in the AI pipeline`,
                `3. Document mitigation steps taken`,
                ``,
                `This issue was automatically created by the Monthly Bias Audit workflow.`,
              ].join('\n'),
              labels: ['bias-alert', 'safety-critical', 'automated'],
            });
