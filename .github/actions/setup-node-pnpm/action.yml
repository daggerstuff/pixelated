name: Setup Node.js with pnpm
description: |
  Setup Node.js, pnpm (via pnpm/action-setup), cache the pnpm store, and
  optionally install native build dependencies and/or project dependencies.

  Replaces the 6-step boilerplate (setup pnpm → setup Node → get store path
  → cache store → native deps → install deps) used across 10+ workflow files.

inputs:
  node-version:
    description: Node.js version to install (e.g. '24.16.0')
    required: true
  pnpm-version:
    description: |
      Specific pnpm version to install. When empty the pnpm/action-setup
      reads the version from the package.json packageManager field.
    required: false
    default: ''
  cache-key-prefix:
    description: |
      Optional prefix for the pnpm-store cache key, e.g. 'v2' from
      PNPM_CACHE_VERSION. Produces key with the prefix inserted between
      'pnpm-store-v2-' and the hash-based portion for manual cache busting.
    required: false
    default: ''
  install-native-deps:
    description: |
      Install python3, build-essential, and node-gyp required by native
      addon compilation.
    required: false
    default: 'true'
  clean-node-modules:
    description: |
      Run rm -rf node_modules before install to fix stale lockfile
      artifacts (needed when switching between workspaces or lockfiles).
    required: false
    default: 'false'
  install-deps:
    description: |
      Run PNPM_CONFIG_TRUST_LOCKFILE=true pnpm install --no-frozen-lockfile
      after setup is complete. Set to 'false' when a custom install command
      (e.g. --ignore-scripts) is needed. Such a caller installs on its own and
      therefore never publishes the store either: the save is gated on this
      input, so a job that skipped the install cannot cache an empty store.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        run_install: false
        version: ${{ inputs.pnpm-version || '' }}

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Get pnpm store path
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Restore pnpm store
      id: pnpm-store-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: >-
          ${{ runner.os }}-pnpm-store-v2${{ inputs.cache-key-prefix != '' &&
          format('-{0}', inputs.cache-key-prefix) || '' }}-${{
          hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-v2${{ inputs.cache-key-prefix != '' &&
          format('-{0}', inputs.cache-key-prefix) || '' }}-

    - name: Clean pnpm workspace artifacts
      if: ${{ inputs.clean-node-modules == 'true' }}
      shell: bash
      run: rm -rf node_modules

    - name: Install native build dependencies
      if: ${{ inputs.install-native-deps == 'true' }}
      shell: bash
      run: |
        # node-gyp needs python3, make and a C++ compiler, all of which the runner
        # image already provides. Only reach for apt when one is genuinely missing:
        # a blanket `apt-get update` also refreshes the image's vendor sources, and
        # packages.microsoft.com answers 403 intermittently for ubuntu-26.04, which
        # fails this step before any of this repository's code runs.
        missing=""
        for bin in python3 make g++; do
          command -v "$bin" >/dev/null || missing="$missing $bin"
        done
        if [ -n "$missing" ]; then
          echo "installing missing build tools:$missing"
          sudo apt-get update
          sudo apt-get install -y python3 build-essential
        fi
        npm install -g node-gyp

    - name: Install dependencies
      if: ${{ inputs.install-deps == 'true' }}
      shell: bash
      env:
        PNPM_CONFIG_TRUST_LOCKFILE: 'true'
      run: pnpm install --no-frozen-lockfile

    # Only staging publishes the store. Every branch used to save its own
    # ~770 MB entry keyed by its lockfile hash, and the account's Actions
    # storage quota refused all artifact uploads. Branches still restore the
    # newest matching store; only staging writes new entries.
    #
    # This runs after the install so the entry holds the populated store, and it
    # reuses the key the restore looked up: pnpm can rewrite the lockfile during
    # install, and the save must not land under a hash nobody will look up.
    - name: Save pnpm store
      if: >-
        github.ref == 'refs/heads/staging' && inputs.install-deps == 'true' &&
        steps.pnpm-store-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ steps.pnpm-store-cache.outputs.cache-primary-key }}
