# Dependabot configuration for security updates and version management
# Documentation: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Keep GitHub Actions updates restricted to approved vendor/action families.
  # This avoids auto-updating GitHub-owned actions that may introduce runtime deprecation
  # warnings before we are ready to migrate them.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: '/'
    groups:
      trusted-actions:
        patterns:
          - 'actions/*'
          - 'aquasecurity/*'
          - 'bridgecrewio/*'
          - 'google-github-actions/*'
          - 'codecov/*'
          - 'pnpm/*'
          - 'astral-sh/*'
        update-types:
          - 'patch'
          - 'minor'
          - 'major'
    labels:
      - 'dependencies'
      - 'github-actions'
  # NPM/Node.js - Aggressive security update schedule
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '03:00'
    open-pull-requests-limit: 10
    pull-request-branch-name:
      separator: '/'
    rebase-strategy: 'auto'
    commit-message:
      prefix: 'chore(deps):'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'pnpm'
    groups:
      # Group all production patch updates for easier management
      production-patches:
        dependency-type: 'production'
        update-types:
          - 'patch'
      # Minor version updates
      production-minor:
        dependency-type: 'production'
        update-types:
          - 'minor'
      # Security patches for development dependencies
      security-patches-dev:
        dependency-type: 'development'
        update-types:
          - 'patch'
      development-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
      # Major versions - group separately for review
      major-updates:
        update-types:
          - 'major'
    ignore:
      # UnoCSS packages are pinned in package.json overrides. Dependabot cannot
      # update them synchronously with the overrides, causing install conflicts.
      - dependency-name: 'unocss'
        update-types:
          - 'version-update:semver-patch'
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      - dependency-name: '@unocss/*'
        update-types:
          - 'version-update:semver-patch'
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      # terser is embedded as a peer dep in Vite/Astro lock entries; Dependabot
      # cannot update it in isolation. Manage via Vite/Astro upgrades instead.
      - dependency-name: 'terser'
        update-types:
          - 'version-update:semver-patch'
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      # hono patch bumps fail pnpm minimumReleaseAge supply-chain policy checks
      # when Dependabot resolves freshly published releases into the lockfile.
      - dependency-name: 'hono'
        update-types:
          - 'version-update:semver-patch'
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      # path-to-regexp is pinned to 6.3.0 via overrides while also listed as a
      # direct devDependency at 8.4.2; Dependabot cannot reconcile the versions.
      - dependency-name: 'path-to-regexp'
        update-types:
          - 'version-update:semver-patch'
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      # typescript-eslint bumps fail pnpm minimumReleaseAge supply-chain policy
      # checks when Dependabot resolves freshly published releases into the lockfile.
      - dependency-name: 'typescript-eslint'
        update-types:
          - 'version-update:semver-patch'
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      - dependency-name: '@typescript-eslint/*'
        update-types:
          - 'version-update:semver-patch'
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      # ai bumps fail pnpm minimumReleaseAge supply-chain policy checks when
      # Dependabot resolves freshly published releases into the lockfile.
      - dependency-name: 'ai'
        update-types:
          - 'version-update:semver-patch'
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      - dependency-name: '@ai-sdk/*'
        update-types:
          - 'version-update:semver-patch'
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      # @astrojs/node publishes frequently; Dependabot updates fail pnpm
      # minimumReleaseAge supply-chain policy checks within 24 hours.
      - dependency-name: '@astrojs/node'
        update-types:
          - 'version-update:semver-patch'
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      # @cloudflare/workers-types publishes daily; Dependabot updates fail
      # pnpm minimumReleaseAge supply-chain policy checks within 24 hours.
      - dependency-name: '@cloudflare/workers-types'
        update-types:
          - 'version-update:semver-patch'
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      # @aws-sdk/* publishes frequently; Dependabot updates fail pnpm
      # minimumReleaseAge supply-chain policy checks within 24 hours.
      - dependency-name: '@aws-sdk/*'
        update-types:
          - 'version-update:semver-patch'
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      # @opentelemetry/* publishes frequently; Dependabot updates fail pnpm
      # minimumReleaseAge supply-chain policy checks within 24 hours.
      - dependency-name: '@opentelemetry/*'
        update-types:
          - 'version-update:semver-patch'
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      # vue and @vue/* publish frequently; Dependabot updates fail pnpm
      # minimumReleaseAge supply-chain policy checks within 24 hours.
      - dependency-name: 'vue'
        update-types:
          - 'version-update:semver-patch'
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      - dependency-name: '@vue/*'
        update-types:
          - 'version-update:semver-patch'
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      # jotai patch bumps fail pnpm minimumReleaseAge supply-chain policy checks
      # when Dependabot resolves freshly published releases into the lockfile.
      - dependency-name: 'jotai'
        update-types:
          - 'version-update:semver-patch'
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      # joi major (17→18) is grouped with graphql (16→17) in major-updates;
      # pnpm peers check fails because @graphql-yoga/plugin-persisted-operations
      # and graphql-request don't support graphql@17 yet.
      - dependency-name: 'joi'
        update-types:
          - 'version-update:semver-major'

  # UV - Daily security updates (pyproject.toml + uv.lock)
  - package-ecosystem: 'uv'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '03:00'
    open-pull-requests-limit: 10
    pull-request-branch-name:
      separator: '/'
    rebase-strategy: 'auto'
    commit-message:
      prefix: 'chore(deps):'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'python'
      - 'uv'
    groups:
      uv:
        patterns:
          - '*'
    ignore:
      # cryptography 50 conflicts with data-designer-engine caps (<=49) until NeMo
      # ships a release compatible with cryptography 50. Ignore entirely (not just
      # version-update types) so grouped security jobs do not fail resolution.
      - dependency-name: 'cryptography'
      # Security patches through 1.6.x pin pypdf~=6.10.1; project requires
      # pypdf>=6.14.2 for CVE fixes. Upgrading local-deep-research to 1.8+
      # conflicts with data-designer pandas/pyarrow constraints.
      - dependency-name: 'local-deep-research'
      # litellm 1.84.0+ caps openai<3.0.0 but project requires openai>=3.1.0.
      # The uv override-dependencies pins litellm to 1.83.0 (the last release
      # without the openai<3.0.0 cap). Ignore entirely (not just version-update
      # types) so grouped security jobs do not fail resolution. Revisit when
      # openpipe-art ships a release compatible with litellm 1.84.0+ or when
      # litellm relaxes the openai upper bound.
      - dependency-name: 'litellm'

  - package-ecosystem: 'uv'
    directory: '/apps/web/src/lib/ai/bias-detection/python-service'
    schedule:
      interval: 'daily'
      time: '03:00'
    open-pull-requests-limit: 10
    pull-request-branch-name:
      separator: '/'
    rebase-strategy: 'auto'
    commit-message:
      prefix: 'chore(deps):'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'python'
      - 'uv'
    groups:
      uv:
        patterns:
          - '*'

  - package-ecosystem: 'uv'
    directory: '/apps/web/src/lib/ai/multimodal-bias-detection/python-service'
    schedule:
      interval: 'daily'
      time: '03:00'
    open-pull-requests-limit: 10
    pull-request-branch-name:
      separator: '/'
    rebase-strategy: 'auto'
    commit-message:
      prefix: 'chore(deps):'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'python'
      - 'uv'
    groups:
      uv:
        patterns:
          - '*'
    ignore:
      # moviepy 2.x pins pillow<12; this service requires pillow>=12.3.0 for CVE fixes.
      - dependency-name: 'moviepy'
      # Stale security alerts trigger security_update_not_needed once setuptools is current.
      - dependency-name: 'setuptools'
      # The `lightning` package switched from calendar versioning (2022.x) to
      # semver (2.x). PEP 440 considers 2.x < 2022.6.15, so the GHSA advisory
      # for `< 2022.6.15` false-positives on all 2.x releases. We pin
      # lightning>=2.6.5 in pyproject.toml to address the real CVEs
      # (=2.6.2, =2.6.3 insecure deserialization); this ignore suppresses the
      # false-positive advisory so Dependabot security jobs can succeed.
      - dependency-name: 'lightning'
