name: Feature request
description: Propose a new capability or an improvement to an existing one
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the proposal. The design system is documented in DESIGN.md
        (zero-chroma, 0px radius, dark-first) and the product framing in
        PRODUCT.md — proposals that fit the doctrine land faster.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description:
        Who is affected (therapist, supervisor, educator, admin, agent) and what
        can they not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description:
        What should exist instead. Sketches or bullet points are fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
    validations:
      required: false
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Frontend (web app)
        - pe backend API (FastAPI)
        - Admin dashboard
        - AI / LLM services
        - Agents (session/qa/pipeline)
        - CI / build
        - Infrastructure / deploy
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: No PHI, patient data, or credentials appear in this report.
          required: true
