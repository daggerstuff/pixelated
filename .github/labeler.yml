# Automatic PR labeling (actions/labeler). Only default GitHub labels are
# referenced so the configuration works on any repository without label setup.
version: v1

labels:
  - label: bug
    files:
      - apps/web/src/lib/.*fix.*
      - apps/web/src/lib/.*bug.*
  - label: documentation
    files:
      - docs/**
      - apps/web/src/content-store/docs/**
      - apps/web/src/pages/docs/**
      - '*.md'
      - '**/*.md'
      - '**/AGENTS.md'
  - label: enhancement
    files:
      - apps/web/src/pages/**
      - apps/web/src/components/**
