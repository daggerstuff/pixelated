          slo_target: "99.95"

      # --- redis-exporter (99.9%) ---
      - record: slo:avbl_error:ratio_rate5m
        expr: 1 - avg_over_time(up{job="redis-exporter"}[5m])
        labels:
          service: redis-exporter
          slo_target: "99.9"
      - record: slo:avbl_error:ratio_rate30m
