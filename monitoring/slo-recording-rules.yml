          service: postgres-exporter
          slo_target: "99.95"
      - record: slo:avbl_error:ratio_rate1h
        expr: 1 - avg_over_time(up{job="postgres-exporter"}[1h])
        labels:
          service: postgres-exporter
          slo_target: "99.95"
      - record: slo:avbl_error:ratio_rate6h
