# SLO Recording Rules — Pixelated Empathy
#
# Records SLI error ratios, latency values, and burn rates for all
# customer-facing services. Follows the Google SRE multi-window
# multi-burn-rate pattern for error-budget tracking.
#
# SLO targets and error budgets are defined in:
#   docs/enterprise/runbooks/slo-definitions.md
#
# Burn-rate windows (for 30-day compliance period):
#   5m + 1h  → fast burn (page)   — 2% budget in 1h  → 14.4x
#   30m + 6h → medium burn (page) — 5% budget in 6h → 6x
#   6h + 3d  → slow burn (ticket) — 10% budget in 3d → 3x
#
# Services:
#   99.9%  SLO (budget 0.001):  pixelated-app, ai-service, redis-exporter,
#                              node-exporter, foresight-mcp
#   99.95% SLO (budget 0.0005): postgres-exporter, caddy

groups:
  # ============================================================
  # Group 1: Availability SLI — error ratio per service per window
  # ============================================================
  - name: slo-availability-sli
    rules:
      # --- pixelated-app (99.9%) ---
      - record: slo:avbl_error:ratio_rate5m
        expr: 1 - avg_over_time(up{job="pixelated-app"}[5m])
        labels:
          service: pixelated-app
          slo_target: "99.9"
      - record: slo:avbl_error:ratio_rate30m
        expr: 1 - avg_over_time(up{job="pixelated-app"}[30m])
        labels:
          service: pixelated-app
          slo_target: "99.9"
      - record: slo:avbl_error:ratio_rate1h
        expr: 1 - avg_over_time(up{job="pixelated-app"}[1h])
        labels:
          service: pixelated-app
          slo_target: "99.9"
      - record: slo:avbl_error:ratio_rate6h
        expr: 1 - avg_over_time(up{job="pixelated-app"}[6h])
