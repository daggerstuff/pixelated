  # ============================================================
  # Group 2: Request error SLI — 5xx ratio for HTTP services
  # ============================================================
  - name: slo-request-error-sli
    rules:
      # --- pixelated-app request error rate (99.9%, budget 0.001) ---
      - record: slo:req_error:ratio_rate5m
        expr: |
          sum(rate(http_requests_total{job="pixelated-app",status=~"5.."}[5m]))
          /
          sum(rate(http_requests_total{job="pixelated-app"}[5m]))
        labels:
          service: pixelated-app
          slo_target: "99.9"
      - record: slo:req_error:ratio_rate30m
        expr: |
          sum(rate(http_requests_total{job="pixelated-app",status=~"5.."}[30m]))
          /
          sum(rate(http_requests_total{job="pixelated-app"}[30m]))
        labels:
          service: pixelated-app
          slo_target: "99.9"
      - record: slo:req_error:ratio_rate1h
        expr: |
          sum(rate(http_requests_total{job="pixelated-app",status=~"5.."}[1h]))
          /
          sum(rate(http_requests_total{job="pixelated-app"}[1h]))
        labels:
          service: pixelated-app
          slo_target: "99.9"
      - record: slo:req_error:ratio_rate6h
        expr: |
          sum(rate(http_requests_total{job="pixelated-app",status=~"5.."}[6h]))
          /
          sum(rate(http_requests_total{job="pixelated-app"}[6h]))
        labels:
          service: pixelated-app
          slo_target: "99.9"
      - record: slo:req_error:ratio_rate24h
        expr: |
          sum(rate(http_requests_total{job="pixelated-app",status=~"5.."}[24h]))
          /
          sum(rate(http_requests_total{job="pixelated-app"}[24h]))
        labels:
          service: pixelated-app
          slo_target: "99.9"
      - record: slo:req_error:ratio_rate3d
        expr: |
          sum(rate(http_requests_total{job="pixelated-app",status=~"5.."}[3d]))
          /
          sum(rate(http_requests_total{job="pixelated-app"}[3d]))
        labels:
          service: pixelated-app
          slo_target: "99.9"

      # --- ai-service request error rate (99.9%, budget 0.001) ---
      - record: slo:req_error:ratio_rate5m
        expr: |
          sum(rate(http_requests_total{job="ai-service",status=~"5.."}[5m]))
          /
          sum(rate(http_requests_total{job="ai-service"}[5m]))
        labels:
