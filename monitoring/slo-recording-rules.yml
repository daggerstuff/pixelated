      - record: slo:avbl_burn_rate:6h
        expr: slo:avbl_error:ratio_rate6h{service="foresight-mcp"} / 0.001
        labels:
          service: foresight-mcp
      - record: slo:avbl_burn_rate:24h
        expr: slo:avbl_error:ratio_rate24h{service="foresight-mcp"} / 0.001
        labels:
          service: foresight-mcp
      - record: slo:avbl_burn_rate:3d
        expr: slo:avbl_error:ratio_rate3d{service="foresight-mcp"} / 0.001
        labels:
          service: foresight-mcp

      # 99.95% SLO services (budget 0.0005) — burn_rate = error_ratio / 0.0005
      # --- postgres-exporter ---
      - record: slo:avbl_burn_rate:5m
        expr: slo:avbl_error:ratio_rate5m{service="postgres-exporter"} / 0.0005
        labels:
          service: postgres-exporter
      - record: slo:avbl_burn_rate:30m
        expr: slo:avbl_error:ratio_rate30m{service="postgres-exporter"} / 0.0005
        labels:
          service: postgres-exporter
      - record: slo:avbl_burn_rate:1h
        expr: slo:avbl_error:ratio_rate1h{service="postgres-exporter"} / 0.0005
        labels:
          service: postgres-exporter
      - record: slo:avbl_burn_rate:6h
        expr: slo:avbl_error:ratio_rate6h{service="postgres-exporter"} / 0.0005
        labels:
          service: postgres-exporter
      - record: slo:avbl_burn_rate:24h
        expr: slo:avbl_error:ratio_rate24h{service="postgres-exporter"} / 0.0005
        labels:
          service: postgres-exporter
      - record: slo:avbl_burn_rate:3d
        expr: slo:avbl_error:ratio_rate3d{service="postgres-exporter"} / 0.0005
        labels:
          service: postgres-exporter

      # --- caddy ---
      - record: slo:avbl_burn_rate:5m
        expr: slo:avbl_error:ratio_rate5m{service="caddy"} / 0.0005
        labels:
          service: caddy
      - record: slo:avbl_burn_rate:30m
        expr: slo:avbl_error:ratio_rate30m{service="caddy"} / 0.0005
        labels:
          service: caddy
      - record: slo:avbl_burn_rate:1h
        expr: slo:avbl_error:ratio_rate1h{service="caddy"} / 0.0005
        labels:
          service: caddy
      - record: slo:avbl_burn_rate:6h
        expr: slo:avbl_error:ratio_rate6h{service="caddy"} / 0.0005
        labels:
          service: caddy
      - record: slo:avbl_burn_rate:24h
        expr: slo:avbl_error:ratio_rate24h{service="caddy"} / 0.0005
        labels:
