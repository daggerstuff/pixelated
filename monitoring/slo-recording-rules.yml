  # ============================================================
  # Group 5: Request error burn rate — for HTTP services
  # ============================================================
  - name: slo-request-error-burn-rate
    rules:
      # 99.9% SLO (budget 0.001)
      # --- pixelated-app ---
      - record: slo:req_burn_rate:5m
        expr: slo:req_error:ratio_rate5m{service="pixelated-app"} / 0.001
        labels:
          service: pixelated-app
      - record: slo:req_burn_rate:30m
        expr: slo:req_error:ratio_rate30m{service="pixelated-app"} / 0.001
        labels:
          service: pixelated-app
      - record: slo:req_burn_rate:1h
        expr: slo:req_error:ratio_rate1h{service="pixelated-app"} / 0.001
        labels:
          service: pixelated-app
      - record: slo:req_burn_rate:6h
        expr: slo:req_error:ratio_rate6h{service="pixelated-app"} / 0.001
        labels:
          service: pixelated-app
      - record: slo:req_burn_rate:24h
        expr: slo:req_error:ratio_rate24h{service="pixelated-app"} / 0.001
        labels:
          service: pixelated-app
      - record: slo:req_burn_rate:3d
        expr: slo:req_error:ratio_rate3d{service="pixelated-app"} / 0.001
        labels:
          service: pixelated-app

      # --- ai-service ---
      - record: slo:req_burn_rate:5m
        expr: slo:req_error:ratio_rate5m{service="ai-service"} / 0.001
        labels:
          service: ai-service
      - record: slo:req_burn_rate:30m
        expr: slo:req_error:ratio_rate30m{service="ai-service"} / 0.001
        labels:
          service: ai-service
      - record: slo:req_burn_rate:1h
        expr: slo:req_error:ratio_rate1h{service="ai-service"} / 0.001
        labels:
          service: ai-service
      - record: slo:req_burn_rate:6h
        expr: slo:req_error:ratio_rate6h{service="ai-service"} / 0.001
        labels:
          service: ai-service
      - record: slo:req_burn_rate:24h
        expr: slo:req_error:ratio_rate24h{service="ai-service"} / 0.001
        labels:
          service: ai-service
      - record: slo:req_burn_rate:3d
        expr: slo:req_error:ratio_rate3d{service="ai-service"} / 0.001
        labels:
          service: ai-service

  # ============================================================
  # Group 6: Error budget remaining (24h window approximation)
  # ============================================================
  - name: slo-error-budget
    rules:
      # Error budget consumed over 24h as percentage of monthly budget
      # monthly_budget = error_budget * (30 * 24 * 60) minutes
      # consumed = error_ratio_24h * (24 * 60) minutes
      # remaining% = 1 - (consumed / monthly_budget)
      #            = 1 - (error_ratio_24h * 1440) / (error_budget * 43200)
      #            = 1 - (error_ratio_24h / error_budget) / 30
      #            = 1 - burn_rate_24h / 30

      # 99.9% services (budget 0.001)
      - record: slo:error_budget_remaining:pct
        expr: clamp_max(1 - (slo:avbl_error:ratio_rate24h{service="pixelated-app"} / 0.001) / 30, 1)
        labels:
          service: pixelated-app
          slo_target: "99.9"
      - record: slo:error_budget_remaining:pct
        expr: clamp_max(1 - (slo:avbl_error:ratio_rate24h{service="ai-service"} / 0.001) / 30, 1)
        labels:
          service: ai-service
          slo_target: "99.9"
      - record: slo:error_budget_remaining:pct
        expr: clamp_max(1 - (slo:avbl_error:ratio_rate24h{service="redis-exporter"} / 0.001) / 30, 1)
        labels:
          service: redis-exporter
          slo_target: "99.9"
      - record: slo:error_budget_remaining:pct
        expr: clamp_max(1 - (slo:avbl_error:ratio_rate24h{service="node-exporter"} / 0.001) / 30, 1)
        labels:
          service: node-exporter
          slo_target: "99.9"
      - record: slo:error_budget_remaining:pct
        expr: clamp_max(1 - (slo:avbl_error:ratio_rate24h{service="foresight-mcp"} / 0.001) / 30, 1)
        labels:
          service: foresight-mcp
          slo_target: "99.9"

      # 99.95% services (budget 0.0005)
      - record: slo:error_budget_remaining:pct
        expr: clamp_max(1 - (slo:avbl_error:ratio_rate24h{service="postgres-exporter"} / 0.0005) / 30, 1)
        labels:
          service: postgres-exporter
          slo_target: "99.95"
      - record: slo:error_budget_remaining:pct
        expr: clamp_max(1 - (slo:avbl_error:ratio_rate24h{service="caddy"} / 0.0005) / 30, 1)
        labels:
          service: caddy
          slo_target: "99.95"
