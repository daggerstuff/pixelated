        labels:
          service: ai-service
          slo_target: "99.9"
      - record: slo:req_error:ratio_rate6h
        expr: |
          sum(rate(http_requests_total{job="ai-service",status=~"5.."}[6h]))
          /
          sum(rate(http_requests_total{job="ai-service"}[6h]))
        labels:
          service: ai-service
          slo_target: "99.9"
      - record: slo:req_error:ratio_rate24h
        expr: |
          sum(rate(http_requests_total{job="ai-service",status=~"5.."}[24h]))
          /
          sum(rate(http_requests_total{job="ai-service"}[24h]))
        labels:
