      - record: slo:avbl_error:ratio_rate3d
        expr: 1 - avg_over_time(up{job="redis-exporter"}[3d])
        labels:
          service: redis-exporter
          slo_target: "99.9"

      # --- node-exporter (99.9%) ---
      - record: slo:avbl_error:ratio_rate5m
        expr: 1 - avg_over_time(up{job="node-exporter"}[5m])
        labels:
          service: node-exporter
          slo_target: "99.9"
      - record: slo:avbl_error:ratio_rate30m
        expr: 1 - avg_over_time(up{job="node-exporter"}[30m])
        labels:
          service: node-exporter
          slo_target: "99.9"
      - record: slo:avbl_error:ratio_rate1h
        expr: 1 - avg_over_time(up{job="node-exporter"}[1h])
        labels:
          service: node-exporter
          slo_target: "99.9"
      - record: slo:avbl_error:ratio_rate6h
        expr: 1 - avg_over_time(up{job="node-exporter"}[6h])
        labels:
