          slo_target: "99.9"
      - record: slo:req_error:ratio_rate3d
        expr: |
          sum(rate(http_requests_total{job="ai-service",status=~"5.."}[3d]))
          /
          sum(rate(http_requests_total{job="ai-service"}[3d]))
        labels:
          service: ai-service
          slo_target: "99.9"

  # ============================================================
  # Group 3: Latency SLI — per HTTP service per window
  # ============================================================
  - name: slo-latency-sli
    rules:
      # --- pixelated-app p95 latency (target: ≤500ms = 0.5s) ---
      - record: slo:latency_p95:seconds5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="pixelated-app"}[5m]))
          )
        labels:
          service: pixelated-app
          slo_target_ms: "500"
      - record: slo:latency_p95:seconds30m
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="pixelated-app"}[30m]))
          )
        labels:
          service: pixelated-app
          slo_target_ms: "500"
      - record: slo:latency_p95:seconds1h
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="pixelated-app"}[1h]))
          )
        labels:
          service: pixelated-app
          slo_target_ms: "500"
      - record: slo:latency_p95:seconds6h
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="pixelated-app"}[6h]))
          )
        labels:
          service: pixelated-app
          slo_target_ms: "500"
      - record: slo:latency_p95:seconds24h
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="pixelated-app"}[24h]))
          )
        labels:
          service: pixelated-app
          slo_target_ms: "500"

      # --- ai-service average inference latency (target: ≤2s) ---
      - record: slo:latency_avg:seconds5m
        expr: |
          rate(ai_inference_duration_seconds_sum[5m])
          /
          rate(ai_inference_duration_seconds_count[5m])
        labels:
          service: ai-service
          slo_target_ms: "2000"
      - record: slo:latency_avg:seconds30m
        expr: |
          rate(ai_inference_duration_seconds_sum[30m])
          /
          rate(ai_inference_duration_seconds_count[30m])
        labels:
          service: ai-service
          slo_target_ms: "2000"
      - record: slo:latency_avg:seconds1h
        expr: |
          rate(ai_inference_duration_seconds_sum[1h])
          /
          rate(ai_inference_duration_seconds_count[1h])
        labels:
          service: ai-service
          slo_target_ms: "2000"
      - record: slo:latency_avg:seconds6h
        expr: |
          rate(ai_inference_duration_seconds_sum[6h])
          /
          rate(ai_inference_duration_seconds_count[6h])
        labels:
          service: ai-service
          slo_target_ms: "2000"
      - record: slo:latency_avg:seconds24h
        expr: |
          rate(ai_inference_duration_seconds_sum[24h])
          /
          rate(ai_inference_duration_seconds_count[24h])
        labels:
          service: ai-service
          slo_target_ms: "2000"

  # ============================================================
  # Group 4: Availability burn rate — error_ratio / error_budget
  # ============================================================
  - name: slo-availability-burn-rate
    rules:
      # 99.9% SLO services (budget 0.001) — burn_rate = error_ratio / 0.001
      # --- pixelated-app ---
      - record: slo:avbl_burn_rate:5m
        expr: slo:avbl_error:ratio_rate5m{service="pixelated-app"} / 0.001
        labels:
          service: pixelated-app
      - record: slo:avbl_burn_rate:30m
        expr: slo:avbl_error:ratio_rate30m{service="pixelated-app"} / 0.001
        labels:
          service: pixelated-app
      - record: slo:avbl_burn_rate:1h
        expr: slo:avbl_error:ratio_rate1h{service="pixelated-app"} / 0.001
        labels:
          service: pixelated-app
      - record: slo:avbl_burn_rate:6h
        expr: slo:avbl_error:ratio_rate6h{service="pixelated-app"} / 0.001
        labels:
          service: pixelated-app
      - record: slo:avbl_burn_rate:24h
        expr: slo:avbl_error:ratio_rate24h{service="pixelated-app"} / 0.001
        labels:
          service: pixelated-app
      - record: slo:avbl_burn_rate:3d
        expr: slo:avbl_error:ratio_rate3d{service="pixelated-app"} / 0.001
        labels:
          service: pixelated-app

      # --- ai-service ---
      - record: slo:avbl_burn_rate:5m
        expr: slo:avbl_error:ratio_rate5m{service="ai-service"} / 0.001
        labels:
          service: ai-service
      - record: slo:avbl_burn_rate:30m
        expr: slo:avbl_error:ratio_rate30m{service="ai-service"} / 0.001
        labels:
          service: ai-service
      - record: slo:avbl_burn_rate:1h
        expr: slo:avbl_error:ratio_rate1h{service="ai-service"} / 0.001
        labels:
          service: ai-service
      - record: slo:avbl_burn_rate:6h
        expr: slo:avbl_error:ratio_rate6h{service="ai-service"} / 0.001
        labels:
          service: ai-service
      - record: slo:avbl_burn_rate:24h
        expr: slo:avbl_error:ratio_rate24h{service="ai-service"} / 0.001
        labels:
          service: ai-service
      - record: slo:avbl_burn_rate:3d
        expr: slo:avbl_error:ratio_rate3d{service="ai-service"} / 0.001
        labels:
          service: ai-service

      # --- redis-exporter ---
      - record: slo:avbl_burn_rate:5m
        expr: slo:avbl_error:ratio_rate5m{service="redis-exporter"} / 0.001
        labels:
          service: redis-exporter
      - record: slo:avbl_burn_rate:30m
        expr: slo:avbl_error:ratio_rate30m{service="redis-exporter"} / 0.001
        labels:
          service: redis-exporter
      - record: slo:avbl_burn_rate:1h
        expr: slo:avbl_error:ratio_rate1h{service="redis-exporter"} / 0.001
        labels:
          service: redis-exporter
      - record: slo:avbl_burn_rate:6h
        expr: slo:avbl_error:ratio_rate6h{service="redis-exporter"} / 0.001
        labels:
          service: redis-exporter
      - record: slo:avbl_burn_rate:24h
        expr: slo:avbl_error:ratio_rate24h{service="redis-exporter"} / 0.001
        labels:
          service: redis-exporter
      - record: slo:avbl_burn_rate:3d
        expr: slo:avbl_error:ratio_rate3d{service="redis-exporter"} / 0.001
        labels:
          service: redis-exporter

      # --- node-exporter ---
      - record: slo:avbl_burn_rate:5m
        expr: slo:avbl_error:ratio_rate5m{service="node-exporter"} / 0.001
        labels:
          service: node-exporter
      - record: slo:avbl_burn_rate:30m
        expr: slo:avbl_error:ratio_rate30m{service="node-exporter"} / 0.001
        labels:
          service: node-exporter
      - record: slo:avbl_burn_rate:1h
        expr: slo:avbl_error:ratio_rate1h{service="node-exporter"} / 0.001
        labels:
          service: node-exporter
      - record: slo:avbl_burn_rate:6h
        expr: slo:avbl_error:ratio_rate6h{service="node-exporter"} / 0.001
        labels:
          service: node-exporter
      - record: slo:avbl_burn_rate:24h
        expr: slo:avbl_error:ratio_rate24h{service="node-exporter"} / 0.001
        labels:
          service: node-exporter
      - record: slo:avbl_burn_rate:3d
