[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deslop-cli"
version = "0.2.0"
description = "Clean AI slop from JSON/JSONL datasets. Remove filler phrases, detect low-density text, optionally rewrite with local LLMs."
readme = "README.md"
license = "MIT"
authors = [{ name = "Pixelated Empathy" }]
requires-python = ">=3.12"
dependencies = ["rich>=13.0.0", "pyyaml>=6.0", "typer>=0.15.0"]
keywords = [
  "ai",
  "dataset",
  "cleaning",
  "slop",
  "llm",
  "preprocessing",
  "json",
  "jsonl",
  "nlp",
  "data-engineering",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/daggerstuff/pixelated"
Documentation = "https://github.com/daggerstuff/pixelated/tree/main/packages/deslop"
Repository = "https://github.com/daggerstuff/pixelated"
Issues = "https://github.com/daggerstuff/pixelated/issues"
Changelog = "https://github.com/daggerstuff/pixelated/blob/main/packages/deslop/CHANGELOG.md"

[project.scripts]
deslop = "deslop.cli:main"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["deslop"]
