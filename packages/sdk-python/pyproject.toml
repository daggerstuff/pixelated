[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelated-empathy-sdk"
version = "1.0.0"
description = "Auto-generated Python SDK for the Pixelated Empathy API"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Pixelated Empathy", email = "dev@pixelatedempathy.com" }]
requires-python = ">=3.12"
dependencies = ["httpx>=0.24.0", "pydantic>=2.0", "typing-extensions>=4.5"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/daggerstuff/pixelated"
Documentation = "https://docs.pixelatedempathy.com/api"
Repository = "https://github.com/daggerstuff/pixelated"

[tool.setuptools.packages.find]
include = ["pixelated_empathy_sdk*"]
