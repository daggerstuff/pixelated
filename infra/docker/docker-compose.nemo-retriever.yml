# NVIDIA NIM for Retrieval (Embedding & Reranking)
# GPU-optimized by default (uses TensorRT-LLM and Triton Inference Server).

services:
  nim-embedding:
    image: nvcr.io/nim/nvidia/nv-embedqa-e5-v5:latest
    container_name: nim-embedding
    ports:
      - '8080:8000'
    environment:
      - NGC_API_KEY=${NVIDIA_API_KEY:?NVIDIA_API_KEY must be set for NeMo services}
      - NIM_API_KEY=${NVIDIA_API_KEY:?NVIDIA_API_KEY must be set for NeMo services}
      - NGC_USER_NAME=$$oauthtoken
      - NIM_MANIFEST_ALLOW_UNSAFE=1
      - NIM_MODEL_PROFILE=f7391ddbcb95b2406853526b8e489fedf20083a2420563ca3e65358ff417b10f
    volumes:
      - nim_model_cache:/opt/nim/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - nemo-network

  nim-reranking:
    image: nvcr.io/nim/nvidia/llama-3.2-nv-rerankqa-1b-v2:latest
    container_name: nim-reranking
    ports:
      - '8081:8000'
    environment:
      - NGC_API_KEY=${NVIDIA_API_KEY:?NVIDIA_API_KEY must be set for NeMo services}
      - NIM_API_KEY=${NVIDIA_API_KEY:?NVIDIA_API_KEY must be set for NeMo services}
      - NGC_USER_NAME=$$oauthtoken
      - NIM_MANIFEST_ALLOW_UNSAFE=1
      - NIM_MODEL_PROFILE=f7391ddbcb95b2406853526b8e489fedf20083a2420563ca3e65358ff417b10f
    volumes:
      - nim_model_cache:/opt/nim/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - nemo-network

volumes:
  nim_model_cache:

networks:
  nemo-network:
    external: true
