# Docker Compose for PAL Inference Service
# Persona-Aware Alignment (PAL) two-stage Select-then-Generate inference.
# Defaults to stub LLM clients; override PAL_SELECTOR_ENDPOINT and
# PAL_GENERATOR_ENDPOINT for production LLM backends.
#
# Usage:
#   docker compose -f docker/docker-compose.pal-inference.yml up -d
#
# With production config:
#   docker compose -f docker/docker-compose.pal-inference.yml \
#     -f docker/docker-compose.pal-inference.prod.yml up -d

services:
  pal-inference:
    build:
      context: ../../
      dockerfile: ai/inference/api/Dockerfile
    container_name: pixelated-pal-inference
    restart: unless-stopped
    environment:
      - PAL_API_PORT=8010
      - PAL_LATENCY_BUDGET_SECONDS=${PAL_LATENCY_BUDGET_SECONDS:-2.0}
      # Uncomment and set these for production LLM backends:
      # - PAL_SELECTOR_ENDPOINT=${PAL_SELECTOR_ENDPOINT}
      # - PAL_SELECTOR_MODEL=${PAL_SELECTOR_MODEL:-gpt-4o-mini}
      # - PAL_GENERATOR_ENDPOINT=${PAL_GENERATOR_ENDPOINT}
      # - PAL_GENERATOR_MODEL=${PAL_GENERATOR_MODEL:-gpt-4o-mini}
      # - PAL_CANDIDATE_PERSONAS=${PAL_CANDIDATE_PERSONAS}
    ports:
      - '8010:8010'
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8010/health")']
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    networks:
      - inference-net

networks:
  inference-net:
    driver: bridge
