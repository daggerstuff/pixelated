run_jobs_local: true

entity_store_url: http://nemo-entity-store:8000
nemo_data_store_url: http://nemo-datastore:3000

training:
  workspace_dir: '/mount/workspace'

customizationTargets:
  overrideExistingTargets: true
  targets:
    mistralai/mistral-7b-instruct-v0.3@1.0:
      name: mistral-7b-instruct-v0.3@1.0
      namespace: mistralai
      enabled: true
      base_model: mistralai/mistral-7b-instruct-v0.3
      model_path: mistral-7b-v03-instruct
      model_uri: ngc://nvidia/nemo/mistral-7b-v03-instruct:1.0
      num_parameters: 7000000000
      precision: bf16-mixed

customizationConfigTemplates:
  overrideExistingTemplates: true
  templates:
    mistralai/mistral-7b-instruct-v0.3@quickstart:
      name: mistral-7b-instruct-v0.3@quickstart
      namespace: mistralai
      target: mistralai/mistral-7b-instruct-v0.3@1.0
      training_options:
        - training_type: sft
          finetuning_type: lora
          num_gpus: 0
          num_nodes: 1
          tensor_parallel_size: 1
          micro_batch_size: 1
      max_seq_length: 4096
      prompt_template: '{prompt} {completion}'
