# NVIDIA NeMo Aligner for training and alignment (RLHF, DPO)
# Provides environment for training specialized empathetic and objective LLMs.

services:
  nemo-aligner:
    image: nvcr.io/nvidia/nemo/nemo-aligner:latest
    container_name: nemo-aligner
    entrypoint: /bin/bash
    tty: true
    volumes:
      - ../../ai/training:/workspace/training
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
    networks:
      - nemo-network

networks:
  nemo-network:
    external: true
