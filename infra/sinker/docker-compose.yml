# infra/sinker/docker-compose.yml — pixelated-ollama container
# V100S-PCIE-32GB tune: NUM_PARALLEL=2, NUM_CTX=8192, FLASH_ATTENTION=1
# Managed by infra-sinker milestone; do NOT edit without updating model_digest.lock

services:
  ollama:
    image: ollama/ollama:latest
    container_name: pixelated-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - /srv/sinker-ollama/data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_NUM_CTX=8192
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:11434/api/version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
