# infra/sinker/traefik/traefik.yml — static Traefik v3.1 config
# Managed by infra-sinker milestone.

# ─── Entry points ───────────────────────────────────────────────
entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ':443'
  traefik:
    address: ':8080'

# ─── API + Dashboard (localhost-only via 127.0.0.1:8082 mapping) ─
api:
  dashboard: false
  insecure: true # bound to :8080 which maps only to 127.0.0.1:8082

# ─── Ping (healthcheck) ─────────────────────────────────────────
ping:
  entryPoint: traefik

# ─── Logging ────────────────────────────────────────────────────
log:
  level: INFO
accessLog: {}

# ─── Providers ──────────────────────────────────────────────────
providers:
  docker:
    endpoint: 'unix:///var/run/docker.sock'
    exposedByDefault: false
    network: sinker-ollama_default
    watch: true
  file:
    directory: /etc/traefik/dynamic
    watch: true

# ─── ACME (Let's Encrypt via Cloudflare DNS-01) ────────────────
certificatesResolvers:
  letsencrypt-dns:
    acme:
      email: admin@pixelated.love
      storage: /acme.json
      dnsChallenge:
        provider: cloudflare
        delayBeforeCheck: 10
        resolvers:
          - '1.1.1.1:53'
          - '8.8.8.8:53'
