apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pixelated-empathy-ingress
  namespace: pixelated-empathy
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.middlewares: pixelated-empathy-security-headers@kubernetescrd,pixelated-empathy-rate-limit@kubernetescrd,pixelated-empathy-cors@kubernetescrd,pixelated-empathy-request-size-limit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: pixelatedempathy.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pixelated-empathy
                port:
                  number: 80
    - host: www.pixelatedempathy.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pixelated-empathy
                port:
                  number: 80
