# Blue-green Service — routes traffic to the active slot.
# The `slot` selector is patched by the blue-green deploy script
# to switch traffic between blue and green deployments.
apiVersion: v1
kind: Service
metadata:
  name: pixelated-empathy-api
  namespace: pixelated-empathy
  labels:
    app: pixelated-empathy-api
spec:
  selector:
    app: pixelated-empathy-api
    slot: blue
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
  type: ClusterIP
