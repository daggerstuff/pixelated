# ---------------------------------------------------------------------------
# Umami secrets — External Secrets Operator
#
# Syncs from Vault: kv/pixelated-empathy/umami
#   - url       → postgres connection string for the umami database
#   - app-secret→ random 32+ byte string (session signing / data encryption)
#
# Provision the Postgres side first:
#   CREATE DATABASE umami;
#   CREATE USER umami WITH ENCRYPTED PASSWORD '<from-vault>';
#   GRANT ALL PRIVILEGES ON DATABASE umami TO umami;
# ---------------------------------------------------------------------------

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: umami-secrets
  namespace: pixelated-empathy
  labels:
    app.kubernetes.io/name: umami
    app.kubernetes.io/component: analytics
    app.kubernetes.io/part-of: pixelated-empathy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: umami-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DATABASE_URL: "{{ .url }}"
        APP_SECRET: "{{ .appSecret }}"
  data:
    - secretKey: url
      remoteRef:
        key: kv/pixelated-empathy/umami
        property: url
    - secretKey: appSecret
      remoteRef:
        key: kv/pixelated-empathy/umami
        property: app-secret
