# Blue-green deployment for Civo — Green slot (inactive by default)
# Scaled to 0 replicas: green sits idle, and idle pods starve the 2-node
# cluster of resources during blue rollouts (maxSurge pod couldn't schedule,
# progress deadline exceeded). CI flips green replicas up at switch time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pixelated-empathy-green
  namespace: pixelated-empathy
  labels:
    app: pixelated-empathy
    slot: green
spec:
  replicas: 0
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: pixelated-empathy
      slot: green
  template:
    metadata:
      labels:
        app: pixelated-empathy
        slot: green
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: dockerhub-registry-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pixelated-empathy
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          image: pixelatedempathy/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4321
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
          envFrom:
            - configMapRef:
                name: pixelated-empathy-config
                optional: true
            - secretRef:
                name: pixelated-empathy-secrets
                optional: true
          volumeMounts:
            - name: cloudflare-tls
              mountPath: /etc/ssl/cloudflare
              readOnly: true
            - name: tmp
              mountPath: /tmp
          env:
            - name: PORT
              value: "4321"
            - name: HTTPS_PORT
              value: "8443"
            - name: HTTPS_CERT_PATH
              value: "/etc/ssl/cloudflare/tls.crt"
            - name: HTTPS_KEY_PATH
              value: "/etc/ssl/cloudflare/tls.key"
            - name: DEPLOYMENT_SLOT
              value: "green"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: cloudflare-tls
          secret:
            secretName: cloudflare-origin-tls
            optional: true
        - name: tmp
          emptyDir: {}
