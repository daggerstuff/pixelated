apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pixelated-empathy

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment-blue.yaml
  - deployment-green.yaml
  - service.yaml
  - ingress.yaml
  # Traefik Middleware CRDs — referenced by ingress.yaml router.middlewares annotation.
  # Without these CRDs the middleware references are dangling and security headers never apply.
  - middleware-security-headers.yaml
  - middleware-cors.yaml
  - middleware-rate-limit.yaml
  - middleware-request-size-limit.yaml
  # Self-hosted Umami analytics (replaced Rybbit SaaS)
  - umami-deployment.yaml
  - umami-service.yaml
  - umami-ingress.yaml
  # umami-secrets is created by CI (deploy-civo.yml) from GH secrets
  # UMAMI_DATABASE_URL / UMAMI_APP_SECRET — ESO/Vault path documented in
  # umami-external-secret.yaml for future migration.

# Rewrite `pixelatedempathy/api:latest` placeholder in deployment.yaml.
# Tag must match the deployed build (see CI IMAGE_TAG).
images:
  - name: pixelatedempathy/api
    newName: pixelatedempathy/api
    newTag: staging

# Secrets are managed separately via CI/CD or kustomize secrets generator
# secrets:
#   - secrets.yaml
