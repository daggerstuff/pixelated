apiVersion: apps/v1
kind: Deployment
metadata:
  name: pixelated-empathy
  namespace: pixelated-empathy
  labels:
    app: pixelated-empathy
spec:
  replicas: 2
  # Atomic rollout: keep ALL old pods serving until new ones (with the new
  # full dist/) are Ready before any old pod is terminated. This prevents the
  # default RollingUpdate from briefly serving a mix of old and new dist/
  # trees behind the Service, where HTML from one pod references a _astro/*
  # asset that only exists in the other pod's image (404s on CSS/JS during/after
  # a deploy). maxUnavailable=0 guarantees no pod goes down pre-swap; maxSurge=1
  # brings the new pod up first (within the 2-replica budget) on a small node.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: pixelated-empathy
  template:
    metadata:
      labels:
        app: pixelated-empathy
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: dockerhub-registry-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pixelated-empathy
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          # Pin to an IMMUTABLE reference (digest or semver), not :latest.
          # :latest + imagePullPolicy: Always lets two pods pull different
          # builds, so each bakes a different dist/ _astro hash and the Service
          # round-robins requests between inconsistent asset sets (404s).
          # The deploy pipeline MUST substitute the built image digest here.
          image: pixelatedempathy/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4321
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
          envFrom:
            - configMapRef:
                name: pixelated-empathy-config
            - secretRef:
                name: pixelated-empathy-secrets
          volumeMounts:
            - name: cloudflare-tls
              mountPath: /etc/ssl/cloudflare
              readOnly: true
            - name: tmp
              mountPath: /tmp
          env:
            - name: PORT
              value: "4321"
            - name: HTTPS_PORT
              value: "8443"
            - name: HTTPS_CERT_PATH
              value: "/etc/ssl/cloudflare/tls.crt"
            - name: HTTPS_KEY_PATH
              value: "/etc/ssl/cloudflare/tls.key"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: cloudflare-tls
          secret:
            secretName: cloudflare-origin-tls
        - name: tmp
          emptyDir: {}
