# Pixelated Empathy Agent Fleet — standalone Docker Compose
#
# This is the fleet's production home: one host runs all 8 eve agents plus the
# MongoDB and Redis they depend on. Images are published to Docker Hub by
# .github/workflows/build-images.yml from a green staging CI run, so a host
# only needs `docker compose pull` to track CI. Adding `--build` builds the
# same agents from the checkout instead (local dev, or an unreleased change).
#
# Usage:
#   cp agents/deploy/.env.agents.example agents/deploy/.env.agents
#   $EDITOR agents/deploy/.env.agents
#   docker compose -f agents/deploy/docker-compose.yaml up -d
#   docker compose -f agents/deploy/docker-compose.yaml logs -f
#   docker compose -f agents/deploy/docker-compose.yaml down
#
# Image coordinates default to docker.io/pixelatedempathy/<agent>-agent:latest.
# Override AGENT_IMAGE_PREFIX / AGENT_IMAGE_TAG to pin a different tag (for
# example `AGENT_IMAGE_TAG=staging`).
services:
  # --- Supporting services ---

  mongo:
    image: mongo:latest
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  redis:
    image: redis:latest
    ports:
      - '6379:6379'
    restart: unless-stopped

  # --- Agent fleet ---

  supervisor-agent:
    image: ${AGENT_IMAGE_PREFIX:-docker.io/pixelatedempathy}/supervisor-agent:${AGENT_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: agents/Dockerfile
      args:
        AGENT_DIR: agents/supervisor-agent
    ports:
      - '2000:2000'
    env_file: .env.agents
    environment:
      - PORT=2000
      - HOST=0.0.0.0
      - NODE_ENV=production
    restart: unless-stopped
    depends_on: [mongo, redis]

  advisor-agent:
    image: ${AGENT_IMAGE_PREFIX:-docker.io/pixelatedempathy}/advisor-agent:${AGENT_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: agents/Dockerfile
      args:
        AGENT_DIR: agents/advisor-agent
    ports:
      - '2005:2000'
    env_file: .env.agents
    environment:
      - PORT=2000
      - HOST=0.0.0.0
      - NODE_ENV=production
    restart: unless-stopped

  content-agent:
    image: ${AGENT_IMAGE_PREFIX:-docker.io/pixelatedempathy}/content-agent:${AGENT_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: agents/Dockerfile
      args:
        AGENT_DIR: agents/content-agent
    ports:
      - '2010:2000'
    env_file: .env.agents
    environment:
      - PORT=2000
      - HOST=0.0.0.0
      - NODE_ENV=production
    restart: unless-stopped

  eve-agent:
    image: ${AGENT_IMAGE_PREFIX:-docker.io/pixelatedempathy}/eve-agent:${AGENT_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: agents/Dockerfile
      args:
