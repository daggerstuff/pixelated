      - NODE_ENV=production
    restart: unless-stopped

  pipeline-agent:
    image: ${AGENT_IMAGE_PREFIX:-docker.io/pixelatedempathy}/pipeline-agent:${AGENT_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: agents/Dockerfile
      args:
        AGENT_DIR: agents/pipeline-agent
    ports:
      - '2025:2000'
    env_file: .env.agents
    environment:
      - PORT=2000
      - HOST=0.0.0.0
      - NODE_ENV=production
    restart: unless-stopped

  qa-agent:
    image: ${AGENT_IMAGE_PREFIX:-docker.io/pixelatedempathy}/qa-agent:${AGENT_IMAGE_TAG:-latest}
    build:
      context: ../..
