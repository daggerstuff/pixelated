# Pixelated Empathy agent fleet — K8s namespace, secrets, and config maps.
#
# Apply secrets from a sealed-secrets manager or kubectl create secret
# with --from-literal for each key. This file is a template showing
# the required secret structure; do NOT commit real values.
---
apiVersion: v1
kind: Namespace
metadata:
  name: pixelated-empathy
---
# Cloudflare Workers AI credentials (inference + model access)
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-workers-ai
  namespace: pixelated-empathy
type: Opaque
stringTemplate:
  account-id: REPLACE_WITH_CF_ACCOUNT_ID
  api-key: REPLACE_WITH_CF_AI_API_KEY
---
# Eve HTTP Basic auth credentials
apiVersion: v1
kind: Secret
metadata:
  name: eve-auth
  namespace: pixelated-empathy
type: Opaque
stringTemplate:
  username: REPLACE_WITH_EVE_AUTH_USERNAME
  password: REPLACE_WITH_EVE_AUTH_PASSWORD
---
# MongoDB connection string
apiVersion: v1
kind: Secret
metadata:
  name: mongodb
  namespace: pixelated-empathy
type: Opaque
stringTemplate:
  uri: REPLACE_WITH_MONGODB_URI
---
# Slack bot credentials (for agents using Slack channel)
apiVersion: v1
kind: Secret
metadata:
  name: slack-agent
  namespace: pixelated-empathy
type: Opaque
stringTemplate:
  bot-token: REPLACE_WITH_SLACK_BOT_TOKEN
  signing-secret: REPLACE_WITH_SLACK_SIGNING_SECRET
---
# Linear API credentials (for agents using Linear channel)
apiVersion: v1
kind: Secret
metadata:
  name: linear-agent
  namespace: pixelated-empathy
type: Opaque
stringTemplate:
  access-token: REPLACE_WITH_LINEAR_ACCESS_TOKEN
  webhook-secret: REPLACE_WITH_LINEAR_WEBHOOK_SECRET
---
# Docker Hub image pull credentials
apiVersion: v1
kind: Secret
metadata:
  name: dockerhub-registry-credentials
  namespace: pixelated-empathy
type: kubernetes.io/dockerconfigjson
stringTemplate:
  .dockerconfigjson: REPLACE_WITH_DOCKER_CONFIG_JSON
