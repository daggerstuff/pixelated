# qa-agent (PIX-3958) K8s manifest.
#
# Deploys the qa-agent as a long-running Node service. Two deployments
# ride on the same image:
#
#   * qa-agent          : daily-review scheduler entry
#   * qa-agent-worker   : ephemeral worker (set replicas to 0 if not used)
#
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qa-agent
  namespace: pixelated-empathy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qa-agent
  template:
    metadata:
      labels:
        app: qa-agent
    spec:
      imagePullSecrets:
        - name: dockerhub-registry-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          image: docker.io/pixelatedempathy/qa-agent:latest
          ports:
            - containerPort: 2000
              name: http
          env:
            - name: PORT
              value: "2000"
            - name: HOST
              value: "0.0.0.0"
            - name: NODE_ENV
              value: production
            - name: CLOUDFLARE_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: cloudflare-workers-ai
                  key: account-id
            - name: CLOUDFLARE_AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudflare-workers-ai
                  key: api-key
            - name: WORKERS_AI_AGENT_MODEL
              value: "@cf/moonshotai/kimi-k2.7-code"
            - name: FORESIGHT_URL
              value: http://foresight:8765/mcp
            - name: EVE_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: eve-auth
                  key: username
            - name: EVE_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eve-auth
                  key: password
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: slack-agent
                  key: bot-token
            - name: SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: slack-agent
                  key: signing-secret
            - name: LINEAR_AGENT_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: linear-agent
                  key: access-token
            - name: LINEAR_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: linear-agent
                  key: webhook-secret
          startupProbe:
            httpGet:
              path: /eve/v1/health
              port: 2000
            # Gives the server up to 90 s to complete its cold start
            # (30 attempts × 3 s period). The readiness/liveness probes
            # don't start running until startupProbe succeeds.
            periodSeconds: 3
            failureThreshold: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /eve/v1/health
              port: 2000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /eve/v1/health
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: eve-data
              mountPath: /agent/.eve
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: eve-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: qa-agent
  namespace: pixelated-empathy
spec:
  selector:
    app: qa-agent
  ports:
    - name: http
      port: 80
      targetPort: 2000
---
# Cron reroutes "30 23 * * *" if the platform is Vercel: Vercel Cron is
# automatically wired by eve. Outside Vercel, deployers must point their
# host's scheduler at POST /eve/v1/dev/schedules/daily-review.
