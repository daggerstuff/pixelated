# Conversation Rehearsal Session Orchestrator eve agent.
#
# Deploys the agent as a long-running Node service via the eve standard
# Nitro build output. Two deployments run in this manifest:
#
#   * session-agent       (the orchestrator app)
#   * session-agent-mc    (model-context sidecar, optional — pulls from
#                          FORESIGHT_URL via local stdio->http bridge)
#
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-agent
  namespace: pixelated-empathy
  labels:
    app: session-agent
    eve-version: "0.18"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: session-agent
  template:
    metadata:
      labels:
        app: session-agent
    spec:
      imagePullSecrets:
        - name: dockerhub-registry-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          image: docker.io/pixelatedempathy/session-agent:latest
          ports:
            - containerPort: 2000
              name: http
          env:
            - name: PORT
              value: "2000"
            - name: HOST
              value: "0.0.0.0"
            - name: NODE_ENV
              value: production
            - name: CLOUDFLARE_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: cloudflare-workers-ai
                  key: account-id
            - name: CLOUDFLARE_AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudflare-workers-ai
                  key: api-key
            - name: WORKERS_AI_AGENT_MODEL
              value: "@cf/moonshotai/kimi-k2.7-code"
            - name: FORESIGHT_URL
              value: http://foresight:8765/mcp
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb
                  key: uri
            - name: MONGODB_DB_NAME
              value: pixelated_empathy
            - name: EVE_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: eve-auth
                  key: username
            - name: EVE_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eve-auth
                  key: password
            - name: PIXELATED_SESSION_MCP_URL
              value: http://session-mcp:8766
          startupProbe:
            httpGet:
              path: /eve/v1/health
              port: 2000
            # Gives the server up to 90 s to complete its cold start
            # (30 attempts × 3 s period). The readiness/liveness probes
            # don't start running until startupProbe succeeds.
            periodSeconds: 3
            failureThreshold: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /eve/v1/health
              port: 2000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /eve/v1/health
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: eve-data
              mountPath: /agent/.eve
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: eve-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: session-agent
  namespace: pixelated-empathy
spec:
  selector:
    app: session-agent
  ports:
    - name: http
      port: 80
      targetPort: 2000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: session-agent
  namespace: pixelated-empathy
  annotations:
    # Auth is handled inside the agent; the ingress passes through.
    nginx.ingress.kubernetes.io/proxy-body-size: 4m
spec:
  rules:
    - host: agents.pixelated.internal
      http:
        paths:
          - path: /eve/v1/session
            pathType: Prefix
            backend:
              service:
                name: session-agent
                port:
                  number: 80
          - path: /eve/v1/health
            pathType: Prefix
            backend:
              service:
                name: session-agent
                port:
                  number: 80
