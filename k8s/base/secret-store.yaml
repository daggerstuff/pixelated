# ---------------------------------------------------------------------------
# SecretStore — External Secrets Operator backend configuration
#
# Configures ESO to fetch secrets from a secret manager (Vault, AWS Secrets
# Manager, or Doppler) and sync them into Kubernetes Secret resources.
#
# Before applying:
#   1. Install ESO: helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
#   2. Create backend auth credentials (see secret-store-creds below)
#   3. kubectl apply -f k8s/base/secret-store.yaml
#
# @see https://external-secrets.io/latest/provider/hashicorp-vault/
# @see https://external-secrets.io/latest/provider/aws-secrets-manager/
# ---------------------------------------------------------------------------

---
# ---------------------------------------------------------------------------
# ClusterSecretStore — Vault backend (primary)
# ---------------------------------------------------------------------------
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  namespace: pixelated-empathy
spec:
  provider:
    vault:
      server: "https://vault.pixelatedempathy.com"
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets

---
# ---------------------------------------------------------------------------
# ClusterSecretStore — AWS Secrets Manager backend (alternative)
# ---------------------------------------------------------------------------
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  namespace: pixelated-empathy
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets

---
# ---------------------------------------------------------------------------
# SecretStore — Doppler backend (dev/staging alternative)
# Doppler provides a simpler UX for smaller teams.
# ---------------------------------------------------------------------------
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: doppler-backend
  namespace: pixelated-empathy
spec:
  provider:
    doppler:
      auth:
        secretRef:
          dopplerToken:
            name: doppler-token
            key: token
      config: "pixelated-empathy-prod"
