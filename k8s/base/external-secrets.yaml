# ---------------------------------------------------------------------------
# ExternalSecret CRDs — declare secrets to be synced from external stores
#
# ESO watches these CRDs and creates/updates the target K8s Secret
# (`pixelated-empathy-secrets`) from the external store backend.
#
# The `secretStoreRef` determines which backend to use. Uncomment the
# appropriate store for your environment (vault-backend, aws-secrets-manager,
# or doppler-backend).
#
# @see https://external-secrets.io/latest/guides/
# ---------------------------------------------------------------------------

---
# Main application secrets — replaces k8s/base/secrets.yaml
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pixelated-empathy-secrets
  namespace: pixelated-empathy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: pixelated-empathy-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DATABASE_URL: "postgresql://{{ .dbUser }}:{{ .dbPassword }}@{{ .dbHost }}:5432/{{ .dbName }}"
        REDIS_URL: "redis://:{{ .redisPassword }}@pixelated-empathy-redis:6379/0"
        REDIS_PASSWORD: "{{ .redisPassword }}"
        JWT_SECRET: "{{ .jwtSecret }}"
        API_KEY: "{{ .apiKey }}"
        AUTH0_DOMAIN: "{{ .auth0Domain }}"
        AUTH0_CLIENT_ID: "{{ .auth0ClientId }}"
        AUTH0_CLIENT_SECRET: "{{ .auth0ClientSecret }}"
        AUTH0_MANAGEMENT_CLIENT_ID: "{{ .auth0MgmtClientId }}"
        AUTH0_MANAGEMENT_CLIENT_SECRET: "{{ .auth0MgmtClientSecret }}"
        ENCRYPTION_KEY: "{{ .encryptionKey }}"
  data:
    - secretKey: dbPassword
      remoteRef:
        key: kv/pixelated-empathy/database
        property: password
    - secretKey: dbUser
      remoteRef:
        key: kv/pixelated-empathy/database
        property: user
    - secretKey: dbHost
      remoteRef:
        key: kv/pixelated-empathy/database
        property: host
    - secretKey: dbName
      remoteRef:
        key: kv/pixelated-empathy/database
        property: name
    - secretKey: redisPassword
      remoteRef:
        key: kv/pixelated-empathy/redis
        property: password
    - secretKey: jwtSecret
      remoteRef:
        key: kv/pixelated-empathy/auth
        property: jwt-secret
    - secretKey: apiKey
      remoteRef:
        key: kv/pixelated-empathy/auth
        property: api-key
    - secretKey: auth0Domain
      remoteRef:
        key: kv/pixelated-empathy/auth0
        property: domain
    - secretKey: auth0ClientId
      remoteRef:
        key: kv/pixelated-empathy/auth0
        property: client-id
    - secretKey: auth0ClientSecret
      remoteRef:
        key: kv/pixelated-empathy/auth0
        property: client-secret
    - secretKey: auth0MgmtClientId
      remoteRef:
        key: kv/pixelated-empathy/auth0
        property: management-client-id
    - secretKey: auth0MgmtClientSecret
      remoteRef:
        key: kv/pixelated-empathy/auth0
        property: management-client-secret
    - secretKey: encryptionKey
      remoteRef:
        key: kv/pixelated-empathy/security
        property: encryption-key

---
# Redis secrets (if Redis needs separate management)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pixelated-redis-secrets
  namespace: pixelated-empathy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: pixelated-redis-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        REDIS_PASSWORD: "{{ .redisPassword }}"
  data:
    - secretKey: redisPassword
      remoteRef:
        key: kv/pixelated-empathy/redis
        property: password
