apiVersion: apps/v1
kind: Deployment
metadata:
  name: pixelated-empathy
  namespace: pixelated-empathy
  labels:
    app: pixelated-empathy
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxSurge=0: never create more than 2 pods simultaneously.
      # Without this, k8s tries to schedule a 3rd pod during rollout,
      # which can fail on a small node and cause the new pod to Terminate.
      maxSurge: 0
      # maxUnavailable=1: tolerate 1 pod down during the swap.
      maxUnavailable: 1
  selector:
    matchLabels:
      app: pixelated-empathy
  template:
    metadata:
      labels:
        app: pixelated-empathy
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: dockerhub-registry-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: pixelated-empathy
          image: pixelatedempathy/api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4321
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
          envFrom:
            - configMapRef:
                name: pixelated-empathy-config
            - secretRef:
                name: pixelated-empathy-secrets
          volumeMounts:
            - name: cloudflare-tls
              mountPath: /etc/ssl/cloudflare
              readOnly: true
          env:
            - name: PORT
              value: "4321"
            - name: HTTPS_PORT
              value: "8443"
            - name: HTTPS_CERT_PATH
              value: "/etc/ssl/cloudflare/tls.crt"
            - name: HTTPS_KEY_PATH
              value: "/etc/ssl/cloudflare/tls.key"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: cloudflare-tls
          secret:
            secretName: cloudflare-origin-tls
