apiVersion: v1
kind: Service
metadata:
  name: pixelated-empathy
  namespace: pixelated-empathy
  labels:
    app: pixelated-empathy
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 4321
      protocol: TCP
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP
  selector:
    app: pixelated-empathy
    slot: blue
