[package]
name = "pixelated-pipeline-proof"
version = "0.1.0"
edition = "2021"
description = "SP1 guest program for proving data pipeline integrity in the Pixelated Empathy FHE layer"
license = "MIT"

[dependencies]
sp1-zkvm = "4.1"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
