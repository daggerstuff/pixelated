# NVIDIA NeMo Curator for Data Refinement
# Part of Priority #1

services:
  nemo-curator:
    image: ${NEMO_CURATOR_IMAGE:-nvcr.io/nvidia/nemo-curator:25.09}
    container_name: nemo-curator
    entrypoint: /bin/bash
    tty: true
    env_file:
      - ../.env
    volumes:
      - ../ai/data/raw:/workspace/raw:ro
      - ../ai/data/curated:/workspace/curated
      # Shared tool workspaces
      - ../ai/tools/DataDesigner:/workspace/data-designer:ro
      - ../ai/tools/NemoCurator:/workspace/nemo-curator
      # Legacy paths (kept for backward compat with existing scripts)
      - ../ai/datasets:/workspace/datasets
      - ../ai/pipelines/orchestrator/processing:/workspace/scripts
    environment:
      - HF_HOME=/workspace/.cache/huggingface
    networks:
      - nemo-network

  # Optional: Data Designer sidecar for the 2-stage pipeline (same network)
  data-designer:
    image: ${DATA_DESIGNER_IMAGE:-python:3.12-slim}
    container_name: data-designer
    working_dir: /workspace
    command: sleep infinity
    tty: true
    env_file:
      - ../.env
    volumes:
      - ../ai/tools/DataDesigner:/workspace/data-designer:ro
      - ../ai/data/curated:/workspace/curated:ro
      - ../ai/data/synthetic:/workspace/synthetic
      - ../scripts/data/designer/configs:/workspace/designer-configs:ro
    environment:
      - HF_HOME=/workspace/.cache/huggingface
    networks:
      - nemo-network
    profiles:
      - tools

networks:
  nemo-network:
    name: pixelated-nemo
    driver: bridge
