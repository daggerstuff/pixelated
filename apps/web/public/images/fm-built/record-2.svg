<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#0a0a0a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <!-- Edges -->
  <line x1="400" y1="100" x2="200" y2="250" stroke="#ff8533" stroke-width="1.5"/>
  <line x1="400" y1="100" x2="600" y2="250" stroke="#ff8533" stroke-width="1.5"/>
  <line x1="200" y1="250" x2="100" y2="400" stroke="#ff8533" stroke-width="1.5"/>
  <line x1="200" y1="250" x2="300" y2="400" stroke="#ff8533" stroke-width="1.5"/>
  <line x1="600" y1="250" x2="500" y2="400" stroke="#ff8533" stroke-width="1.5"/>
  <line x1="600" y1="250" x2="700" y2="400" stroke="#ff8533" stroke-width="1.5"/>
  <!-- Nodes -->
  <circle cx="400" cy="100" r="10" fill="#0a0a0a" stroke="#8fb8a2" stroke-width="2"/>
  <circle cx="200" cy="250" r="10" fill="#0a0a0a" stroke="#8fb8a2" stroke-width="2"/>
  <circle cx="600" cy="250" r="10" fill="#0a0a0a" stroke="#8fb8a2" stroke-width="2"/>
  <circle cx="100" cy="400" r="10" fill="#0a0a0a" stroke="#8fb8a2" stroke-width="2"/>
  <circle cx="300" cy="400" r="10" fill="#0a0a0a" stroke="#8fb8a2" stroke-width="2"/>
  <circle cx="500" cy="400" r="10" fill="#0a0a0a" stroke="#8fb8a2" stroke-width="2"/>
  <circle cx="700" cy="400" r="10" fill="#0a0a0a" stroke="#8fb8a2" stroke-width="2"/>
</svg>