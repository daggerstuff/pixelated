<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#0a0a0a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <!-- Concentric circles -->
  <circle cx="400" cy="300" r="50" fill="none" stroke="#ff8533" stroke-width="2"/>
  <circle cx="400" cy="300" r="100" fill="none" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="400" cy="300" r="150" fill="none" stroke="#8fb8a2" stroke-width="2"/>
  <circle cx="400" cy="300" r="200" fill="none" stroke="#ff8533" stroke-width="2" stroke-dasharray="5,5"/>
  <circle cx="400" cy="300" r="250" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5,5"/>
</svg>