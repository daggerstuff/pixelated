<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#0a0a0a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <!-- Stacked layers -->
  <rect x="100" y="100" width="600" height="400" rx="2" ry="2" fill="#ff8533"/>
  <rect x="110" y="110" width="600" height="400" rx="2" ry="2" fill="#22d3ee"/>
  <rect x="120" y="120" width="600" height="400" rx="2" ry="2" fill="#8fb8a2"/>
  <rect x="130" y="130" width="600" height="400" rx="2" ry="2" fill="#ff8533"/>
  <rect x="140" y="140" width="600" height="400" rx="2" ry="2" fill="#22d3ee"/>
</svg>