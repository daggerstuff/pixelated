[build-system]
requires = [
  "setuptools>=83.0.0",
  "wheel>=0.48.0",
] # Fixes CVE-2024-6345, CVE-2025-47273, CVE-2022-40898
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-bias-detection-service"
version = "1.0.0"
description = "Multi-modal bias detection service for images, audio, and video content"
authors = [{ name = "Pixelated Team", email = "team@pixelatedempathy.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.52.3",
  "gunicorn>=26.0.0",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.15.0",
"python-dotenv>=1.2.2",
  "structlog>=26.1.0",
  "prometheus-client>=0.26.0",
  # Sentry SDK for error tracking and metrics
  # Reference: https://docs.sentry.io/platforms/python/metrics/
  "sentry-sdk[fastapi]>=2.68.0",
  # Multi-modal AI Dependencies
  "torch>=2.13.0",
  "torchvision>=0.21.0",
  "torchaudio>=2.8.0",
  "transformers>=5.15.0",
  "opencv-python>=5.0.0.93",
  "pillow>=12.3.0", # Fixes CVE-2026-25990 (Out-of-bounds Write in PSD image parser)
  "librosa>=0.10.0",
  "soundfile>=0.14.0",
  "moviepy>=1.0.3",
  # Vision Models
  "timm>=1.0.28",
  "open-clip-torch>=3.3.0",
  "pytorch-lightning>=2.6.5", # Fixes CVE-2026-31221 (insecure deserialization RCE in load_from_checkpoint)
  "lightning>=2.6.5", # Security pin: ensures transitive lightning meta-package matches pytorch-lightning version
  # Audio Processing
  "speechbrain>=1.1.0",
  "pyannote.audio>=4.0.7",
  # Database and Caching
  "psycopg2-binary>=2.9.12",
  "redis>=8.1.0",
  "sqlalchemy>=2.0.52",
  "alembic>=1.19.1",
  # Utilities
  "httpx>=0.28.1",
  "aiohttp>=3.14.3",
  "ulid-py>=1.1.0",
  "tenacity>=9.1.4",
  "celery>=5.6.3",
  # Media Processing
  "numpy>=2.4.6",
  "pandas>=3.0.5",
  "scikit-learn>=1.9.0",
  "matplotlib>=3.11.1",
  "seaborn>=0.12.0",
  # Security: Pin transitive dependencies to secure versions
  "keras>=3.15.1", # Fixes GHSA-mq84-hjqx-cwf2, GHSA-28jp-44vh-q42h
  "starlette>=1.6.0", # Fixes GHSA-7f5h-v6xp-fcq8
  "werkzeug>=3.1.8", # Fixes GHSA-hgf8-39gv-g3f2 (Windows special device names vulnerability)
  "fonttools>=4.63.0", # Fixes GHSA-768j-98cg-p3fv (Arbitrary File Write and XML injection vulnerability)
  "urllib3>=2.7.0", # Fixes GHSA-gm62-xv2j-4w53, GHSA-2xpw-w6gg-jr37 (CVE-2025-66418, CVE-2025-66471)
]

[project.scripts]
app = "multimodal_bias_detection.app:app"

[project.urls]
Homepage = "https://pixelatedempathy.com"
Repository = "https://github.com/pixelated/multimodal-bias-detection-service"
Documentation = "https://docs.pixelatedempathy.com"

[tool.setuptools.packages.find]
where = ["."]
include = ["multimodal_bias_detection*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=multimodal_bias_detection --cov-report=term-missing --cov-report=html"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
