[project]
name = "pixelated-empathy-corpus"
version = "0.1.0"
description = "Synthetic clinical training corpus generator for Pixelated Empathy"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "ollama>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pixelated_empathy"]

[project.scripts]
corpus = "pixelated_empathy.cli:app"
