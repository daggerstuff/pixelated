version: "3.9"
services:
  deslop-saas:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DESLOP_LLM_ENDPOINT=
      - DESLOP_LLM_MODEL=
      # Optional: for OpenAI-compatible providers
      # - OPENAI_API_KEY=
      # - OLLAMA_API_KEY=
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
