[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deslop-saas"
version = "0.3.0"
description = "Deslop SaaS — HTTP API for cleaning AI slop from datasets. Scan, clean, preview, and regenerate JSON/JSONL data."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Pixelated" }]
keywords = ["ai-slop", "dataset", "hygiene", "fastapi", "jsonl", "llm"]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "typer>=0.15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27.0"]

[tool.setuptools]
packages = ["deslop", "deslop.rules", "app"]
