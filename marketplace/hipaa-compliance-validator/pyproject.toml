[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hipaa-compliance-validator"
version = "1.0.0"
description = "HIPAA Compliance Validator — PHI detection, encryption validation, audit trail logging, and compliance reporting"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Pixelated Empathy" },
]
keywords = ["hipaa", "compliance", "phi", "encryption", "audit-trail", "healthcare"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    "cryptography>=43.0.0",
]

[project.urls]
Homepage = "https://github.com/pixelated-empathy/hipaa-compliance-validator"

[tool.setuptools]
packages = ["app"]
