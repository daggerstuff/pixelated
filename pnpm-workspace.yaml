  - dompurify@3.2.4
  - axios@0.30.0
  - '@tootallnate/once@3.0.1'
  - nodemailer@8.0.4
  - dompurify@3.3.2
  - nodemailer@8.0.5
  - dompurify@3.3.4
  - axios@0.31.0
  - dompurify@3.4.0
  - axios@0.31.1
  - axios@0.30.3
overrides:
  path-to-regexp@>=4.0.0 <6.3.0: ^6.3.0
  yaml@>=2.0.0 <2.8.3: ^2.8.3
  '@opentelemetry/otlp-transformer@0.217.0>protobufjs': '8.0.2'
